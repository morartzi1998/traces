name = "traces-tripo"
main = "tripo-worker.js"
compatibility_date = "2024-11-01"

# The Tripo API key is a SECRET — do not put it here. Set it with:
#   npx wrangler secret put TRIPO_API_KEY

# Needed for the "scan with your phone" hand-off (see README). Create it with:
#   npx wrangler kv namespace create SESSIONS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "cc90d998d35c4111a21f2d4944dbb73b"

# Needed for the shared captures store — both the records themselves and
# the files attached to them (models, point clouds, thumbnails; capped at
# ~24MB each — see backend/README.md). Deliberately KV, not R2: R2 asks for
# a payment method on file even to stay within its free tier, KV doesn't.
[[kv_namespaces]]
binding = "CAPTURES"
id = "1d3ff60f4f974b379e127b44e63046a1"

