<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Capture your home</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/s01-welcome.css">
</head>
<body>

  <div class="screen">

    <nav class="nav-top">
      <div class="logo" tabindex="0">traces</div>
      <button class="nav-link" type="button">Archive</button>
    </nav>

    <main class="main">

      <div class="polaroid-stack">
        <div class="scan-meta">
          <div>[5 days ago]</div>
          <div>[alexss's scan]</div>
        </div>

        <div class="polaroid polaroid-back">
          <img src="assets/images/photo-souvenirs.png" alt="Souvenirs from Europe, blue and white china plates">
          <div class="polaroid-caption caption-back">souvenirs from europe</div>
        </div>

        <div class="polaroid polaroid-front">
          <img src="assets/images/photo-chandelier.png" alt="Old living room lamp, a brass chandelier">
          <div class="polaroid-caption caption-front">old living room lamp</div>
        </div>
      </div>

      <div class="hero-text">
        <h1 class="headline">
          <span class="cap">c</span>apture your<br>
          <span class="cap">home</span> and all<br>
          within it <span class="cap">forever</span>
        </h1>
        <button class="cta" type="button">+ add your capture</button>
      </div>

    </main>

    <nav class="nav-bottom">
      <button class="nav-link" type="button">Community</button>
      <button class="nav-link" type="button">About</button>
    </nav>

  </div>

</body>
</html>
