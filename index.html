<style>
  /* Entry loader — the archive polaroids fan out and float while the
     interface loads, then the whole splash fades into the welcome screen */
  .app-loader {
    position: fixed;
    inset: 0;
    z-index: 9990;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .app-loader.is-done { opacity: 0; visibility: hidden; }
</style>

<script src="js/grain.js?v=20260720w" defer></script>

<body>

  <div class="app-loader load-screen" id="appLoader" aria-hidden="true">

    <div class="load-strip">

      <figure class="load-polaroid" style="--tilt:3deg; --y:40px; --delay:.3s; z-index:6">

      <figure class="load-polaroid" style="--tilt:-2.5deg; --y:20px; --delay:.6s; z-index:5">

        <figcaption>20 year old bed</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:2deg; --y:0px; --delay:.15s; z-index:4">

        <figcaption>father's couch</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-3deg; --y:34px; --delay:.45s; z-index:3">
        <img src="assets/images/photo-teddy.png" alt="">
        <figcaption>childhood teddy</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:3.5deg; --y:8px; --delay:.7s; z-index:2">
        <img src="assets/images/photo-souvenirs.png" alt="">
        <figcaption>souvenirs from europe</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-2deg; --y:24px; --delay:.25s; z-index:1">
        <img src="assets/images/photo-cabinet.png" alt="">
        <figcaption>souvenirs storage</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:2.5deg; --y:16px; --delay:.5s; z-index:8">
        <img src="assets/images/photo-curtain.png" alt="">
        <figcaption>favorite corner</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-3.5deg; --y:30px; --delay:.1s; z-index:9">
        <img src="assets/images/photo-table.png" alt="">
        <figcaption>old table</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:4deg; --y:6px; --delay:.4s; z-index:10">
        <img src="assets/images/photo-television.png" alt="">
        <figcaption>living room tv</figcaption>
      </figure>
    </div>

    <p class="load-status">Loading&nbsp;...&nbsp;<span id="appLoaderPct">0</span>%</p>

  </div>

  <script>
    (function () {
      // show the entry splash once per browser session, then reveal the app
      var loader = document.getElementById("appLoader");
      if (sessionStorage.getItem("traces-loaded")) { loader.remove(); return; }
      var pct = 0;
      var label = document.getElementById("appLoaderPct");
      var t = setInterval(function () {
        pct += 1 + Math.floor(Math.random() * 3);
        if (pct >= 100) {
          pct = 100;
          clearInterval(t);
          try { sessionStorage.setItem("traces-loaded", "1"); } catch (e) {}
          setTimeout(function () {
            loader.classList.add("is-done");
            setTimeout(function () { loader.remove(); }, 650);
          }, 450);
        }
        label.textContent = pct;
      }, 90);
    })();
  </script>

  <div class="screen">

    <nav class="nav-top">
      <a class="logo nav-corner nav-corner--tl" href="index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('screens/gallery.html')">Archive</button>
    </nav>

    <main class="main">

      <div class="polaroid-stack" id="heroStack">
        <div class="scan-meta">
          <div>[5 days ago]</div>
          <div>[mishel's scan]</div>
        </div>

        <div class="polaroid polaroid-third" role="button" tabindex="0" data-key="teddy">

          <div class="polaroid-caption caption-third">childhood teddy</div>
        </div>

        <div class="polaroid polaroid-back" role="button" tabindex="0" data-key="souvenirs">
          <img src="assets/images/photo-souvenirs.png" alt="Souvenirs from Europe, blue and white china plates">
          <div class="polaroid-caption caption-back">souvenirs from europe</div>
        </div>

        <div class="polaroid polaroid-front" role="button" tabindex="0" data-key="chandelier">
          <img src="assets/images/photo-chandelier.png" alt="Old living room lamp, a brass chandelier">
          <div class="polaroid-caption caption-front">old living room lamp</div>
        </div>
      </div>

      <div class="hero-text">
        <h1 class="headline">
          <span class="cap">c</span>apture your<br>
          <span class="cap">home</span> and all<br>
          within it <span class="cap">forever</span>
        </h1>
        <button class="cta" type="button" onclick="goTo('screens/onboarding.html')">add your capture +</button>
      </div>

    </main>

    <nav class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('screens/community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('screens/about.html')">About</button>
    </nav>

  </div>

  <script>
    // the front/back/third polaroid slots keep their fixed CSS positions -
    // rotation just swaps which capture's photo/caption each slot is
    // currently showing, conveyor-style (front's content moves back, back's
    // moves to third, third gets whatever the next capture in line is)
    var HERO_ITEMS = [
      { key: "chandelier", img: "assets/images/photo-chandelier.png", title: "old living room lamp" },
      { key: "souvenirs",  img: "assets/images/photo-souvenirs.png",  title: "souvenirs from europe" },
      { key: "teddy",      img: "assets/images/photo-teddy.png",      title: "childhood teddy" },
      { key: "couch",      img: "assets/images/photo-couch.png",      title: "father's couch" },
      { key: "plant",      img: "assets/images/photo-orchid.png",     title: "mom's gifted plant" },
      { key: "bed",        img: "assets/images/photo-bed.png",        title: "20 year old bed" },
    ];

    (function () {
      var stack = document.getElementById("heroStack");
      var slots = [
        stack.querySelector(".polaroid-front"),
        stack.querySelector(".polaroid-back"),
        stack.querySelector(".polaroid-third"),
      ];
      var shown = [0, 1, 2]; // HERO_ITEMS index currently held by each slot
      var nextUp = 3;
      var paused = false;
      var timer = null;

      function applyContent(el, item) {
        var img = el.querySelector("img");
        img.src = item.img;
        img.alt = item.title;
        el.querySelector(".polaroid-caption").textContent = item.title;
        el.dataset.key = item.key;
      }

      function rotate() {
        if (paused) return;
        shown[0] = shown[1];
        shown[1] = shown[2];
        shown[2] = nextUp % HERO_ITEMS.length;
        nextUp++;
        // a brief fade rather than a hard swap, since the content changes
        // out from under whatever the visitor was just looking at
        slots.forEach(function (el, i) {
          el.classList.add("polaroid--swap");
          setTimeout(function () {
            applyContent(el, HERO_ITEMS[shown[i]]);
            el.classList.remove("polaroid--swap");
          }, 220);
        });
      }

      function restartTimer() {
        clearInterval(timer);
        timer = setInterval(rotate, 4500);
      }
      restartTimer();

      // pause while a visitor is actually looking at the stack, so the
      // caption they're mid-reading doesn't change under the cursor
      stack.addEventListener("mouseenter", function () { paused = true; });
      stack.addEventListener("mouseleave", function () { paused = false; });
      stack.addEventListener("focusin", function () { paused = true; });
      stack.addEventListener("focusout", function () { paused = false; });

      // the first tap on a background polaroid just brings it to the front
      // of the stack (so its own caption/photo become the focus) — only a
      // second tap on that same card (now on top, or already the default
      // front one) actually opens it, so browsing doesn't require leaving
      function selectWelcomePolaroid(card) {
        var key = card.dataset.key;
        var active = stack.querySelector(".polaroid.is-active");
        var isDefaultFront = card.classList.contains("polaroid-front") && !active;

        if (card.classList.contains("is-active") || isDefaultFront) {
          openObject(key, locationPrefix() + "object.html");
          return;
        }

        stack.querySelectorAll(".polaroid").forEach(function (item) {
          item.classList.remove("is-active");
        });
        card.classList.add("is-active");
        // a deliberate manual pick, not the auto-advance - give it a full
        // fresh interval before rotation resumes
        restartTimer();
      }

      slots.forEach(function (el) {
        el.addEventListener("click", function () { selectWelcomePolaroid(el); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectWelcomePolaroid(el); }
        });
      });
    })();
  </script>

</body>
</html>
