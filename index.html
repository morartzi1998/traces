<style>
  /* Entry loader — the archive polaroids fan out and float while the
     interface loads, then the whole splash fades into the welcome screen */
  .app-loader {
    position: fixed;
    inset: 0;
    z-index: 9990;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .app-loader.is-done { opacity: 0; visibility: hidden; }
</style>

      <figure class="load-polaroid" style="--tilt:2deg; --y:0px; --delay:.15s; z-index:4">

      <figure class="load-polaroid" style="--tilt:-3deg; --y:34px; --delay:.45s; z-index:3">

      <figure class="load-polaroid" style="--tilt:2.5deg; --y:16px; --delay:.5s; z-index:8">
        <img src="assets/images/photo-curtain.png" alt="">
        <figcaption>favorite corner</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-3.5deg; --y:30px; --delay:.1s; z-index:9">
        <img src="assets/images/photo-table.png" alt="">
        <figcaption>old table</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:4deg; --y:6px; --delay:.4s; z-index:10">
        <img src="assets/images/photo-television.png" alt="">
        <figcaption>living room tv</figcaption>
      </figure>
    </div>

    <p class="load-status">Loading&nbsp;...&nbsp;<span id="appLoaderPct">0</span>%</p>

  </div>

  <script>
    (function () {
      // show the entry splash once per browser session, then reveal the app.
      // The counter is tied to the REAL load: it crawls while the page is
      // still fetching and sprints to 100 the moment everything is ready —
      // so the splash lasts exactly as long as the loading it stands for
      // (plus the short minimum the polaroid drop animation needs), instead
      // of a fixed fake count that held the screen hostage either way
      var loader = document.getElementById("appLoader");
      if (sessionStorage.getItem("traces-loaded")) { loader.remove(); return; }
      var pct = 0;
      var ready = document.readyState === "complete";
      window.addEventListener("load", function () { ready = true; });
      // window.load waits for EVERY font and image to finish — on a phone over
      // mobile data that's several seconds, and the counter used to freeze at
      // ~88% that whole time waiting for it. The app is usable the moment the
      // DOM and its critical CSS are in, so treat "ready" more generously: the
      // DOM being parsed is enough, and a hard 4.5s safety cap means the splash
      // never holds the screen hostage even if some asset stalls forever.
      if (document.readyState !== "loading") ready = true;
      document.addEventListener("DOMContentLoaded", function () { ready = true; });
      setTimeout(function () { ready = true; }, 4500);
      var label = document.getElementById("appLoaderPct");
      // the polaroid pile takes ~2s to finish dealing itself in (the last
      // card lands at ~1.9s). On a cached load "ready" is true from the very
      // first tick, so without a floor the counter raced to 100 in ~1.3s and
      // the splash vanished before the animation ever played. This floor holds
      // the count back just long enough for the pile to finish.
      var MIN_MS = 2200;
      var started = Date.now();
      var t = setInterval(function () {
        var elapsed = Date.now() - started;
        var ceil = ready ? Math.max(1, (elapsed / MIN_MS) * 100) : 100;
        // ready → sprint to 100; not ready → EASE toward a soft 96 ceiling
        // (a shrinking step as it approaches) so the bar keeps visibly moving
        // instead of stalling dead at one number
        pct += ready ? (6 + Math.random() * 5)
                     : Math.max(0.4, (96 - pct) * 0.07);
        if (pct > ceil) pct = ceil;
        if (pct >= 100) {
          pct = 100;
          clearInterval(t);
          try { sessionStorage.setItem("traces-loaded", "1"); } catch (e) {}
          setTimeout(function () {
            loader.classList.add("is-done");
            setTimeout(function () { loader.remove(); }, 650);
          }, 450);
        }
        label.textContent = Math.min(100, Math.round(pct));
      }, 90);
    })();

    // Refresh the loading pile with real, CURRENT captures instead of the
    // baked-in art: pull the shared archive, pick a random handful, and swap
    // each polaroid's photo + caption to a live one. The static markup above
    // stays as an instant fallback — the splash never waits on this, the
    // swaps just arrive when the list does (and each image only replaces the
    // placeholder once it has actually loaded, so a slow thumbnail never
    // flashes a broken box). Silently leaves the art in place if offline.
    (function livePile() {
      var api = (window.TRACES_API || "").replace(/\/$/, "");
      if (!api) return;
      var cards = [].slice.call(document.querySelectorAll("#appLoader .load-polaroid"));
      if (!cards.length) return;
      fetch(api + "/captures")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !Array.isArray(d.captures)) return;
          var items = d.captures.filter(function (c) {
            return c && c.img && c.title && !c.hidden;
          });
          // one card per capture (dedupe an archive + community twin by title)
          var seen = {};
          items = items.filter(function (c) {
            var k = (c.title || "").toLowerCase();
            if (seen[k]) return false; seen[k] = 1; return true;
          });
          if (!items.length) return;
          // Fisher-Yates shuffle so the pile is a different random set each visit
          for (var i = items.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = items[i]; items[i] = items[j]; items[j] = t;
          }
          cards.forEach(function (card, idx) {
            var cap = items[idx % items.length];
            if (!cap) return;
            var pre = new Image();
            pre.onload = function () {
              var img = card.querySelector("img");
              var fig = card.querySelector("figcaption");
              if (img) img.src = cap.img;
              if (fig) fig.textContent = cap.title;
            };
            pre.src = cap.img;
          });
        })
        .catch(function () {});
    })();
  </script>

  <script>
    // the front/back/third polaroid slots keep their fixed CSS positions -
    // rotation just swaps which capture's photo/caption each slot is
    // currently showing, conveyor-style (front's content moves back, back's
    // moves to third, third gets whatever the next capture in line is)
    var HERO_ITEMS = [
      { key: "chandelier", img: "assets/images/photo-chandelier.png", title: "old living room lamp" },
      { key: "souvenirs",  img: "assets/images/photo-souvenirs.png",  title: "souvenirs from europe" },
      { key: "teddy",      img: "assets/images/photo-teddy.png",      title: "childhood teddy" },
      { key: "couch",      img: "assets/images/photo-couch.png",      title: "father's couch" },
      { key: "plant",      img: "assets/images/photo-orchid.png",     title: "mom's gifted plant" },
      { key: "bed",        img: "assets/images/photo-bed.png",        title: "20 year old bed" },
    ];

    (function () {
      var stack = document.getElementById("heroStack");
      var slots = [
        stack.querySelector(".polaroid-front"),
        stack.querySelector(".polaroid-back"),
        stack.querySelector(".polaroid-third"),
      ];
      var shown = [0, 1, 2]; // HERO_ITEMS index currently held by each slot
      var parkedItem = 3;    // what the parked card is currently loaded with
      var nextUp = 4;        // the first index the parked card will RELOAD to
      var paused = false;
      var timer = null;

      // swapping img.src mid-shuffle keeps showing the OLD photo until the
      // new one has decoded — on a not-yet-cached visit that read as the
      // same scan sitting on two cards at once, each under the wrong
      // caption. Warm every hero photo once up front (rotation only starts
      // 4s in, plenty of time), so every later swap is instant.
      HERO_ITEMS.forEach(function (it) { var im = new Image(); im.src = it.img; });

      // the fourth card: parked invisibly beneath the stack, always holding
      // the NEXT capture, so a deal can send it rising the instant the front
      // card lifts off (see .polaroid-parked) instead of the pile waiting a
      // full flight for its own dealt card to come back around
      var parked = slots[2].cloneNode(true);
      parked.classList.remove("polaroid-third");
      parked.classList.add("polaroid-parked");
      applyContent(parked, HERO_ITEMS[3]);
      stack.appendChild(parked);

      // a card's photo and caption must only ever change TOGETHER: setting
      // img.src alone keeps the OLD photo painted until the new one arrives
      // over the network, so updating the caption in the same breath left the
      // real capture's name sitting under the demo photo for as long as the
      // (slow, sometimes failing) fetch took. Fetch the photo first, and only
      // when it's actually decodable swap photo + caption + key in one go —
      // if it never loads, the card simply keeps its old, correctly-paired
      // face. The token guards against two overlapping applies on the same
      // card (rotation is fast, the network isn't): only the latest wins.
      function applyContent(el, item) {
        var token = (el.__applyToken || 0) + 1;
        el.__applyToken = token;
        var pre = new Image();
        pre.onload = function () {
          if (el.__applyToken !== token) return;
          var img = el.querySelector("img");
          img.src = item.img;
          img.alt = item.title;
          el.querySelector(".polaroid-caption").textContent = item.title;
          el.dataset.key = item.key;
        };
        pre.src = item.img;
      }

      var dealing = false;
      function rotate() {
        if (paused || dealing) return;
        dealing = true;
        var f = slots[0], b = slots[1], t = slots[2];
        stack.classList.add("dealing");
        // the top card flies up and off the pile…
        f.classList.add("polaroid--dealt");
        // …while the cards behind it PHYSICALLY travel one slot forward: the
        // slot classes (which carry each position) move between the elements,
        // and top/left/transform transition between them (see .dealing in the
        // CSS). Each card keeps its own photo + caption for the whole ride,
        // so a caption can never sit over the wrong picture mid-motion — the
        // exact bug the old "swap the contents while invisible" version had.
        b.classList.remove("polaroid-back");
        b.classList.add("polaroid-front");
        t.classList.remove("polaroid-third");
        t.classList.add("polaroid-back");
        // the parked card (already loaded with the next capture) rises into
        // the third slot IN THE SAME MOMENT the front lifts off — because it
        // was waiting ready, there is no dead beat where the pile just sits
        // one card short waiting for the flight to finish
        var h = parked;
        h.classList.remove("polaroid-parked");
        h.classList.add("polaroid-third");
        h.style.pointerEvents = "";
        slots = [b, t, h];
        // the riser shows what the parked card was loaded with — track it
        // from parkedItem, NOT from nextUp, or every deal skips one capture
        shown = [shown[1], shown[2], parkedItem];
        // the dealt card, once fully flown out and faded, becomes the new
        // parked card: reloaded (invisibly) with the next capture in line
        setTimeout(function () {
          f.classList.remove("polaroid-front", "polaroid--dealt");
          f.classList.add("polaroid-parked");
          parkedItem = nextUp % HERO_ITEMS.length;
          applyContent(f, HERO_ITEMS[parkedItem]);
          parked = f;
          nextUp++;
          setTimeout(function () {
            stack.classList.remove("dealing");
            dealing = false;
          }, 350);
        }, 900);
      }

      // the hardcoded demo cards above are only the instant FIRST PAINT —
      // the moment the real shared archive list arrives, the whole stack
      // reloads with Mor's actual captures (their real polaroids, opening
      // the real records). Waits out an in-flight deal to avoid mid-motion
      // photo swaps.
      window.__setHeroItems = function (items) {
        if (dealing) { setTimeout(function () { window.__setHeroItems(items); }, 1200); return; }
        HERO_ITEMS.length = 0;
        items.forEach(function (it) {
          HERO_ITEMS.push(it);
          var im = new Image(); im.src = it.img;
        });
        var n = HERO_ITEMS.length;
        shown = [0, 1 % n, 2 % n];
        applyContent(slots[0], HERO_ITEMS[shown[0]]);
        applyContent(slots[1], HERO_ITEMS[shown[1]]);
        applyContent(slots[2], HERO_ITEMS[shown[2]]);
        parkedItem = 3 % n;
        nextUp = 4 % n;
        applyContent(parked, HERO_ITEMS[parkedItem]);
      };

      (function realHero() {
        var api = (window.TRACES_API || "").replace(/\/$/, "");
        if (!api) return;
        Promise.all([
          fetch(api + "/captures").then(function (r) { return r.ok ? r.json() : { captures: [] }; }),
          fetch(api + "/hidden-showcase").then(function (r) { return r.ok ? r.json() : { hidden: [] }; }).catch(function () { return { hidden: [] }; }),
        ]).then(function (res) {
          var hidden = res[1].hidden || [];
          var list = (res[0].captures || []).filter(function (c) {
            return c.scope === "archive" && c.img && hidden.indexOf(c.id) === -1;
          });
          if (list.length < 4) return;
          window.__setHeroItems(list.map(function (c) {
            return { key: c.id, img: c.img, title: (c.title || "untitled").toLowerCase() };
          }));
        }).catch(function () {});
      })();

      function restartTimer() {
        clearInterval(timer);
        // don't auto-rotate on a phone: the three polaroids overlap tightly
        // there, so swapping their photos/captions read as a jumbled flicker
        // rather than a clean rotation. Desktop (where they're spread out)
        // keeps rotating.
        if (window.matchMedia && window.matchMedia("(max-width: 720px)").matches) return;
        // the exchange itself takes ~1.5s; a ~2.5s rest on top before the next
        // deal keeps it calm without the long dead pause that read as "stuck"
        timer = setInterval(rotate, 4000);
      }
      restartTimer();

      // pause while a visitor is actually looking at the stack, so the
      // caption they're mid-reading doesn't change under the cursor
      stack.addEventListener("mouseenter", function () { paused = true; });
      stack.addEventListener("mouseleave", function () { paused = false; });
      stack.addEventListener("focusin", function () { paused = true; });
      stack.addEventListener("focusout", function () { paused = false; });

      // the first tap on a background polaroid just brings it to the front
      // of the stack (so its own caption/photo become the focus) — only a
      // second tap on that same card (now on top, or already the default
      // front one) actually opens it, so browsing doesn't require leaving
      function selectWelcomePolaroid(card) {
        var key = card.dataset.key;
        var active = stack.querySelector(".polaroid.is-active");
        var isDefaultFront = card.classList.contains("polaroid-front") && !active;

        if (card.classList.contains("is-active") || isDefaultFront) {
          openObject(key, locationPrefix() + "object.html");
          return;
        }

        stack.querySelectorAll(".polaroid").forEach(function (item) {
          item.classList.remove("is-active");
        });
        card.classList.add("is-active");
        // a deliberate manual pick, not the auto-advance - give it a full
        // fresh interval before rotation resumes
        restartTimer();
      }

      slots.concat([parked]).forEach(function (el) {
        el.addEventListener("click", function () { selectWelcomePolaroid(el); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectWelcomePolaroid(el); }
        });
      });
    })();
  </script>
