<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Processing</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260727gn">
<link rel="stylesheet" href="../css/processing.css?v=20260727gn">
<script src="../js/owner.js?v=20260727gn"></script>
<script src="../js/config.js?v=20260727gn"></script>
<script src="../js/cursor.js?v=20260727gn" defer></script>
<script src="../js/grain.js?v=20260727gn" defer></script>
<script src="../js/blobstore.js?v=20260727gn"></script>
<script src="../js/flow.js?v=20260727gn" defer></script>
<script type="module" src="../js/vendor/model-viewer.min.js?v=20260727gn"></script>
<script type="module">
  customElements.whenDefined("model-viewer").then(function () {
    customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
  });
</script>
<script type="importmap">
  { "imports": { "three": "../js/vendor/three/three.module.js?v=20260727gn" } }
</script>
<script type="module">
  import { buildVoxelGlb, deserializeGeometry, serializeGeometry, cropCloudByRadius } from "../js/voxelize-shared.js?v=20260727gn";
  import { mountPointCloudViewer } from "../js/point-cloud-viewer.js?v=20260727gn";
  import { glbToPoints } from "../js/glb-points.js?v=20260727gn";
  window.__buildVoxelGlb = buildVoxelGlb;
  window.__deserializeGeometry = deserializeGeometry;
  window.__serializeGeometry = serializeGeometry;
  window.__cropCloudByRadius = cropCloudByRadius;
  window.__mountPointCloudViewer = mountPointCloudViewer;
  window.__glbToPoints = glbToPoints;
</script>
</head>
<body>

  <div class="proc-screen">

    <!-- hidden by default: only ever revealed to show the visitor's own
         uploaded photo (below). The AI path shows the assembling particle
         cloud instead, so no stand-in chandelier is ever left in the back. -->
    <img class="proc-cloud" src="../assets/images/photo-chandelier-large.png" alt="" aria-hidden="true" id="procCloud" hidden>
    <model-viewer class="proc-model" id="procModel" camera-controls tone-mapping="neutral" disable-pan bounds="tight" min-camera-orbit="auto auto 0m"
      interaction-prompt="none" shadow-intensity="0" exposure="1" hidden></model-viewer>
    <div class="proc-points" id="procPoints" hidden></div>
    <canvas class="proc-particles" id="procParticles" hidden></canvas>
    <!-- the captured photo itself, sampled into particles that assemble as
         the real reconstruction % climbs — what builds on screen is the
         visitor's own object, never a generic cloud (that canvas above stays
         as the fallback when no photo exists to sample) -->
    <div class="proc-particles" id="procPhotoParticles" hidden></div>
    <script type="module">
      import { mountPhotoParticles } from "../js/photo-particles.js?v=20260727gn";
      window.__mountPhotoParticles = mountPhotoParticles;
    </script>

    <p class="proc-status" id="procStatus">Processing&nbsp;&nbsp;<span id="procPct">63</span>%</p>
    <p class="proc-error-detail" id="procErrorDetail" hidden></p>

    <!-- "isolate the object": peels the surrounding room away from a raw
         point cloud, keeping only the points within a chosen radius of the
         scan's core — full right keeps everything -->
    <div class="proc-density proc-density--trim" id="procTrimRow" hidden>
      <label for="procTrimSlider">background</label>
      <input type="range" id="procTrimSlider" min="25" max="100" value="100" step="5">
      <span class="proc-density-label" id="procTrimLabel">everything</span>
    </div>

    <div class="proc-density" id="procDensityRow" hidden>
      <label for="procDensitySlider">point size</label>
      <input type="range" id="procDensitySlider" min="1" max="5" value="3" step="1">
      <span class="proc-density-label" id="procDensityLabel">balanced</span>
    </div>

    <div class="proc-actions">
      <button class="proc-cancel" type="button" onclick="goTo('upload.html')">Cancel</button>
      <button class="proc-proceed" type="button" id="procProceed" onclick="goTo('describe-capture.html')" hidden>Proceed</button>
    </div>

  </div>

  <script>
    (function () {
      var status = document.getElementById("procStatus");
      var proceed = document.getElementById("procProceed");
      var cloud = document.querySelector(".proc-cloud");
      var model = document.getElementById("procModel");

      // reconstruct the object the user actually captured, not a placeholder
      try {
        var up = sessionStorage.getItem("traces-upload-img");
        if (up && up.indexOf("idb:") === 0) {
          window.BlobStore.get(up.slice(4)).then(function (blob) {
            if (blob) { cloud.src = URL.createObjectURL(blob); cloud.hidden = false; }
          });
        } else if (up) {
          cloud.src = up;
          cloud.hidden = false;
        }
      } catch (e) {}

      // ---- "scan assembling" particle field ---------------------------------
      // a drifting sphere of points that slowly gathers as progress climbs,
      // shown during AI reconstruction in place of a stand-in lamp photo. It's
      // purely decorative but honest: there's no real geometry yet, and this
      // looks like one being built rather than pretending a finished object.
      var particleCanvas = document.getElementById("procParticles");
      var procProgress = 0;   // 0..100, driven by setPct
      var assembleRaf = null;
      // preferred: the captured photo condensing out of particles. Falls back
      // to the abstract sphere when there's no photo or the module failed.
      var photoParticlesHost = document.getElementById("procPhotoParticles");
      var ppInstance = null;
      var ppSync = null;
      function resolveUploadPhoto() {
        var up = null;
        try { up = sessionStorage.getItem("traces-upload-img"); } catch (e) {}
        if (!up) return Promise.resolve(null);
        if (up.indexOf("idb:") === 0 && window.BlobStore) {
          return window.BlobStore.get(up.slice(4))
            .then(function (b) { return b ? URL.createObjectURL(b) : null; })
            .catch(function () { return null; });
        }
        return Promise.resolve(up);
      }
      function startAssembling() {
        resolveUploadPhoto().then(function (url) {
          if (!url) { startSphereAssembling(); return; }
          // the particle module is a type="module" script — it loads AFTER
          // the inline flow that calls this, so checking for it once and
          // falling back was a race the sphere always won: every API scan
          // showed the abstract cloud instead of the person's own photo.
          // Give the module a few seconds to arrive before giving up.
          (function tryMount(attempt) {
            if (!window.__mountPhotoParticles) {
              if (attempt > 50) { startSphereAssembling(); return; }
              setTimeout(function () { tryMount(attempt + 1); }, 100);
              return;
            }
            window.__mountPhotoParticles(photoParticlesHost, url).then(function (pp) {
              ppInstance = pp;
              photoParticlesHost.hidden = false;
              cloud.hidden = true;
              particleCanvas.hidden = true;
              (function sync() {
                // the particles keep a permanent living wobble+twinkle now
                // (see photo-particles.js), so the picture can assemble fully
                // and still never read as frozen at 99% — always moving.
                pp.setProgress(procProgress / 100);
                ppSync = requestAnimationFrame(sync);
              })();
            }).catch(function () { startSphereAssembling(); });
          })(0);
        });
      }
      // No abstract sphere any more. When there's a real photo the particles
      // condense INTO that photo (above); when there isn't — a ready-made
      // scan or a model upload — the honest thing on screen is just the
      // reconstruction/preparation percentage, not a generic drifting circle
      // that looks like a result but isn't. The moment the real scan/model is
      // ready it replaces this (revealModelNow / the point-cloud mount), and
      // the "Proceed" button appears. So the fallback loader is the % text
      // that's already on screen — keep the canvas hidden and do nothing else.
      function startSphereAssembling() {
        particleCanvas.hidden = true;
        cloud.hidden = true;
      }
      function __unusedSphereAssembling() {
        var canvas = particleCanvas;
        canvas.hidden = false;
        cloud.hidden = true;
        var ctx = canvas.getContext("2d");
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        function size() {
          var r = canvas.getBoundingClientRect();
          canvas.width = r.width * dpr;
          canvas.height = r.height * dpr;
        }
        size();
        window.addEventListener("resize", size);
        // seed points on a rough sphere shell, each with a random outward
        // "scatter" offset that shrinks toward zero as the scan resolves
        var N = 520;
        var pts = [];
        for (var i = 0; i < N; i++) {
          var u = Math.random(), v = Math.random();
          var theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
          pts.push({
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.sin(phi) * Math.sin(theta),
            z: Math.cos(phi),
            scatter: 0.35 + Math.random() * 1.05,
            twinkle: Math.random() * Math.PI * 2
          });
        }
        var t0 = performance.now();
        function frame(now) {
          var w = canvas.width, h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          var cx = w / 2, cy = h / 2;
          var R = Math.min(w, h) * 0.34;
          var ang = (now - t0) * 0.00035;
          var cosA = Math.cos(ang), sinA = Math.sin(ang);
          // coherence 0→1 as progress climbs; scatter and jitter fade with it
          var coh = Math.min(1, procProgress / 92);
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            var s = p.scatter * (1 - coh);
            var jx = (Math.sin(now * 0.0011 + p.twinkle) * s);
            var jy = (Math.cos(now * 0.0013 + p.twinkle) * s);
            var jz = (Math.sin(now * 0.0009 + p.twinkle * 1.7) * s);
            var px = p.x + jx, py = p.y + jy, pz = p.z + jz;
            // rotate around Y so the cloud turns like an object on a turntable
            var rx = px * cosA + pz * sinA;
            var rz = -px * sinA + pz * cosA;
            var persp = 1 / (2.2 - rz);
            var sx = cx + rx * R * persp * 1.6;
            var sy = cy + py * R * persp * 1.6;
            var depth = Math.max(0, Math.min(1, (rz + 1) / 2)); // 0 back … 1 front
            var tw = 0.6 + 0.4 * Math.sin(now * 0.004 + p.twinkle);
            var alpha = (0.32 + 0.5 * depth) * (0.6 + 0.4 * coh) * tw;
            var rad = (0.7 + depth * 1.6) * dpr;
            ctx.beginPath();
            ctx.arc(sx, sy, rad, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
            ctx.fill();
          }
          assembleRaf = requestAnimationFrame(frame);
        }
        assembleRaf = requestAnimationFrame(frame);
      }
      function stopAssembling() {
        if (assembleRaf) cancelAnimationFrame(assembleRaf);
        assembleRaf = null;
        if (fileParticlesRaf) { cancelAnimationFrame(fileParticlesRaf); fileParticlesRaf = null; }
        particleCanvas.hidden = true;
        if (ppSync) { cancelAnimationFrame(ppSync); ppSync = null; }
        if (ppInstance) { ppInstance.dispose(); ppInstance = null; }
        photoParticlesHost.hidden = true;
      }

      // ---- ready-made FILE loader: an organic cloud of the file's OWN colours
      // A ready-made .glb has no photo to condense, so its wait used to be a
      // blank screen. Sample the file's colours and drift them as a loose,
      // breathing organic mass — flying, gathering, never locked to the
      // object's actual shape — until the solid mesh blurs into focus.
      var fileParticlesRaf = null;
      var fileLoaderActive = false;
      var fileParticlePts = null; // recoloured in place once the file is sampled
      // instant warm palette so the cloud appears the moment the file screen
      // does — sampling the real colours off the mesh takes a second, and the
      // loader must never sit blank while that runs
      // richer mid-tones (not near-white cream) so the cloud reads as coloured
      // straight away, and doesn't blow out to pure white under the lift below
      var DEFAULT_FILE_PALETTE = [[168, 138, 104], [120, 132, 150], [150, 118, 96], [110, 140, 120], [176, 150, 128], [130, 120, 140]];
      function recolourFileParticles(colours) {
        if (!fileParticlePts || !colours || !colours.length) return;
        for (var i = 0; i < fileParticlePts.length; i++) {
          var c = colours[(Math.random() * colours.length) | 0];
          fileParticlePts[i].r = c[0]; fileParticlePts[i].g = c[1]; fileParticlePts[i].b = c[2];
        }
      }
      function sampleColours(geo, n) {
        var col = geo && geo.getAttribute && geo.getAttribute("color");
        if (!col || !col.count) return [[232, 223, 208]];
        var out = [], step = Math.max(1, (col.count / n) | 0);
        for (var i = 0; i < col.count; i += step) {
          out.push([Math.round(col.getX(i) * 255), Math.round(col.getY(i) * 255), Math.round(col.getZ(i) * 255)]);
        }
        return out.length ? out : [[232, 223, 208]];
      }
      function startFileParticles(colours) {
        if (!colours || !colours.length) return;
        var canvas = particleCanvas;
        canvas.hidden = false;
        cloud.hidden = true;
        var ctx = canvas.getContext("2d");
        var dpr = Math.min(window.devicePixelRatio || 1, 1.6);
        function size() {
          var r = canvas.getBoundingClientRect();
          canvas.width = Math.max(1, Math.round(r.width * dpr));
          canvas.height = Math.max(1, Math.round(r.height * dpr));
        }
        size();
        window.addEventListener("resize", size);
        var N = 1100; // many more, each smaller (finer, grain-like cloud)
        var pts = [];
        for (var i = 0; i < N; i++) {
          var c = colours[(Math.random() * colours.length) | 0];
          var ang = Math.random() * Math.PI * 2;
          var rad = Math.pow(Math.random(), 0.65); // denser toward the middle
          pts.push({
            bx: Math.cos(ang) * rad, by: Math.sin(ang) * rad,
            r: c[0], g: c[1], b: c[2],
            ph: Math.random() * Math.PI * 2,
            sp: 0.35 + Math.random() * 0.9,
            amp: 0.05 + Math.random() * 0.14, // its own drift radius
          });
        }
        fileParticlePts = pts; // exposed so the real colours can swap in later
        var t0 = performance.now();
        (function frame(now) {
          var w = canvas.width, h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          var cx = w / 2, cy = h / 2;
          var R = Math.min(w, h) * 0.44;
          var t = (now - t0) / 1000;
          // a slow whole-cloud swirl on top of each particle's own orbit, so
          // the mass is always alive and never reads as a fixed shape
          var swirl = t * 0.25;
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            var ox = p.bx + Math.sin(t * p.sp + p.ph) * p.amp;
            var oy = p.by + Math.cos(t * p.sp * 0.9 + p.ph) * p.amp;
            var rx = ox * Math.cos(swirl) - oy * Math.sin(swirl);
            var ry = ox * Math.sin(swirl) + oy * Math.cos(swirl);
            var sx = cx + rx * R, sy = cy + ry * R;
            var tw = 0.55 + 0.45 * Math.sin(t * 1.6 + p.ph * 2);
            ctx.globalAlpha = 0.9 * tw;
            // a GENTLE lift so a dark scan colour reads over the grid without
            // washing out to white (the old +75 turned every hue pale) — the
            // object's real colours come through
            ctx.fillStyle = "rgb(" + Math.min(255, p.r + 34) + "," + Math.min(255, p.g + 34) + "," + Math.min(255, p.b + 34) + ")";
            var rr = Math.max(0.8, (1.1 + 1.0 * (0.5 + 0.5 * Math.sin(t + p.ph))) * dpr);
            ctx.beginPath();
            ctx.arc(sx, sy, rr, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          fileParticlesRaf = requestAnimationFrame(frame);
        })(t0);
      }

      // once a real 3D capture exists, replace the assembling cloud with an
      // interactive model so the visitor can spin it around and judge the
      // result before deciding to proceed or cancel. Crucially, only reveal it
      // once model-viewer has actually loaded and painted the GLB — otherwise
      // the status flips to "complete" while the frame is still blank, which
      // reads as "nothing happened" (exactly the lag being reported).
      function revealModelNow() {
        stopAssembling();
        cloud.hidden = true;
        model.hidden = false;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            model.style.filter = "blur(0px) saturate(1)";
          });
        });
      }
      function showModel(url) {
        var revealed = false;
        function reveal() {
          if (revealed) return;
          revealed = true;
          revealModelNow();
          if (typeof onModelShown === "function") onModelShown();
        }
        var onModelShown = null;
        showModel._onReady = function (cb) { onModelShown = cb; if (revealed) cb(); };
        model.addEventListener("load", reveal, { once: true });
        // a model that genuinely can't load should say so, not sit behind a
        // "Capturing complete" over an empty screen (the exact thing reported)
        model.addEventListener("error", function () {
          if (revealed) return;
          revealed = true;
          failed("model failed to load");
        }, { once: true });
        model.src = url;
        // safety net: some GLBs / data-URLs may not fire 'load' reliably —
        // never leave the viewer stuck blank behind a "complete" status
        setTimeout(reveal, 9000);
      }

      // declared HERE (before the isCloud/else block) so the ready-made-file
      // branch below can set it true and have the simulated counter park at 99
      // until the mesh actually paints, instead of a later re-declaration
      // resetting it to false and letting "complete" fire over an empty screen
      var awaitingModel = false;

      var isCloud = false;
      try { isCloud = sessionStorage.getItem("traces-capture-is-cloud") === "1"; } catch (e) {}

      if (isCloud) {
        // a raw point cloud gets real per-point rendering instead of the
        // voxelized-mesh preview — glTF/model-viewer has no notion of point
        // size, so it's the only way this stays crisp at any zoom level
        // instead of individual particles reading as solid shapes up close
        var pointsEl = document.getElementById("procPoints");
        var densityRow = document.getElementById("procDensityRow");
        var densitySlider = document.getElementById("procDensitySlider");
        var densityLabel = document.getElementById("procDensityLabel");
        var trimRow = document.getElementById("procTrimRow");
        var trimSlider = document.getElementById("procTrimSlider");
        var trimLabel = document.getElementById("procTrimLabel");
        // Point size is measured in WORLD units, but scans arrive at wildly
        // different coordinate scales — an object's radius is ~1.6 units where a
        // room's is ~18. A fixed ladder is really only calibrated for the first:
        // on a room every rung lands many times too small, so dragging the
        // slider changes almost nothing on screen and it reads as stuck. The
        // rungs are ratios of the size the viewer derives from THIS cloud's own
        // radius, and they reproduce the old absolute ladder at the ~1.6 radius
        // it was tuned for, so object scans keep the sizes they always had.
        var SIZE_RATIOS = [0.47, 0.70, 1.02, 1.41, 2.03];
        var SIZE_NAMES = ["sparse", "light", "balanced", "dense", "very dense"];
        var viewer = null;
        var LEGACY_RADIUS = 1.6;
        function sizeLevels() {
          var auto = 0;
          if (viewer && viewer.getAutoSize) auto = viewer.getAutoSize() || 0;
          if (!auto) auto = LEGACY_RADIUS * 0.008;
          return SIZE_RATIOS.map(function (m) { return auto * m; });
        }
        function sizeAt(sliderValue) {
          return sizeLevels()[parseInt(sliderValue, 10) - 1];
        }
        // the untouched full scan — every background-trim crop derives from
        // THIS, never from a previous crop, so sliding back right restores
        // everything (nothing is destroyed while choosing)
        var originalGeometry = null;

        // a real scan can be millions of points — deserializing +
        // building the GPU point buffer isn't instant, and the placeholder
        // image otherwise just sits there with no explanation
        status.innerHTML = 'Preparing point cloud<span class="proc-dots" id="procDots"></span>';
        // an organic colour-cloud fills the wait while the (often large) point
        // cloud deserializes and builds its GPU buffer — otherwise a raw-scan
        // upload sat on a bare percentage with nothing moving. Stopped the
        // moment the real cloud mounts (below).
        fileLoaderActive = true;
        startFileParticles(DEFAULT_FILE_PALETTE);

        // a ready-made scan the visitor uploaded is NOT being "reconstructed"
        // — it's their own finished file being opened. Say so honestly, and
        // put the actual reason on screen (not just the console) so a phone
        // screenshot alone tells us what went wrong.
        function scanReallyFailed(detail) {
          stopAssembling();
          cloud.hidden = true;
          model.hidden = true;
          status.textContent = "Couldn't open this scan";
          var el = document.getElementById("procErrorDetail");
          if (el) { el.textContent = detail || ""; el.hidden = !detail; }
          if (detail) console.warn("scan open failed:", detail);
        }

        // The small preview on the upload screen rendered fine because it used
        // a lightweight voxel GLB inside <model-viewer>; the big view here tries
        // the heavier raw per-point renderer (three.js), which can fail to fetch
        // or run on a phone. So instead of giving up, fall back to that same GLB
        // (stored as traces-capture-model) — the object still shows at full
        // size, blocky but there. Only if even that can't load do we show the
        // real error.
        function scanFailed(detail) {
          stopAssembling();
          var readyModel = null;
          try { readyModel = sessionStorage.getItem("traces-capture-model"); } catch (e) {}
          if (!readyModel || readyModel.indexOf("idb:") !== 0) { scanReallyFailed(detail); return; }
          window.BlobStore.get(readyModel.slice(4)).then(function (blob) {
            if (!blob) { scanReallyFailed(detail); return; }
            pointsEl.hidden = true;
            densityRow.hidden = true; // point-size only applies to the raw cloud
            trimRow.hidden = true;    // and so does the background trim
            // downstream screens should now treat this as a plain GLB model,
            // not a raw point cloud whose renderer just failed
            try { sessionStorage.setItem("traces-capture-is-cloud", "0"); } catch (e) {}
            status.textContent = "Preparing view…";
            cloud.hidden = true;
            model.hidden = false;
            model.style.filter = "blur(0px) saturate(1)";
            model.addEventListener("load", function () {
              status.textContent = "Capturing complete";
              hideLoaderBar();
              proceed.hidden = false;
            }, { once: true });
            model.addEventListener("error", function () { scanReallyFailed(detail); }, { once: true });
            model.src = URL.createObjectURL(blob);
            // safety net if 'load' never fires on this device
            setTimeout(function () {
              if (proceed.hidden) { status.textContent = "Capturing complete"; hideLoaderBar(); proceed.hidden = false; }
            }, 9000);
          }).catch(function () { scanReallyFailed(detail); });
        }

        window.BlobStore.get("capture-pending-raw").then(function (blob) {
          if (!blob) return;
          return blob.arrayBuffer();
        }).then(function (buf) {
          if (!buf) { scanFailed("this scan file couldn't be read — try exporting it again"); return; }

          // the module script (head) that defines these two loads three.js +
          // OrbitControls over the network — on a first, uncached visit that
          // can easily lose the race against this plain classic script, which
          // runs synchronously and gets here almost immediately. Retry
          // patiently instead of failing outright: on a phone over a slow
          // connection three.js is a big module and routinely takes well over
          // the old 6s budget to fetch + instantiate, which made a perfectly
          // good scan read as "failed" on mobile.
          function ready(attempts) {
            attempts = attempts || 0;
            if (window.__deserializeGeometry && window.__mountPointCloudViewer) {
              var geometry;
              try {
                geometry = window.__deserializeGeometry(buf);
              } catch (e) {
                scanFailed("could not read the scan data (" + (e && e.message ? e.message : e) + ")");
                return;
              }
              var count = geometry && geometry.attributes && geometry.attributes.position
                ? geometry.attributes.position.count : 0;
              if (!count) { scanFailed("this scan has no points in it"); return; }
              // now that the cloud is readable, tint the loader with the SCAN's
              // OWN colours (not the neutral default) and let it breathe for a
              // beat before the real cloud takes over — so the wait is coloured
              // like the object, exactly like the photo path
              recolourFileParticles(sampleColours(geometry, 700));
              setTimeout(function () {
                try {
                  stopAssembling(); // retire the colour-cloud loader
                  cloud.hidden = true;
                  pointsEl.hidden = false;
                  pointsEl.style.filter = "blur(17px) saturate(0.85)";
                  // no forced size: the viewer derives one from this cloud's
                  // radius, which is what the ladder is then built around
                  viewer = window.__mountPointCloudViewer(pointsEl, geometry, {});
                } catch (e) {
                  scanFailed("could not render the point cloud (" + (e && e.message ? e.message : e) + ")");
                  return;
                }
                // remember what is actually on screen, and put the slider on the
                // matching rung so its first nudge is a small step, not a jump
                try {
                  var shown = (viewer && viewer.getPointSize) ? viewer.getPointSize() : sizeAt(3);
                  var lv = sizeLevels();
                  var bi = 0, bd = Infinity;
                  lv.forEach(function (v, i) { var d = Math.abs(v - shown); if (d < bd) { bd = d; bi = i; } });
                  densitySlider.value = bi + 1;
                  densityLabel.textContent = SIZE_NAMES[bi];
                  sessionStorage.setItem("traces-capture-point-size", shown);
                } catch (e) {}
                originalGeometry = geometry;
                densityRow.hidden = false;
                trimRow.hidden = false;
                status.textContent = "Capturing complete";
                hideLoaderBar();
                proceed.hidden = false;
                // same "comes into focus" reveal every other capture path gets.
                // two nested rAFs guarantee a real painted (blurred) frame to
                // transition away from, rather than jumping to the end state.
                requestAnimationFrame(function () {
                  requestAnimationFrame(function () {
                    pointsEl.style.filter = "blur(0px) saturate(1)";
                  });
                });
              }, 1500);
              return;
            }
            // ~25s of patience (165 × 150ms); a phone fetching three.js on a
            // weak connection can genuinely need this long, and the visitor can
            // Cancel at any point if they'd rather not wait
            if (attempts > 165) { scanFailed("the 3D engine didn't finish loading — check your connection and try again"); return; }
            if (attempts === 12) status.textContent = "Loading 3D engine…";
            setTimeout(function () { ready(attempts + 1); }, 150);
          }
          ready();
        }).catch(function (e) { scanFailed(e && e.message ? e.message : "something went wrong opening this scan"); });

        densitySlider.addEventListener("input", function () {
          var size = sizeAt(densitySlider.value);
          densityLabel.textContent = SIZE_NAMES[parseInt(densitySlider.value, 10) - 1];
          if (viewer) viewer.setPointSize(size);
          // otherwise this choice only ever affected this one live preview -
          // describe-capture.html and the saved record both defaulted back
          // to "balanced" regardless of what was actually picked here
          try { sessionStorage.setItem("traces-capture-point-size", size); } catch (e) {}
        });

        // ---- "isolate the object from its background" ----------------------
        function trimFrac() { return parseInt(trimSlider.value, 10) / 100; }
        function croppedNow() {
          if (!originalGeometry) return null;
          if (trimFrac() >= 0.999) return originalGeometry;
          if (!window.__cropCloudByRadius) return null;
          var g = window.__cropCloudByRadius(originalGeometry, trimFrac());
          var p = g && g.getAttribute && g.getAttribute("position");
          return p && p.count ? g : null;
        }
        var trimTimer = null;
        trimSlider.addEventListener("input", function () {
          var v = parseInt(trimSlider.value, 10);
          trimLabel.textContent = v >= 98 ? "everything" : (v >= 70 ? "most of it" : (v >= 45 ? "close around it" : "object only"));
          // the viewer has no geometry-swap API, so a crop means a clean
          // re-mount — debounced, or dragging would rebuild the GPU point
          // buffer for every pixel of thumb movement
          clearTimeout(trimTimer);
          trimTimer = setTimeout(function () {
            var g = croppedNow();
            if (!g) return;
            // keep the exact framing across the re-mount, so the room
            // peeling away is the ONLY visible change (a camera jump on top
            // of it read as the whole scene lurching)
            var view = null;
            try { view = viewer && viewer.getView ? viewer.getView() : null; } catch (e) {}
            if (viewer && viewer.dispose) { try { viewer.dispose(); } catch (e) {} }
            pointsEl.innerHTML = "";
            viewer = window.__mountPointCloudViewer(pointsEl, g, {
              pointSize: sizeAt(densitySlider.value),
              initialView: view,
            });
          }, 160);
        });
        // the choice must survive into the SAVED capture, not just this
        // preview: overwrite the pending raw blob with the trimmed cloud.
        // "change" fires once per released adjustment (unlike "input"), so
        // this isn't re-serializing megabytes mid-drag.
        trimSlider.addEventListener("change", function () {
          var g = croppedNow();
          if (!g || !window.__serializeGeometry || !window.BlobStore) return;
          window.BlobStore.set("capture-pending-raw", window.__serializeGeometry(g)).catch(function () {});
        });
      } else {
        try {
          var readyModel = sessionStorage.getItem("traces-capture-model");
          if (readyModel) {
            awaitingModel = true;
            // fall back to the solid mesh coming into focus if anything below
            // can't build the particle version
            var showTheMesh = function () {
              if (readyModel.indexOf("idb:") === 0) {
                window.BlobStore.get(readyModel.slice(4)).then(function (blob) {
                  if (blob) { showModel(URL.createObjectURL(blob)); showModel._onReady(complete); }
                  else { awaitingModel = false; }
                });
              } else {
                showModel(readyModel);
                showModel._onReady(complete);
              }
            };
            // while the file loads, drift an organic cloud of ITS OWN colours
            // (sampled from the mesh) so the wait is alive instead of blank;
            // then the solid MESH blurs into focus. The particle / point-cloud
            // representation stays available as a toggle in the object page —
            // this opening cloud is a loader, not the object's real shape.
            fileLoaderActive = true;
            (function fileLoader() {
              // show the cloud IMMEDIATELY (warm default palette) so the wait
              // is never blank, then sample the file's real colours in the
              // background and swap them into the live cloud when ready
              startFileParticles(DEFAULT_FILE_PALETTE);
              var revealed = false;
              function revealMesh() { if (revealed) return; revealed = true; showTheMesh(); }
              var bufP = readyModel.indexOf("idb:") === 0
                ? window.BlobStore.get(readyModel.slice(4)).then(function (b) { return b ? b.arrayBuffer() : null; })
                : fetch(readyModel).then(function (r) { return r.ok ? r.arrayBuffer() : null; });
              bufP.then(function (buf) {
                if (buf && window.__glbToPoints) {
                  Promise.resolve(window.__glbToPoints(buf))
                    .then(function (geo) {
                      // swap the loader to the file's OWN colours, THEN let that
                      // coloured cloud breathe a beat before the mesh takes over
                      recolourFileParticles(sampleColours(geo, 800));
                      setTimeout(revealMesh, 1500);
                    })
                    .catch(function () { setTimeout(revealMesh, 800); });
                } else {
                  setTimeout(revealMesh, 1800);
                }
              }).catch(function () { setTimeout(revealMesh, 800); });
              // hard cap so a slow or failed colour sampling never traps the loader
              setTimeout(revealMesh, 6000);
            })();
          }
        } catch (e) {}
      }

      // awaitingModel is declared up above (before the isCloud/else block) so
      // the file path can set it true there without this line resetting it —
      // completion must WAIT for the real model to paint, not fire the instant
      // the fake counter reaches 100 ("it says complete but it's still loading")
      var completed = false;
      function hideLoaderBar() {
        var bar = document.getElementById("procBar");
        if (bar) bar.hidden = true;
      }
      function setPct(p) {
        procProgress = p;
        // "Processing… NN%" — the animated dots sit right after the word (part
        // of the sentence), not trailing after the % where they threw the whole
        // line off-centre and were barely visible
        status.innerHTML = 'Processing<span class="proc-dots" id="procDots"></span>&nbsp;<span>' + p + '%</span>';
        var f = "blur(" + Math.max(0, (100 - p) * 0.45) + "px) saturate(0.85)";
        cloud.style.filter = f;
        model.style.filter = f;
      }
      // a live "…" that keeps cycling 0→3 dots on the working states, so a
      // long park (Tripo genuinely sits at 99% while it finishes) always reads
      // as "still working", not frozen. Rebuilt each setStatus, so this just
      // repaints whatever #procDots is on screen right now.
      var dotN = 0;
      setInterval(function () {
        var d = document.getElementById("procDots");
        if (!d) return;
        // cycle 1→3 dots (never 0) so the ellipsis is always present — no
        // empty flicker between "Processing" and the percentage
        dotN = (dotN % 3) + 1;
        d.textContent = "...".slice(0, dotN);
      }, 400);
      function complete() {
        completed = true;
        status.textContent = "Capturing complete";
        hideLoaderBar(); // the object is on screen now; the loader retires
        cloud.style.filter = "blur(0px) saturate(1)";
        model.style.filter = "blur(0px) saturate(1)";
        proceed.hidden = false;
      }
      // build the finished object up from its OWN coloured points — sample the
      // GLB surface, mount the point-cloud viewer, and let it run its
      // sparse→dense intro so the object visibly crystallises out of particles.
      // Shared by every path that ends up holding a real .glb (a ready-made
      // upload AND an AI/API reconstruction), so they all finish the same way.
      // Calls onFail() when it can't sample (malformed, no engine).
      function assembleFromGlb(buf, onFail) {
        try {
          if (!buf || !window.__glbToPoints || !window.__mountPointCloudViewer) { onFail(); return; }
          Promise.resolve(window.__glbToPoints(buf)).then(function (geometry) {
            var ok = geometry && geometry.getAttribute && geometry.getAttribute("position")
              && geometry.getAttribute("position").count > 100;
            if (!ok) { onFail(); return; }
            var pointsEl = document.getElementById("procPoints");
            stopAssembling();
            cloud.hidden = true;
            pointsEl.hidden = false;
            window.__pcv = window.__mountPointCloudViewer(pointsEl, geometry, { pointSize: 0.013 });
            // the object is now on screen, building itself from its own
            // particles — let the ~2.2s intro breathe before the words flip
            setTimeout(complete, 2400);
          }).catch(function () { onFail(); });
        } catch (e) { onFail(); }
      }
      function failed(msg) {
        stopAssembling();
        relayPhone({ failed: 1 }); // let the phone stop waiting too
        clearPhoneSess();
        hideLoaderBar();
        status.textContent = "Reconstruction failed";
        // hide the stand-in chandelier placeholder and the (never-loaded)
        // model so a failed screen is just the message on the grid, not a
        // random blurred lamp that has nothing to do with the capture
        cloud.hidden = true;
        model.hidden = true;
        console.warn("Tripo:", msg);
        // shown on-screen (not just the console) so the actual reason can be
        // read off a screenshot without opening dev tools
        var detail = document.getElementById("procErrorDetail");
        if (detail) {
          var text = typeof msg === "string" ? msg : JSON.stringify(msg);
          detail.textContent = text;
          detail.hidden = false;
        }
      }

      var api = (window.TRACES_API || "").replace(/\/$/, "");
      var mode = null, task = null, err = null;
      try {
        mode = sessionStorage.getItem("traces-mode");
        task = sessionStorage.getItem("traces-task");
        err = sessionStorage.getItem("traces-task-error");
      } catch (e) {}

      // ---- phone hand-off relay --------------------------------------------
      // when this build was started from a phone capture, mirror its live state
      // back into the same session pigeonhole so the visitor's phone can follow
      // along (building → ready) and, when done, download the finished image/GLB
      // right there. Purely additive and fire-and-forget: a desktop-only capture
      // has no phone session, so every call here simply no-ops.
      var phoneSess = null;
      try { phoneSess = sessionStorage.getItem("traces-phone-session") || null; } catch (e) {}
      function relayPhone(obj) {
        if (!phoneSess || !api) return;
        try {
          fetch(api + "/session/" + phoneSess, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ task_id: JSON.stringify(obj) }),
          }).catch(function () {});
        } catch (e) {}
      }
      function clearPhoneSess() {
        try { sessionStorage.removeItem("traces-phone-session"); } catch (e) {}
        phoneSess = null;
      }

      // a real generation now routinely takes several minutes — long enough
      // that a reload, a stale cached page, or the tab closing can land here
      // with no session task even though a paid-for one is still running on
      // Tripo's side. Fall back to the last in-flight task (up to 30 min old)
      // recorded in localStorage, which survives all of that.
      if (!err && !task) {
        try {
          var inflight = JSON.parse(localStorage.getItem("traces-inflight-task") || "null");
          if (inflight && inflight.task_id && Date.now() - inflight.ts < 30 * 60 * 1000) {
            mode = "tripo";
            task = inflight.task_id;
            try { sessionStorage.setItem("traces-mode", "tripo"); sessionStorage.setItem("traces-task", task); } catch (e) {}
          }
        } catch (e) {}
      }

      // ---- real Tripo reconstruction: poll the worker for progress ----------
      if (api && mode === "tripo") {
        if (err || !task) { failed(err || "no task id"); return; }
        startAssembling();
        relayPhone({ building: 1 }); // the phone shows "building…" from here
        setPct(1);
        // Tripo reports "99" almost immediately and then sits there while it
        // actually finishes — technically true, but it reads as a lie ("why
        // does it show 99 right away?"). Ease the DISPLAYED number toward the
        // reported one a step at a time instead, so the climb feels like the
        // work it represents; it parks at 99 only near the real end.
        var shownPct = 1, targetPct = 1;
        var easer = setInterval(function () {
          if (!status.isConnected) { clearInterval(easer); return; }
          if (shownPct < targetPct) { shownPct++; setPct(shownPct); }
        }, 350);
        var poll = setInterval(function () {
          if (!status.isConnected) { clearInterval(poll); return; }
          fetch(api + "/status?task_id=" + encodeURIComponent(task))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var s = d && d.status;
              targetPct = Math.max(targetPct, Math.min(99, (d && d.progress) || 1));
              // stream the live percentage to the phone so it shows the same
              // climbing loader the computer does, not a static word — only
              // while still building (success/failure send their own state)
              if (s !== "success" && s !== "failed" && s !== "cancelled" && s !== "banned" && s !== "unknown") {
                relayPhone({ building: 1, pct: Math.round(shownPct) });
              }
              if (s === "success") {
                clearInterval(poll);
                procProgress = 100;
                // keep the assembling cloud running and hold off on the
                // "complete" wording until the model has actually painted —
                // completing the sentence before anything is on screen is
                // precisely what read as "it says done but nothing loaded"
                status.innerHTML = 'Assembling<span class="proc-dots" id="procDots"></span>';
                // hand the finished result to the visitor's phone: the rendered
                // image and the GLB, both through the worker /proxy so they're
                // CORS-fetchable for a download on the phone. The visitor keeps
                // going on the computer; the phone is just a companion + save.
                relayPhone({
                  done: 1,
                  model: d.model_url ? (api + "/proxy?url=" + encodeURIComponent(d.model_url)) : null,
                  thumb: d.thumb ? (api + "/proxy?url=" + encodeURIComponent(d.thumb)) : null,
                });
                clearPhoneSess();
                try {
                  if (d.model_url) {
                    // load the GLB through the worker proxy (avoids cross-origin issues)
                    var proxied = api + "/proxy?url=" + encodeURIComponent(d.model_url);
                    var present = function (ref, displaySrc) {
                      try { sessionStorage.setItem("traces-capture-model", ref); } catch (e) {}
                      showModel(displaySrc);
                      showModel._onReady(function () { complete(); });
                    };
                    // Tripo's model_url is a short-lived signed CDN link that
                    // 403s within hours. Download the finished GLB NOW, while
                    // the link is fresh, and keep the bytes in IndexedDB — that
                    // permanent copy is what describe-capture saves locally AND
                    // uploads to our own server, so a paid-for scan is never
                    // lost to an expired link. Falls back to the live link only
                    // if the download itself fails.
                    if (window.BlobStore) {
                      fetch(proxied).then(function (r) { return r.ok ? r.blob() : null; })
                        .then(function (blob) {
                          if (!blob) { present(proxied, proxied); return; }
                          return window.BlobStore.set("capture-pending-model", blob).then(function () {
                            // reveal the finished mesh (blur-into-focus)
                            present("idb:capture-pending-model", URL.createObjectURL(blob));
                          });
                        })
                        .catch(function () { present(proxied, proxied); });
                    } else {
                      present(proxied, proxied);
                    }
                  } else {
                    complete();
                  }
                  // Tripo's rendered thumbnail is a short-lived CDN link too —
                  // and often on a host isTripoProxy() doesn't recognise, so
                  // publish() never re-hosted it and saved API scans lost their
                  // thumbnails within a day (the broken-image cards). Download it
                  // NOW through the proxy while it's fresh and keep the bytes in
                  // IndexedDB; describe-capture then moves them to a permanent key
                  // and publish uploads them, exactly like the model. Fall back to
                  // the live link only if the download fails.
                  if (d.thumb) {
                    if (window.BlobStore) {
                      var thumbProxied = api + "/proxy?url=" + encodeURIComponent(d.thumb);
                      fetch(thumbProxied).then(function (r) { return r.ok ? r.blob() : null; })
                        .then(function (blob) {
                          if (!blob) { try { sessionStorage.setItem("traces-capture-thumb", d.thumb); } catch (e) {} return; }
                          return window.BlobStore.set("capture-pending-thumb", blob).then(function () {
                            try { sessionStorage.setItem("traces-capture-thumb", "idb:capture-pending-thumb"); } catch (e) {}
                          });
                        })
                        .catch(function () { try { sessionStorage.setItem("traces-capture-thumb", d.thumb); } catch (e) {} });
                    } else {
                      try { sessionStorage.setItem("traces-capture-thumb", d.thumb); } catch (e) {}
                    }
                  }
                } catch (e) { complete(); }
                localStorage.removeItem("traces-inflight-task");
              } else if (s === "failed" || s === "cancelled" || s === "banned" || s === "unknown") {
                clearInterval(poll);
                localStorage.removeItem("traces-inflight-task");
                failed(s);
              }
            })
            .catch(function (e) { /* transient — keep polling */ });
          // poll a little tighter so the instant Tripo actually finishes we
          // react to it, instead of the scan sitting "done" on their side for
          // up to another two seconds before we notice and start revealing it
        }, 1200);
        return;
      }

      // ---- simulated flow (no worker configured) ----------------------------
      // a point cloud has its own real status handling above (mounting the
      // viewer, not a fake percentage) — this fake animation would otherwise
      // race it and overwrite "Preparing point cloud…"/"Capturing complete"
      // with "Processing NN%" for a few seconds
      if (!isCloud) {
        // this path (a ready-made scan / an update) had NOTHING on screen
        // behind the percentage while a big model was still fetching and
        // parsing — a bare "Processing 81%" on an empty grid read as "it
        // isn't loading my object". Run the same assembling particle cloud
        // the AI path shows; showModel's own reveal (revealModelNow) stops
        // it the moment the model actually paints.
        // EVERY kind of scan gets the photo-condensing build — uploads too,
        // not only AI reconstructions. startAssembling itself swaps the
        // static photo for its particle version when one exists.
        // (a ready-made FILE already runs its own colour-cloud loader above —
        // don't also start the photo/sphere path, which would hide it.)
        if (model.hidden && !fileLoaderActive) startAssembling();
        var pct = 63;
        setPct(pct);
        var t = setInterval(function () {
          if (!status.isConnected || status.offsetParent === null) { clearInterval(t); return; }
          if (completed) { clearInterval(t); return; }
          // don't run the bar past 99 while a real model is still loading —
          // completion is owned by the model's own paint (showModel._onReady →
          // complete), so the bar parks at 99 and "Capturing complete" only
          // appears once the object is genuinely on screen
          if (awaitingModel && pct >= 99) { setPct(99); return; }
          pct += 1;
          setPct(pct);
          if (pct >= 100) { clearInterval(t); if (!awaitingModel && !completed) complete(); }
        }, 140);
      }
    })();
  </script>

</body>
</html>
