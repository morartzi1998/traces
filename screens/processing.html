<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Processing</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/processing.css">
<script src="../js/cursor.js" defer></script>
<script src="../js/grain.js" defer></script>
<script src="../js/flow.js" defer></script>
</head>
<body>

  <div class="proc-screen">

    <img class="proc-cloud" src="../assets/images/photo-chandelier-large.png" alt="" aria-hidden="true" id="procCloud">

    <p class="proc-status" id="procStatus">Processing&nbsp;&nbsp;<span id="procPct">63</span>%</p>

    <div class="proc-actions">
      <button class="proc-cancel" type="button" onclick="goTo('../index.html')">Cancel</button>
      <button class="proc-proceed" type="button" id="procProceed" onclick="goTo('describe-capture.html')" hidden>Proceed</button>
    </div>

  </div>

  <script>
    (function () {
      var pct = 63;
      var el = document.getElementById("procPct");
      var status = document.getElementById("procStatus");
      var proceed = document.getElementById("procProceed");
      var cloud = document.querySelector(".proc-cloud");
      // reconstruct the object the user actually captured, not a placeholder
      try {
        var up = sessionStorage.getItem("traces-upload-img");
        if (up) cloud.src = up;
      } catch (e) {}
      el.textContent = pct;
      proceed.hidden = true;
      status.innerHTML = 'Processing&nbsp;&nbsp;<span id="procPct">' + pct + "%</span>";
      el = status.querySelector("#procPct");
      cloud.style.filter = "blur(17px) saturate(0.85)";

      var t = setInterval(function () {
        if (!status.isConnected || status.offsetParent === null) { clearInterval(t); return; }
        pct += 1;
        el.textContent = pct + "%";
        // the reconstruction sharpens as processing completes
        cloud.style.filter = "blur(" + Math.max(0, (100 - pct) * 0.45) + "px) saturate(0.85)";
        if (pct >= 100) {
          clearInterval(t);
          status.textContent = "Capturing complete";
          proceed.hidden = false;
        }
      }, 140);
    })();
  </script>

</body>
</html>
