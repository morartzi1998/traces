<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Processing</title>
<link rel="stylesheet" href="../css/base.css?v=20260716d">
<link rel="stylesheet" href="../css/processing.css?v=20260716d">
<script src="../js/config.js?v=20260716d"></script>
<script src="../js/cursor.js?v=20260716d" defer></script>
<script src="../js/grain.js?v=20260716d" defer></script>
<script src="../js/blobstore.js?v=20260716d"></script>
<script src="../js/flow.js?v=20260716d" defer></script>
<script type="module" src="../js/vendor/model-viewer.min.js?v=20260716d"></script>
<script type="module">
  customElements.whenDefined("model-viewer").then(function () {
    customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
  });
</script>
</head>
<body>

  <div class="proc-screen">

    <img class="proc-cloud" src="../assets/images/photo-chandelier-large.png" alt="" aria-hidden="true" id="procCloud">
    <model-viewer class="proc-model" id="procModel" camera-controls disable-pan
      interaction-prompt="none" shadow-intensity="1" exposure="1" hidden></model-viewer>

    <p class="proc-status" id="procStatus">Processing&nbsp;&nbsp;<span id="procPct">63</span>%</p>

    <div class="proc-actions">
      <button class="proc-cancel" type="button" onclick="goTo('../index.html')">Cancel</button>
      <button class="proc-proceed" type="button" id="procProceed" onclick="goTo('describe-capture.html')" hidden>Proceed</button>
    </div>

  </div>

  <script>
    (function () {
      var status = document.getElementById("procStatus");
      var proceed = document.getElementById("procProceed");
      var cloud = document.querySelector(".proc-cloud");
      var model = document.getElementById("procModel");

      // reconstruct the object the user actually captured, not a placeholder
      try {
        var up = sessionStorage.getItem("traces-upload-img");
        if (up) cloud.src = up;
      } catch (e) {}

      // once a real 3D capture exists, replace the flat cloud image with an
      // interactive model so the visitor can spin it around and judge the
      // result before deciding to proceed or cancel
      function showModel(url) {
        model.src = url;
        model.hidden = false;
        cloud.hidden = true;
      }
      try {
        var readyModel = sessionStorage.getItem("traces-capture-model");
        if (readyModel && readyModel.indexOf("idb:") === 0) {
          window.BlobStore.get(readyModel.slice(4)).then(function (blob) {
            if (blob) showModel(URL.createObjectURL(blob));
          });
        } else if (readyModel) {
          showModel(readyModel);
        }
      } catch (e) {}

      function setPct(p) {
        status.innerHTML = 'Processing&nbsp;&nbsp;<span>' + p + "%</span>";
        cloud.style.filter = "blur(" + Math.max(0, (100 - p) * 0.45) + "px) saturate(0.85)";
      }
      function complete() {
        status.textContent = "Capturing complete";
        cloud.style.filter = "blur(0px) saturate(1)";
        proceed.hidden = false;
      }
      function failed(msg) {
        status.textContent = "Reconstruction failed";
        cloud.style.filter = "blur(6px) saturate(0.6)";
        console.warn("Tripo:", msg);
      }

      var api = (window.TRACES_API || "").replace(/\/$/, "");
      var mode = null, task = null, err = null;
      try {
        mode = sessionStorage.getItem("traces-mode");
        task = sessionStorage.getItem("traces-task");
        err = sessionStorage.getItem("traces-task-error");
      } catch (e) {}

      // ---- real Tripo reconstruction: poll the worker for progress ----------
      if (api && mode === "tripo") {
        if (err || !task) { failed(err || "no task id"); return; }
        setPct(1);
        var poll = setInterval(function () {
          if (!status.isConnected) { clearInterval(poll); return; }
          fetch(api + "/status?task_id=" + encodeURIComponent(task))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var s = d && d.status;
              setPct(d && d.progress ? d.progress : 1);
              if (s === "success") {
                clearInterval(poll);
                try {
                  if (d.model_url) {
                    // load the GLB through the worker proxy (avoids cross-origin issues)
                    var proxied = api + "/proxy?url=" + encodeURIComponent(d.model_url);
                    sessionStorage.setItem("traces-capture-model", proxied);
                    showModel(proxied);
                  }
                  if (d.thumb) sessionStorage.setItem("traces-capture-thumb", d.thumb);
                } catch (e) {}
                complete();
              } else if (s === "failed" || s === "cancelled" || s === "banned" || s === "unknown") {
                clearInterval(poll);
                failed(s);
              }
            })
            .catch(function (e) { /* transient — keep polling */ });
        }, 2000);
        return;
      }

      // ---- simulated flow (no worker configured) ----------------------------
      var pct = 63;
      setPct(pct);
      var t = setInterval(function () {
        if (!status.isConnected || status.offsetParent === null) { clearInterval(t); return; }
        pct += 1;
        setPct(pct);
        if (pct >= 100) { clearInterval(t); complete(); }
      }, 140);
    })();
  </script>

</body>
</html>
