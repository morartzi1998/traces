<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Loading</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/loading.css">
<script src="../js/cursor.js" defer></script>
<script src="../js/flow.js" defer></script>
</head>
<body>

  <div class="load-screen">

    <div class="load-strip" aria-hidden="true">
      <figure class="load-polaroid" style="--tilt: -4deg">
        <img src="../assets/images/photo-chandelier.png" alt="">
        <figcaption>old living room lamp</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 3deg">
        <img src="../assets/images/photo-orchid.png" alt="">
        <figcaption>mom's gifted plent</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -2.5deg">
        <img src="../assets/images/photo-bed.png" alt="">
        <figcaption>20 year old bed</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 2deg">
        <img src="../assets/images/photo-couch.png" alt="">
        <figcaption>father's couch</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -3deg">
        <img src="../assets/images/photo-teddy.png" alt="">
        <figcaption>childhood tedy</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 3.5deg">
        <img src="../assets/images/photo-souvenirs.png" alt="">
        <figcaption>souvenirs from europe</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -2deg">
        <img src="../assets/images/photo-cabinet.png" alt="">
        <figcaption>souvenirs storage</figcaption>
      </figure>
    </div>

    <p class="load-status">Loading&nbsp;...&nbsp;<span id="loadPct">0</span>%</p>

  </div>

  <script>
    (function () {
      var pct = 0;
      var el = document.getElementById("loadPct");
      var t = setInterval(function () {
        pct += 1 + Math.floor(Math.random() * 3);
        if (pct >= 100) {
          pct = 100;
          clearInterval(t);
          setTimeout(function () { goTo("processing.html"); }, 400);
        }
        el.textContent = pct;
      }, 90);
    })();
  </script>

</body>
</html>
