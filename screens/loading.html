<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Loading</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/loading.css">
<script src="../js/cursor.js" defer></script>
<script src="../js/grain.js" defer></script>
<script src="../js/flow.js" defer></script>
</head>
<body>

  <div class="load-screen">

    <div class="load-strip">
      <figure class="load-polaroid" style="--tilt: -4deg; --delay: 0s" role="button" tabindex="0"
              onclick="openObject('chandelier', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-chandelier.png" alt="old living room lamp">
        <figcaption>old living room lamp</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 3deg; --delay: .3s" role="button" tabindex="0"
              onclick="openObject('orchid', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-orchid.png" alt="mom's gifted plent">
        <figcaption>mom's gifted plent</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -2.5deg; --delay: .6s" role="button" tabindex="0"
              onclick="openObject('bed', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-bed.png" alt="20 year old bed">
        <figcaption>20 year old bed</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 2deg; --delay: .15s" role="button" tabindex="0"
              onclick="openObject('couch', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-couch.png" alt="father's couch">
        <figcaption>father's couch</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -3deg; --delay: .45s" role="button" tabindex="0"
              onclick="openObject('teddy', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-teddy.png" alt="childhood tedy">
        <figcaption>childhood tedy</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: 3.5deg; --delay: .7s" role="button" tabindex="0"
              onclick="openObject('souvenirs', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-souvenirs.png" alt="souvenirs from europe">
        <figcaption>souvenirs from europe</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt: -2deg; --delay: .25s" role="button" tabindex="0"
              onclick="openObject('cabinet', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-cabinet.png" alt="souvenirs storage">
        <figcaption>souvenirs storage</figcaption>
      </figure>
    </div>

    <p class="load-status">Loading&nbsp;...&nbsp;<span id="loadPct">0</span>%</p>

  </div>

  <script>
    (function () {
      var pct = 0;
      var el = document.getElementById("loadPct");
      var t = setInterval(function () {
        if (!el.isConnected || el.offsetParent === null) { clearInterval(t); return; }
        pct += 1 + Math.floor(Math.random() * 3);
        if (pct >= 100) {
          pct = 100;
          clearInterval(t);
          setTimeout(function () { goTo("../index.html"); }, 400);
        }
        el.textContent = pct;
      }, 90);
    })();
  </script>

</body>
</html>
