<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Loading</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../css/base.css?v=20260725e">
<link rel="stylesheet" href="../css/loading.css?v=20260725e">
<script src="../js/cursor.js?v=20260725e" defer></script>
<script src="../js/grain.js?v=20260725e" defer></script>
<script src="../js/flow.js?v=20260725e" defer></script>
</head>
<body>

  <div class="load-screen">

    <div class="load-strip">
      <figure class="load-polaroid" style="--tilt:-4deg; --y:10px; --delay:0s; z-index:7" role="button" tabindex="0"
              onclick="openObject('chandelier', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-chandelier.png" alt="old living room lamp">
        <figcaption>old living room lamp</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:3deg; --y:40px; --delay:.3s; z-index:6" role="button" tabindex="0"
              onclick="openObject('plant', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-orchid.png" alt="mom's gifted plent">
        <figcaption>mom's gifted plent</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-2.5deg; --y:20px; --delay:.6s; z-index:5" role="button" tabindex="0"
              onclick="openObject('bed', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-bed.png" alt="20 year old bed">
        <figcaption>20 year old bed</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:2deg; --y:0px; --delay:.15s; z-index:4" role="button" tabindex="0"
              onclick="openObject('couch', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-couch.png" alt="father's couch">
        <figcaption>father's couch</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-3deg; --y:34px; --delay:.45s; z-index:3" role="button" tabindex="0"
              onclick="openObject('teddy', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-teddy.png" alt="childhood teddy">
        <figcaption>childhood teddy</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:3.5deg; --y:8px; --delay:.7s; z-index:2" role="button" tabindex="0"
              onclick="openObject('souvenirs', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-souvenirs.png" alt="souvenirs from europe">
        <figcaption>souvenirs from europe</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-2deg; --y:24px; --delay:.25s; z-index:1" role="button" tabindex="0"
              onclick="openObject('cabinet', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-cabinet.png" alt="souvenirs storage">
        <figcaption>souvenirs storage</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:2.5deg; --y:16px; --delay:.5s; z-index:8" role="button" tabindex="0"
              onclick="openObject('curtain', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-curtain.png" alt="favorite corner">
        <figcaption>favorite corner</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:-3.5deg; --y:30px; --delay:.1s; z-index:9" role="button" tabindex="0"
              onclick="openObject('table', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-table.png" alt="old table">
        <figcaption>old table</figcaption>
      </figure>
      <figure class="load-polaroid" style="--tilt:4deg; --y:6px; --delay:.4s; z-index:10" role="button" tabindex="0"
              onclick="openObject('television', locationPrefix() + 'object.html')">
        <img src="../assets/images/photo-television.png" alt="living room tv">
        <figcaption>living room tv</figcaption>
      </figure>
    </div>

    <p class="load-status">Loading&nbsp;...&nbsp;<span id="loadPct">0</span>%</p>

  </div>

  <script>
    (function () {
      var pct = 0;
      var el = document.getElementById("loadPct");
      var t = setInterval(function () {
        if (!el.isConnected || el.offsetParent === null) { clearInterval(t); return; }
        pct += 1 + Math.floor(Math.random() * 3);
        if (pct >= 100) {
          pct = 100;
          clearInterval(t);
          setTimeout(function () { goTo("../index.html"); }, 400);
        }
        el.textContent = pct;
      }, 90);
    })();
  </script>

</body>
</html>
