<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Welcome, tell us about you</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260726j">
<link rel="stylesheet" href="../css/chrome.css?v=20260726j">
<link rel="stylesheet" href="../css/onboarding.css?v=20260726j">
<script src="../js/cursor.js?v=20260726j" defer></script>
<script src="../js/grain.js?v=20260726j" defer></script>
<script src="../js/flow.js?v=20260726j" defer></script>
</head>
<body>

  <div class="onb-screen">

    <nav class="nav-top">
      <a class="logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</button>
    </nav>

    <main class="onb-main">
      <h1 class="onb-heading">Hey! it's your first time here,<br>please fill the details below</h1>

      <form class="onb-form" onsubmit="event.preventDefault(); saveOnboarding()">
        <label class="onb-label" for="onbName">What Is Your Name ?</label>
        <input class="onb-input" id="onbName" type="text" autocomplete="name">

        <label class="onb-label" for="onbCountry">What Country Are You From?</label>
        <input class="onb-input" id="onbCountry" type="text" autocomplete="country-name">

        <div class="onb-actions">
          <button class="onb-btn onb-btn--ghost" type="button" onclick="goTo('../index.html')">Back</button>
          <button class="onb-btn onb-btn--solid" type="submit">Proceed</button>
        </div>
      </form>
    </main>

    <nav class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </nav>

  </div>

  <script>
    // arriving here always means starting a genuinely new capture (the
    // re-scan/update flow, started from object.html, goes straight to
    // upload.html and never passes through here) - clear any leftover
    // update-target from a previous "Update capture" that was abandoned
    // partway, or a later fresh capture would wrongly get attached to
    // that old one instead of becoming its own
    try { sessionStorage.removeItem("traces-update-target"); } catch (e) {}

    function saveOnboarding() {
      try {
        var n = (document.getElementById("onbName").value || "").trim();
        var c = (document.getElementById("onbCountry").value || "").trim();
        if (n) localStorage.setItem("traces-user-name", n);
        if (c) localStorage.setItem("traces-user-country", c);
      } catch (e) {}
      goTo("upload.html");
    }
  </script>

</body>
</html>
