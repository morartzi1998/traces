<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Archive</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/chrome.css">
<link rel="stylesheet" href="../css/gallery.css">
<script src="../js/cursor.js" defer></script>
<script src="../js/flow.js" defer></script>
</head>
<body>

  <div class="gal-screen gal--archive">

    <header class="gal-header">
      <a class="logo gal-logo" href="../index.html">traces</a>
      <div class="gal-tools">
        <label class="gal-search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="15" y1="15" x2="22" y2="22" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <input type="search" aria-label="Search the archive">
        </label>
        <span class="nav-link" style="text-decoration:none;opacity:.55">Archive</span>
      </div>
    </header>

    <main class="gal-grid">

      <article class="gal-item">
        <p class="gal-meta">[01]<br>2 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('chandelier')">
          <img src="../assets/images/photo-chandelier.png" alt="Old living room lamp">
          <span class="gal-caption">old living room lamp</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[02]<br>13 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('room')">
          <img src="../assets/images/photo-room.png" alt="My old living room">
          <span class="gal-caption">my living room</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[03]<br>16 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('couch')">
          <img src="../assets/images/photo-couch.png" alt="Father's couch">
          <span class="gal-caption">father's couch</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[04]<br>27 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('teddy')">
          <img src="../assets/images/photo-teddy.png" alt="Childhood teddy bear">
          <span class="gal-caption">childhood tedy</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[05]<br>39 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('souvenirs')">
          <img src="../assets/images/photo-souvenirs.png" alt="Souvenirs from Europe">
          <span class="gal-caption">souvenirs from europe</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[06]<br>55 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('bed')">
          <img src="../assets/images/photo-bed.png" alt="20 year old bed">
          <span class="gal-caption">20 year old bed</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[07]<br>164 days ago</p>
        <button class="gal-card" type="button" onclick="openObject('cabinet')">
          <img src="../assets/images/photo-cabinet.png" alt="Souvenirs storage cabinet">
          <span class="gal-caption">souvenirs storage</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[08]<br>a year ago</p>
        <button class="gal-card" type="button" onclick="openObject('curtain')">
          <img src="../assets/images/photo-curtain.png" alt="Favorite corner with curtains">
          <span class="gal-caption">favorite corner</span>
        </button>
      </article>

      <article class="gal-item">
        <p class="gal-meta">[09]<br>a year ago</p>
        <button class="gal-card" type="button" onclick="openObject('table')">
          <img src="../assets/images/photo-table.png" alt="Old table">
          <span class="gal-caption">old table</span>
        </button>
      </article>

      <button class="gal-add" type="button" onclick="goTo('upload.html')">Add New<br>Capture +</button>

    </main>

    <footer class="nav-bottom">
      <button class="nav-link" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link" type="button" onclick="goTo('about.html')">About</button>
    </footer>

  </div>

</body>
</html>
