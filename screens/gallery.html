<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Your archive</title>
<link rel="stylesheet" href="../css/base.css?v=20260714j">
<link rel="stylesheet" href="../css/chrome.css?v=20260714j">
<link rel="stylesheet" href="../css/gallery.css?v=20260714j">
<script src="../js/cursor.js?v=20260714j" defer></script>
<script src="../js/grain.js?v=20260714j" defer></script>
<script src="../js/archive.js?v=20260714j"></script>
<script src="../js/designer-archive.js?v=20260714j"></script>
<script src="../js/gallery-title.js?v=20260714j" defer></script>
<script src="../js/flow.js?v=20260714j" defer></script>
</head>
<body>

  <div class="gal-screen gal--archive">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <span class="nav-link nav-current nav-corner nav-corner--tr">Archive</span>
    </header>

    <div class="gal-title-block">
      <p class="gal-updated">everything you capture lives here</p>
      <h1 class="gal-title">your archive</h1>
    </div>

    <main class="gal-grid" id="galGrid"></main>

    <!-- shown only while the archive is empty -->
    <div class="gal-empty" id="galEmpty" hidden>
      <p class="gal-empty-line">your archive is empty — nothing has been captured yet.</p>
      <button class="gal-empty-cta" type="button" onclick="goTo('onboarding.html')">start your first scan +</button>
    </div>

    <button class="gal-add" type="button" onclick="goTo('onboarding.html')">Add New<br>Capture +</button>

    <footer class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

  </div>

  <script>
    (function () {
      var grid = document.getElementById("galGrid");
      var empty = document.getElementById("galEmpty");
      var add = document.querySelector(".gal-add");

      function ago(ts) {
        if (!ts) return "just now";
        var d = Math.floor((Date.now() - ts) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }

      var titleEl = document.querySelector(".gal-title");
      var updEl = document.querySelector(".gal-updated");

      function setHeading(title, sub) {
        if (titleEl) titleEl.textContent = title;
        if (updEl) updEl.textContent = sub;
      }

      // Until the visitor captures anything, the archive shows the designer's
      // own archive (the home she grew up in). Once they add a scan it becomes
      // their own archive of their captures.
      function renderDesigner() {
        var list = window.DESIGNER_ARCHIVE || [];
        setHeading("my archive", "the home i grew up in");
        list.forEach(function (d, i) {
          var idx = ("0" + (i + 1)).slice(-2);
          var art = document.createElement("article");
          art.className = "gal-item";
          art.innerHTML =
            '<p class="gal-meta">[' + idx + ']<br>' + d.meta + '</p>' +
            '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>';
          art.querySelector("img").src = d.img;
          art.querySelector(".gal-caption").textContent = d.title;
          art.querySelector(".gal-card").addEventListener("click", function () {
            try { sessionStorage.setItem("traces-item", d.key); } catch (e) {}
            goTo("object.html");
          });
          grid.appendChild(art);
        });
      }

      function render() {
        var items = (window.Archive ? Archive.all() : []);
        grid.innerHTML = "";
        empty.hidden = true;
        if (add) add.hidden = false;

        if (!items.length) {
          renderDesigner();
          if (window.alignGalleryTitle) window.alignGalleryTitle();
          return;
        }

        setHeading("your archive", "everything you capture lives here");
        items.forEach(function (c, i) {
          var idx = ("0" + (items.length - i)).slice(-2);
          var art = document.createElement("article");
          art.className = "gal-item";
          art.innerHTML =
            '<p class="gal-meta">[' + idx + ']<br>' + ago(c.created) + '</p>' +
            '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
            '<button class="gal-delete" type="button" hidden>delete capture</button>';
          art.querySelector("img").src = c.img || "../assets/images/photo-room.png";
          art.querySelector(".gal-caption").textContent = c.title || "untitled capture";

          var card = art.querySelector(".gal-card");
          var del = art.querySelector(".gal-delete");
          var timer = null, longPressed = false;

          function open() {
            try { sessionStorage.setItem("traces-item", c.id); } catch (e) {}
            goTo("object.html");
          }
          function startPress() {
            longPressed = false;
            timer = setTimeout(function () {
              longPressed = true;
              // reveal delete on this card, hide any others
              grid.querySelectorAll(".gal-delete").forEach(function (b) { if (b !== del) b.hidden = true; });
              del.hidden = false;
            }, 480);
          }
          function endPress() { clearTimeout(timer); }

          card.addEventListener("mousedown", startPress);
          card.addEventListener("touchstart", startPress, { passive: true });
          card.addEventListener("mouseup", endPress);
          card.addEventListener("mouseleave", endPress);
          card.addEventListener("touchend", endPress);
          card.addEventListener("click", function (e) {
            if (longPressed) { e.preventDefault(); return; } // long-press opened delete, not the capture
            open();
          });
          del.addEventListener("click", function () {
            if (window.Archive) Archive.remove(c.id);
            render();
          });
          grid.appendChild(art);
        });
        if (window.alignGalleryTitle) window.alignGalleryTitle();
      }

      // tapping elsewhere dismisses an open delete button
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".gal-item")) {
          grid.querySelectorAll(".gal-delete").forEach(function (b) { b.hidden = true; });
        }
      });

      render();
    })();
  </script>

</body>
</html>
