<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Your archive</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../css/base.css?v=20260718cz">
<link rel="stylesheet" href="../css/chrome.css?v=20260718cz">
<link rel="stylesheet" href="../css/gallery.css?v=20260718cz">
<script src="../js/cursor.js?v=20260718cz" defer></script>
<script src="../js/grain.js?v=20260718cz" defer></script>
<script src="../js/config.js?v=20260718cz"></script>
<script src="../js/archive.js?v=20260718cz"></script>
<script src="../js/blobstore.js?v=20260718cz"></script>
<script src="../js/remote-captures.js?v=20260718cz"></script>
<script src="../js/designer-archive.js?v=20260718cz"></script>
<script src="../js/gallery-title.js?v=20260718cz" defer></script>
<script src="../js/flow.js?v=20260718cz" defer></script>
</head>
<body>

  <div class="gal-screen gal--archive">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <span class="nav-link nav-current nav-corner nav-corner--tr">Archive</span>
    </header>

    <div class="gal-title-block">
      <p class="gal-updated">everything you capture lives here</p>
      <h1 class="gal-title">your archive</h1>
    </div>

    <div class="gal-filters" id="galFilters">
      <label class="gal-filter"><input type="checkbox" value="object"> object</label>
      <label class="gal-filter"><input type="checkbox" value="space"> space</label>
    </div>

    <main class="gal-grid" id="galGrid"></main>

    <!-- shown only while the archive is empty -->
    <div class="gal-empty" id="galEmpty" hidden>
      <p class="gal-empty-line">your archive is empty — nothing has been captured yet.</p>
      <button class="gal-empty-cta" type="button" onclick="goTo('onboarding.html')">start your first scan +</button>
    </div>

    <button class="gal-add" type="button" onclick="goTo('onboarding.html')">Add New<br>Capture +</button>

    <footer class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

    <!-- only shown once something has actually been hidden -->
    <button class="gal-hidden-tab" type="button" id="galHiddenTab" hidden>Hidden (<span id="galHiddenCount">0</span>)</button>
    <div class="gal-hidden-backdrop" id="galHiddenBackdrop" hidden></div>
    <aside class="gal-hidden-panel" id="galHiddenPanel">
      <div class="gal-hidden-panel-head">
        <h2>Hidden captures</h2>
        <button class="gal-hidden-close" type="button" id="galHiddenClose" aria-label="Close">&times;</button>
      </div>
      <hr class="gal-hidden-rule">
      <div id="galHiddenList"></div>
    </aside>

  </div>

  <script>
    (function () {
      var grid = document.getElementById("galGrid");
      var empty = document.getElementById("galEmpty");
      var add = document.querySelector(".gal-add");

      function ago(ts) {
        if (!ts) return "just now";
        var d = Math.floor((Date.now() - ts) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }

      var titleEl = document.querySelector(".gal-title");
      var updEl = document.querySelector(".gal-updated");

      function setHeading(title, sub) {
        if (titleEl) titleEl.textContent = title;
        if (updEl) updEl.textContent = sub;
      }

      // every capture reachable anywhere in the interface belongs in "your
      // archive" so it can be found and toggled from one place: the
      // visitor's own real captures, plus the designer's own fixed showcase
      // (previously shown only as a placeholder before she'd captured
      // anything herself — but showcase items can carry real links to other
      // captures, so they need to live here too, not just be reachable
      // through those links). Both hide the same way, through the one
      // side panel — showcase items just persist their hidden state in a
      // plain key list instead of a mutable Archive record, since they're
      // not real records to begin with.
      var DESIGNER_HIDDEN_KEY = "traces-archive-hidden";
      function designerHiddenKeys() {
        try { return JSON.parse(localStorage.getItem(DESIGNER_HIDDEN_KEY)) || []; } catch (e) { return []; }
      }
      function hideDesignerItem(key) {
        var keys = designerHiddenKeys();
        if (keys.indexOf(key) === -1) keys.push(key);
        try { localStorage.setItem(DESIGNER_HIDDEN_KEY, JSON.stringify(keys)); } catch (e) {}
      }
      function restoreDesignerItem(key) {
        var keys = designerHiddenKeys().filter(function (k) { return k !== key; });
        try { localStorage.setItem(DESIGNER_HIDDEN_KEY, JSON.stringify(keys)); } catch (e) {}
      }

      // showcase items aren't Archive records, so editing one's kind/title
      // from within object.html never had anywhere to sync to — it only
      // ever wrote object.html's own per-capture overlay. Reading that same
      // overlay here (object.html: STORE = "traces-store-v1") is what makes
      // an edit like "mark this space" actually show up in this filter.
      function overlayFor(key) {
        try {
          var s = JSON.parse(localStorage.getItem("traces-store-v1")) || {};
          return s[key] || {};
        } catch (e) { return {}; }
      }

      // square checkbox toggles above the grid — checking one or both narrows
      // the grid to that kind; leaving both unchecked shows everything
      var filters = document.getElementById("galFilters");
      function activeKinds() {
        return Array.from(filters.querySelectorAll("input:checked")).map(function (i) { return i.value; });
      }
      function applyFilter() {
        var active = activeKinds();
        grid.querySelectorAll(".gal-item").forEach(function (art) {
          art.hidden = active.length > 0 && active.indexOf(art.dataset.kind) === -1;
        });
      }
      filters.addEventListener("change", applyFilter);

      // one polaroid card, shared by real captures and designer showcase
      // items — they only differ in their metadata line and in which store
      // "hide"/"delete" reach into
      function buildCard(entry) {
        var art = document.createElement("article");
        art.className = "gal-item";
        art.dataset.kind = entry.kind || "object";
        art.innerHTML =
          '<p class="gal-meta">[' + entry.idx + ']<br>' + entry.metaText + '</p>' +
          '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
          '<div class="gal-item-actions" hidden>' +
            '<button class="gal-hide" type="button">hide</button>' +
            (entry.remove ? '<button class="gal-delete" type="button">delete</button>' : '') +
          '</div>';
        var imgEl = art.querySelector("img");
        if (window.BlobStore) {
          window.BlobStore.url(entry.img).then(function (u) { imgEl.src = u || "../assets/images/photo-room.png"; });
        } else {
          imgEl.src = entry.img || "../assets/images/photo-room.png";
        }
        art.querySelector(".gal-caption").textContent = entry.title || "untitled capture";

        var card = art.querySelector(".gal-card");
        var actions = art.querySelector(".gal-item-actions");
        var hideBtn = art.querySelector(".gal-hide");
        var del = art.querySelector(".gal-delete");
        var timer = null, longPressed = false;

        function startPress() {
          longPressed = false;
          timer = setTimeout(function () {
            longPressed = true;
            // reveal this card's actions, hide any other card's
            grid.querySelectorAll(".gal-item-actions").forEach(function (a) { if (a !== actions) a.hidden = true; });
            actions.hidden = false;
          }, 480);
        }
        function endPress() { clearTimeout(timer); }

        card.addEventListener("mousedown", startPress);
        card.addEventListener("touchstart", startPress, { passive: true });
        card.addEventListener("mouseup", endPress);
        card.addEventListener("mouseleave", endPress);
        card.addEventListener("touchend", endPress);
        card.addEventListener("click", function (e) {
          if (longPressed) { e.preventDefault(); return; } // long-press opened actions, not the capture
          try { sessionStorage.setItem("traces-item", entry.id); } catch (er) {}
          goTo("object.html");
        });
        hideBtn.addEventListener("click", function () {
          entry.hide();
          render();
        });
        if (del) {
          del.addEventListener("click", function () {
            entry.remove();
            render();
          });
        }
        return art;
      }

      // fetched once at page load, not re-fetched per render() — a live edit
      // made elsewhere won't show here until the page reloads, which is
      // an acceptable gap for this provisional stopgap
      var remoteArchiveItems = [];

      function render() {
        var allItems = (window.Archive ? Archive.all() : []);
        var localIds = {};
        allItems.forEach(function (c) { localIds[c.id] = true; });
        var hiddenDesigner = designerHiddenKeys();
        // this browser's own local copy of something it already made takes
        // priority — only show the remote copy of captures made elsewhere
        var remoteOnly = remoteArchiveItems
          .filter(function (c) { return !localIds[c.id] && hiddenDesigner.indexOf(c.id) === -1; });
        var realItems = allItems.filter(function (c) { return !c.hidden; });
        function mapShowcase(list) {
          return (list || [])
            .filter(function (d) { return hiddenDesigner.indexOf(d.key) === -1; })
            .map(function (d) {
              var o = overlayFor(d.key);
              return {
                key: d.key,
                title: o.title != null ? o.title : d.title,
                img: d.img,
                meta: d.meta,
                kind: o.kind != null ? o.kind : d.kind,
              };
            });
        }
        // the designer's own showcase belongs in "your archive" — the
        // community showcase does not (community flows into the archive,
        // not the other way around; see community.html)
        var showcase = mapShowcase(window.DESIGNER_ARCHIVE);

        grid.innerHTML = "";
        empty.hidden = true;
        if (add) add.hidden = false;

        setHeading(
          allItems.length ? "your archive" : "my archive",
          allItems.length ? "everything you capture lives here" : "the home i grew up in"
        );

        var total = realItems.length + remoteOnly.length + showcase.length;
        var pos = 0;
        realItems.forEach(function (c) {
          var idx = ("0" + (total - pos)).slice(-2);
          pos++;
          grid.appendChild(buildCard({
            id: c.id, title: c.title, img: c.img, kind: c.kind,
            idx: idx, metaText: ago(c.created),
            hide: function () { Archive.update(c.id, { hidden: true }); },
            remove: function () { if (window.Archive) Archive.remove(c.id); },
          }));
        });
        // someone else's capture, only visible through the shared worker
        // store — hiding it here only affects this browser (the same
        // key-based mechanism as the fixed showcases), it does not delete
        // the shared record
        remoteOnly.forEach(function (c) {
          var idx = ("0" + (total - pos)).slice(-2);
          pos++;
          grid.appendChild(buildCard({
            id: c.id, title: c.title, img: c.img, kind: c.kind,
            idx: idx, metaText: ago(c.created),
            hide: function () { hideDesignerItem(c.id); },
          }));
        });
        showcase.forEach(function (d) {
          var idx = ("0" + (total - pos)).slice(-2);
          pos++;
          grid.appendChild(buildCard({
            id: d.key, title: d.title, img: d.img, kind: d.kind,
            idx: idx, metaText: d.meta,
            hide: function () { hideDesignerItem(d.key); },
          }));
        });

        applyFilter();
        if (window.alignGalleryTitle) window.alignGalleryTitle();
        refreshHiddenPanel();
      }

      // tapping elsewhere dismisses an open actions row
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".gal-item")) {
          grid.querySelectorAll(".gal-item-actions").forEach(function (a) { a.hidden = true; });
        }
      });

      // a plain text link, fixed like the other corner links, only appears
      // once something is actually hidden; opening it slides in a panel
      // (same paper-card design as object.html's white details panel)
      // listing every hidden capture with a one-tap way to bring it back
      var hiddenTab = document.getElementById("galHiddenTab");
      var hiddenCountEl = document.getElementById("galHiddenCount");
      var hiddenBackdrop = document.getElementById("galHiddenBackdrop");
      var hiddenPanel = document.getElementById("galHiddenPanel");
      var hiddenClose = document.getElementById("galHiddenClose");
      var hiddenList = document.getElementById("galHiddenList");

      function closeHiddenPanel() {
        hiddenPanel.classList.remove("is-open");
        hiddenBackdrop.hidden = true;
      }
      function openHiddenPanel() {
        hiddenPanel.classList.add("is-open");
        hiddenBackdrop.hidden = false;
      }
      hiddenTab.addEventListener("click", function () {
        if (hiddenPanel.classList.contains("is-open")) closeHiddenPanel();
        else openHiddenPanel();
      });
      hiddenBackdrop.addEventListener("click", closeHiddenPanel);
      hiddenClose.addEventListener("click", closeHiddenPanel);

      function addHiddenRow(title, img, onRestore) {
        var row = document.createElement("div");
        row.className = "gal-hidden-row";
        row.innerHTML =
          '<img alt="">' +
          '<span class="gal-hidden-row-title"></span>' +
          '<button class="gal-hidden-restore" type="button">restore</button>';
        var imgEl = row.querySelector("img");
        if (window.BlobStore) {
          window.BlobStore.url(img).then(function (u) { imgEl.src = u || "../assets/images/photo-room.png"; });
        } else {
          imgEl.src = img || "../assets/images/photo-room.png";
        }
        row.querySelector(".gal-hidden-row-title").textContent = title || "untitled capture";
        row.querySelector(".gal-hidden-restore").addEventListener("click", onRestore);
        hiddenList.appendChild(row);
      }

      function refreshHiddenPanel() {
        var hiddenReal = (window.Archive ? Archive.all() : []).filter(function (c) { return c.hidden; });
        var hiddenKeys = designerHiddenKeys();
        var remoteAsShowcase = remoteArchiveItems.map(function (c) { return { key: c.id, title: c.title, img: c.img }; });
        var hiddenShowcase = (window.DESIGNER_ARCHIVE || []).concat(remoteAsShowcase)
          .filter(function (d) { return hiddenKeys.indexOf(d.key) !== -1; });
        var total = hiddenReal.length + hiddenShowcase.length;

        hiddenTab.hidden = !total;
        if (!total) closeHiddenPanel();
        hiddenCountEl.textContent = total;
        hiddenList.innerHTML = "";
        if (!total) {
          hiddenList.innerHTML = '<p class="gal-hidden-empty">nothing hidden right now.</p>';
          return;
        }
        hiddenReal.forEach(function (c) {
          addHiddenRow(c.title, c.img, function () {
            Archive.update(c.id, { hidden: false });
            render();
          });
        });
        hiddenShowcase.forEach(function (d) {
          var o = overlayFor(d.key);
          addHiddenRow(o.title != null ? o.title : d.title, d.img, function () {
            restoreDesignerItem(d.key);
            render();
          });
        });
      }

      // this browser's own captures and the designer's fixed showcase are
      // both available synchronously — show them immediately instead of
      // leaving the screen on its empty starting markup for however long
      // the remote fetch below takes. Remote-only captures (made on some
      // other device) merge in a moment later, once that resolves.
      render();

      var remoteReady = window.RemoteCaptures ? RemoteCaptures.list("archive") : Promise.resolve([]);
      remoteReady.then(function (list) {
        remoteArchiveItems = list || [];
        render();
        // anything captured in this browser before the shared store was
        // reachable never made it there — send it now, once, quietly
        if (window.RemoteCaptures) {
          RemoteCaptures.syncMissing(window.Archive ? Archive.all() : [], list, "archive");
        }
      });
    })();
  </script>

</body>
</html>
