<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — My archive</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../css/base.css?v=20260723m">
<link rel="stylesheet" href="../css/chrome.css?v=20260723m">
<link rel="stylesheet" href="../css/gallery.css?v=20260723m">
<script src="../js/cursor.js?v=20260723m" defer></script>
<script src="../js/grain.js?v=20260723m" defer></script>
<script src="../js/owner.js?v=20260723m"></script>
<script src="../js/config.js?v=20260723m"></script>
<script src="../js/archive.js?v=20260723m"></script>
<script src="../js/blobstore.js?v=20260723m"></script>
<script src="../js/remote-captures.js?v=20260723m"></script>
<script src="../js/designer-archive.js?v=20260723m"></script>
<script src="../js/gallery-title.js?v=20260723m" defer></script>
<script src="../js/flow.js?v=20260723m" defer></script>
</head>
<body>

  <div class="gal-screen gal--archive">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <span class="nav-link nav-current nav-corner nav-corner--tr">Archive</span>
    </header>

    <div class="gal-title-block">
      <p class="gal-updated">the home i grew up in</p>
      <h1 class="gal-title">my archive</h1>
    </div>

    <main class="gal-grid" id="galGrid"></main>

    <footer class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

  </div>

  <script>
    (function () {
      var HIDDEN_KEY = "traces-archive-hidden";
      var grid = document.getElementById("galGrid");

      function openObject(id) {
        try { sessionStorage.setItem("traces-item", id); } catch (e) {}
        goTo("object.html");
      }

      // Mor hiding one of her own showcase pieces here is curation, not a
      // personal preference - it should disappear for every visitor. See
      // gallery.html for the same pattern.
      var globalHiddenKeys = [];
      function hiddenKeys() {
        var local;
        try { local = JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch (e) { local = []; }
        return local.concat(globalHiddenKeys.filter(function (k) { return local.indexOf(k) === -1; }));
      }
      function hideForever(key) {
        var keys;
        try { keys = JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch (e) { keys = []; }
        if (keys.indexOf(key) === -1) keys.push(key);
        try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(keys)); } catch (e) {}
        if (window.isOwnerDevice && window.isOwnerDevice() && window.RemoteCaptures) {
          if (globalHiddenKeys.indexOf(key) === -1) globalHiddenKeys.push(key);
          RemoteCaptures.hideShowcaseGlobally(key);
        }
      }
      function ago(ts) {
        if (!ts) return "just now";
        var d = Math.floor((Date.now() - ts) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }

      function wireCard(art, key, onOpen, onDelete) {
        var card = art.querySelector(".gal-card");
        var del = art.querySelector(".gal-delete");
        // this is Mor's own public "my archive" showcase - only she (owner
        // device) may manage it. A regular visitor gets a read-only view:
        // they can open a capture, but long-pressing never reveals a delete
        // control, so they can't touch her archive at all.
        var canManage = window.isOwnerDevice && window.isOwnerDevice();
        var timer = null, longPressed = false;
        function startPress() {
          if (!canManage) return;
          longPressed = false;
          timer = setTimeout(function () {
            longPressed = true;
            grid.querySelectorAll(".gal-delete").forEach(function (b) { if (b !== del) b.hidden = true; });
            del.hidden = false;
          }, 480);
        }
        function endPress() { clearTimeout(timer); }
        card.addEventListener("mousedown", startPress);
        card.addEventListener("touchstart", startPress, { passive: true });
        card.addEventListener("mouseup", endPress);
        card.addEventListener("mouseleave", endPress);
        card.addEventListener("touchend", endPress);
        card.addEventListener("click", function (e) {
          if (longPressed) { e.preventDefault(); return; }
          onOpen();
        });
        del.addEventListener("click", function () {
          onDelete();
          art.remove();
        });
      }

      // every visitor needs Mor's global hide list before building anything
      // below, so a piece she's hidden never flashes into view even briefly
      (window.RemoteCaptures ? RemoteCaptures.listHiddenShowcase() : Promise.resolve([])).then(function (list) {
        globalHiddenKeys = list || [];
        buildGrid();
      });

      function buildGrid() {
      // real captures made through the app (upload/scan -> describe -> save)
      // show up here too, above the fixed showcase, newest first — this used
      // to be a static demo page only the About screen linked to, completely
      // disconnected from anything a visitor actually captures
      var realItems = (window.Archive ? Archive.all() : []);
      var hiddenNow = hiddenKeys();
      realItems.forEach(function (c) {
        // don't show anything Mor has hidden — this is her public page, so a
        // hidden or curated-out capture must stay off it, not just off the
        // gallery. (matches the remote + showcase filtering below.)
        if (c.hidden || hiddenNow.indexOf(c.id) !== -1) return;
        var art = document.createElement("article");
        art.className = "gal-item";
        art.innerHTML =
          '<p class="gal-meta">[new]<br>' + ago(c.created) + '</p>' +
          '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
          '<button class="gal-delete" type="button" hidden>delete capture</button>';
        var imgEl = art.querySelector("img");
        if (window.BlobStore) {
          window.BlobStore.url(c.img).then(function (u) {
            imgEl.src = u || "../assets/images/photo-room.png";
          });
        } else {
          imgEl.src = c.img || "../assets/images/photo-room.png";
        }
        art.querySelector(".gal-caption").textContent = c.title || "untitled capture";
        wireCard(art, c.id, function () { openObject(c.id); }, function () {
          if (window.Archive) Archive.remove(c.id);
        });
        grid.appendChild(art);
      });

      // this is Mor's own public showcase (reached from About: "this is how
      // my archive looks"), meant to show her real work to every visitor —
      // unlike gallery.html's "your archive" (kept strictly local/per-visitor
      // via js/owner.js), this page always pulls her captures from the
      // shared worker store regardless of which device is looking
      var localIds = {};
      realItems.forEach(function (c) { localIds[c.id] = true; });
      var hiddenAtLoad = hiddenKeys();
      var remoteReady = window.RemoteCaptures ? RemoteCaptures.list("archive") : Promise.resolve([]);
      remoteReady.then(function (list) {
        (list || []).filter(function (c) { return !localIds[c.id] && hiddenAtLoad.indexOf(c.id) === -1; })
          .forEach(function (c) {
            var art = document.createElement("article");
            art.className = "gal-item";
            art.innerHTML =
              '<p class="gal-meta">[new]<br>' + ago(c.created) + '</p>' +
              '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
              '<button class="gal-delete" type="button" hidden>delete capture</button>';
            var imgEl = art.querySelector("img");
            imgEl.src = c.img || "../assets/images/photo-room.png";
            art.querySelector(".gal-caption").textContent = c.title || "untitled capture";
            wireCard(art, c.id, function () { openObject(c.id); }, function () { hideForever(c.id); });
            grid.appendChild(art);
          });
      });

      var hidden = hiddenKeys();
      (window.DESIGNER_ARCHIVE || []).forEach(function (d, i) {
        if (hidden.indexOf(d.key) !== -1) return;
        var idx = ("0" + (i + 1)).slice(-2);
        var art = document.createElement("article");
        art.className = "gal-item";
        art.innerHTML =
          '<p class="gal-meta">[' + idx + ']<br>' + d.meta + '</p>' +
          '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
          '<button class="gal-delete" type="button" hidden>delete capture</button>';
        art.querySelector("img").src = d.img;
        art.querySelector(".gal-caption").textContent = d.title;
        wireCard(art, d.key, function () { openObject(d.key); }, function () { hideForever(d.key); });
        grid.appendChild(art);
      });
      }

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".gal-item")) {
          grid.querySelectorAll(".gal-delete").forEach(function (b) { b.hidden = true; });
        }
      });
    })();
  </script>

</body>
</html>
