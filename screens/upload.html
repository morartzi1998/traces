<script src="../js/owner.js?v=20260727h8"></script>

<script src="../js/blobstore.js?v=20260727h8"></script>
<script src="../js/flow.js?v=20260727h8" defer></script>

  customElements.whenDefined("model-viewer").then(function () {
    customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
  });
</script>
<!-- model-viewer only reads glTF/GLB — a .ply upload is converted to GLB
     client-side (three.js) before it ever reaches the rest of the flow -->
<script type="importmap">
  { "imports": { "three": "../js/vendor/three/three.module.js?v=20260727h8" } }
</script>
<script type="module">
  import * as THREE from "../js/vendor/three/three.module.js?v=20260727h8";
  import { PLYLoader } from "../js/vendor/three/PLYLoader.js?v=20260727h8";
  import { buildVoxelGlb, exportScene, serializeGeometry, removeOutliers } from "../js/voxelize-shared.js?v=20260727h8";

  // this is only used for the small accordion thumbnail preview now — the
  // real display (processing.html onward) renders the raw point cloud
  // directly, so there's no reason to pay for a high-fidelity voxelization
  // just to fill a 78px preview box
  var VOXEL_TARGET = 8000;

  // the raw parsed point cloud, kept around so the density slider can
  // re-voxelize at a different level without re-parsing the file
  var lastRawGeometry = null;

  window.__convertPlyToGlb = function (arrayBuffer, targetCount) {
    return new Promise(function (resolve, reject) {
      try {
        var geometry = new PLYLoader().parse(arrayBuffer);

        // some exports named "point_cloud.ply" still carry sparse/naive face
        // data (their own triangulation over a raw scan) — trusting that
        // data draws exactly the long-shard artifacts this comment used to
        // warn about, since neighbouring points that aren't really adjacent
        // in the room get connected by a triangle anyway. Always voxelize
        // instead: it only looks at positions/colors, so a bad or absent
        // index makes no difference — always the point-cloud look actually
        // asked for here, never a guess at surface connectivity.
        // the streaks/confetti in a raw AR scan are stray drift points, not
        // a rendering artifact — strip them before they're ever voxelized
        geometry = removeOutliers(geometry);
        // kept in the source's own raw (Z-up) orientation — the Y-up
        // correction lives in deserializeGeometry() so it applies uniformly
        // whenever this data is loaded for viewing, not just baked in here
        lastRawGeometry = geometry;
        // this accordion thumbnail never goes through deserializeGeometry,
        // so it needs its own copy of that same correction to not preview
        // tipped over — a separate copy, since lastRawGeometry itself (fed
        // to serializeGeometry below) must stay in its raw orientation
        var previewGeometry = geometry.clone().rotateX(-Math.PI / 2);
        buildVoxelGlb(previewGeometry, targetCount || VOXEL_TARGET).then(resolve, reject);
      } catch (e) { reject(e); }
    });
  };

  // carries the raw point cloud across to processing.html so the density
  // slider (which lives there, not here) keeps working without re-reading
  // the source file
  window.__getRawGeometryBlob = function () {
    return lastRawGeometry ? serializeGeometry(lastRawGeometry) : null;
  };
</script>
</head>
<body>

  <div class="up-screen">

    <nav class="nav-top">
      <a class="logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</button>
    </nav>

    <main class="up-main">
      <h1 class="up-heading">How do you want to capture<br>your object / space / pet ?</h1>

      <section class="up-option" id="phoneOption">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="phone">
          <span>Connect your phone</span>
          <span class="up-toggle" aria-hidden="true">+</span>
          <span class="up-option-tip">sharp and well-lit, held straight, from the most detailed angle</span>
        </button>
        <div class="up-option-body" id="acc-phone" hidden>
          <div class="up-qr-wrap" id="phoneQrWrap" aria-label="Scan with your phone to connect"></div>
          <p class="up-qr-hint" id="phoneQrHint"></p>
        </div>
      </section>

      <!-- after the phone sends its photo, the desktop shows it back for a
           final look + a Process button — the same "see it, then proceed"
           beat the upload path has. Only appears when the phone relays a
           preview thumbnail (newer backend); otherwise the flow proceeds
           straight to processing as before. -->
      <div class="phone-confirm" id="phoneConfirm" hidden>
        <div class="phone-confirm-card">
          <p class="phone-confirm-title">your phone photo</p>
          <img class="phone-confirm-img" id="phoneConfirmImg" alt="the photo taken on your phone">
          <p class="phone-confirm-sub">build the 3D model from this photo?<br><span class="phone-confirm-note">or just take another on your phone</span></p>
          <div class="phone-confirm-actions">
            <button class="phone-confirm-process" type="button" id="phoneConfirmProcess">Process</button>
            <button class="phone-confirm-cancel" type="button" id="phoneConfirmCancel">Cancel</button>
          </div>
        </div>
      </div>

      <script>
        // this option scans a QR code to hand the capture off to a phone —
        // meaningless if you're already on the phone, so skip it there
        // (unlike the userAgent, "coarse pointer" can't be spoofed by width alone)
        if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
          document.getElementById("phoneOption").hidden = true;
        }
      </script>

      <section class="up-option">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="upload">
          <span>Upload Image</span>
          <span class="up-toggle" aria-hidden="true">+</span>
          <span class="up-option-tip">sharp and straight-on, from the most detailed angle, clean background</span>
        </button>
        <div class="up-option-body" id="acc-upload" hidden>

          <label class="up-drop" id="dropZone">
            <input type="file" id="fileInput" accept="image/*">
            <span class="up-drop-line">click to browse &mdash; no file has been uploaded yet</span>
          </label>

          <div class="up-selected" id="upSelected" hidden>
            <div class="up-file">
              <img class="up-thumb" id="upThumb" src="../assets/images/photo-chandelier.png" alt="">
              <span class="up-filename" id="upFilename"></span>
            </div>
            <div class="up-actions">
              <button class="up-btn up-btn--solid" type="button" onclick="startCapture(this)">Proceed</button>
              <button class="up-btn up-btn--ghost" type="button" id="upCancel">Cancel</button>
            </div>
          </div>

        </div>
      </section>

      <section class="up-option">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="scan">
          <span>Upload a ready-made scan</span>
          <span class="up-toggle" aria-hidden="true">+</span>
          <span class="up-option-tip">already have a 3D file? attach it directly, no scan needed</span>
        </button>
        <div class="up-option-body" id="acc-scan" hidden>

          <label class="up-drop" id="dropZoneScan" title="3D scans you made with external software that you'd like to attach here">
            <!-- no strict accept filter: iOS greys out .ply (it has no known
                 UTType), which hid legitimate point-cloud files from the
                 picker entirely. The change handler validates the extension
                 instead, so any wrong pick is rejected with a message. -->
            <input type="file" id="fileInputScan" multiple>
            <span class="up-drop-line">click to browse &mdash; .ply, .glb or .gltf (pick a .ply + a .glb together to keep both)</span>
          </label>

          <div class="up-selected" id="upSelectedScan" hidden>
            <div class="up-file">
              <model-viewer class="up-thumb up-thumb-model" id="upThumbScan" camera-controls tone-mapping="neutral"
                disable-pan bounds="tight" interaction-prompt="none" shadow-intensity="0" exposure="1"></model-viewer>
              <span class="up-filename" id="upFilenameScan"></span>
            </div>
            <div class="up-actions">
              <button class="up-btn up-btn--solid" type="button" onclick="startScanCapture(this)">Proceed</button>
              <button class="up-btn up-btn--ghost" type="button" id="upCancelScan">Cancel</button>
            </div>
          </div>

        </div>
      </section>

      <button class="up-back" type="button" onclick="goTo('onboarding.html')">Back</button>
    </main>

    <nav class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </nav>

  </div>

  <script>
    (function () {
      var drop = document.getElementById("dropZone");
      if (drop.__bound) return;
      drop.__bound = true;

      document.querySelectorAll(".up-option-head").forEach(function (head) {
        head.addEventListener("click", function () {
          var body = document.getElementById("acc-" + head.dataset.acc);
          var open = body.hidden;
          body.hidden = !open;
          head.setAttribute("aria-expanded", open);
          head.querySelector(".up-toggle").innerHTML = open ? "&minus;" : "+";
          if (head.dataset.acc === "phone") {
            if (open) startPhoneSession(); else stopPhoneSession();
          }
        });
      });

      // ----- "scan with your phone": a QR code opens phone-capture.html on
      // the phone, which takes the photo with its own camera and sends it to
      // Tripo directly; the worker relays the resulting task_id back here so
      // this desktop session can pick it up without any direct connection to
      // the phone -----
      var phoneApi = (window.TRACES_API || "").replace(/\/$/, "");
      var phonePollTimer = null;
      var phoneSessionId = null;
      // which shot the confirm card is currently showing, so a re-shoot from
      // the phone (a new task id in the same session) refreshes it rather than
      // re-opening it every poll
      var lastConfirmTaskId = null;
      // the id (photoUrl in the confirm-first flow, else task id) of a shot the
      // user explicitly Cancelled. The relayed photo stays live in the session
      // backend, so without this the very next poll (2.5s later) would see the
      // same id and re-open the confirm — "Cancel only lasts a second and a
      // half". Ignored until the phone sends a genuinely new shot.
      var cancelledConfirmId = null;

      function startPhoneSession() {
        var wrap = document.getElementById("phoneQrWrap");
        var hint = document.getElementById("phoneQrHint");
        if (!phoneApi) {
          wrap.innerHTML = "";
          hint.textContent = "phone capture needs the Tripo worker configured (js/config.js)";
          return;
        }
        // a brand-new QR session starts with nothing confirmed yet
        lastConfirmTaskId = null;
        cancelledConfirmId = null;
        var existingConfirm = document.getElementById("phoneConfirm");
        if (existingConfirm) existingConfirm.hidden = true;
        phoneSessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        var phoneUrl = new URL("phone-capture.html", window.location.href);
        phoneUrl.searchParams.set("session", phoneSessionId);
        phoneUrl.searchParams.set("api", phoneApi);

        var qr = window.qrcode(0, "M");
        qr.addData(phoneUrl.href);
        qr.make();
        wrap.innerHTML = qr.createSvgTag({ scalable: true });
        // the accordion header's own hover tip already says how this works —
        // this line stays empty until there's real status to report
        hint.textContent = "";

        clearInterval(phonePollTimer);
        // was 2500ms — noticing a phone's photo up to 2.5s late reads as
        // "did this even work?" to someone standing there watching their
        // phone screen say "sent". Tighter polling costs nothing here (a
        // lightweight KV read, only active during this brief handoff window)
        // and cuts that worst-case wait by more than half.
        phonePollTimer = setInterval(function () {
          fetch(phoneApi + "/session/" + phoneSessionId)
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.task_id) {
                var payload = resolvePhonePayload(d);
                if (payload.photoUrl) {
                  // nothing has been generated (or paid for) yet — the photo
                  // just waits here for a human yes. Re-shooting on the phone
                  // refreshes this same card with the newer shot. A shot the
                  // user Cancelled is left alone until the phone sends a new one.
                  if (payload.photoUrl === cancelledConfirmId) {
                    // dismissed — waiting for a fresh shot from the phone
                  } else if (payload.photoUrl !== lastConfirmTaskId) {
                    lastConfirmTaskId = payload.photoUrl;
                    hint.textContent = "photo received — confirm on your computer";
                    showPhoneConfirm(payload.thumb || payload.photoUrl, payload);
                  }
                } else if (payload.thumb) {
                  // older phone page: its generation is already running —
                  // keep the original confirm-then-continue behaviour
                  if (payload.taskId === cancelledConfirmId) {
                    // dismissed — leave it fully alone (no prep, no re-open)
                  } else {
                    prepPhoneCapture(payload.taskId, payload.thumb);
                    if (payload.taskId !== lastConfirmTaskId) {
                      lastConfirmTaskId = payload.taskId;
                      hint.textContent = "photo received — confirm on your computer";
                      showPhoneConfirm(payload.thumb, payload);
                    }
                  }
                } else {
                  // no preview available: keep the original straight-to-
                  // processing behaviour, unchanged
                  clearInterval(phonePollTimer);
                  prepPhoneCapture(payload.taskId, payload.thumb);
                  hint.textContent = "photo received — processing…";
                  goTo("processing.html");
                }
              }
            })
            .catch(function () {});
        }, 1000);
      }

      function stopPhoneSession() {
        clearInterval(phonePollTimer);
        phonePollTimer = null;
      }

      // the phone relays either a plain task id, or — when it has a preview to
      // show — a small JSON blob { t, thumb } stuffed into the same task_id
      // field (so it survives the current backend, which only stores task_id).
      // Unpack whichever shape arrived; a dedicated d.thumb from a future
      // backend is honoured too.
      function resolvePhonePayload(d) {
        var taskId = d.task_id;
        var thumb = d.thumb || null;
        var photoUrl = null;
        if (typeof taskId === "string" && taskId.charAt(0) === "{") {
          try {
            var parsed = JSON.parse(taskId);
            // newest phones relay { u: hosted photo, thumb } — no task exists
            // yet; the desktop starts the (paid) generation only on confirm.
            // Older { t: task id } payloads (a generation already running)
            // still unpack and behave exactly as before.
            if (parsed && parsed.u) {
              photoUrl = parsed.u;
              taskId = null;
              if (!thumb) thumb = parsed.thumb || null;
            } else if (parsed && parsed.t) {
              taskId = parsed.t;
              if (!thumb) thumb = parsed.thumb || null;
            }
          } catch (e) {}
        }
        return { taskId: taskId, thumb: thumb, photoUrl: photoUrl };
      }

      // hand this phone capture's task off to processing.html exactly the way
      // the desktop upload path does — kept in one place so the confirm-first
      // and the straight-through routes can't drift apart
      function prepPhoneCapture(taskId, thumb) {
        // remember which phone session started this build, so the processing
        // screen can relay the build's live state (building → ready, with the
        // finished image/GLB) back to the visitor's phone
        try { sessionStorage.setItem("traces-phone-session", phoneSessionId || ""); } catch (e) {}
        try {
          sessionStorage.removeItem("traces-task-error");
          // same staleness risk as the desktop upload path: a leftover
          // model/thumb from an earlier capture would otherwise get mistaken
          // for this phone capture's own
          sessionStorage.removeItem("traces-capture-model");
          sessionStorage.removeItem("traces-capture-thumb");
          sessionStorage.setItem("traces-capture-is-cloud", "0");
          sessionStorage.setItem("traces-mode", "tripo");
          sessionStorage.setItem("traces-task", taskId);
          localStorage.setItem("traces-inflight-task", JSON.stringify({ task_id: taskId, ts: Date.now() }));
        } catch (e) {}
        // the phone's preview photo doubles as the processing screen's
        // photo-particle source — without this, a phone capture only ever
        // showed the abstract sphere while building (the photo lived on the
        // phone; the desktop never had it)
        try {
          if (thumb) {
            // written synchronously — navigation to processing.html follows
            // this call immediately, and an async-only write loses that race
            // (the particles then fall back to the abstract sphere again).
            // The phone preview is a small compressed jpeg, safely under the
            // sessionStorage quota that full-size photos blow past.
            sessionStorage.setItem("traces-upload-img", thumb);
          } else {
            sessionStorage.removeItem("traces-upload-img");
          }
        } catch (e) {}
      }

      function showPhoneConfirm(thumb, payload) {
        var overlay = document.getElementById("phoneConfirm");
        var img = document.getElementById("phoneConfirmImg");
        var processBtn = document.getElementById("phoneConfirmProcess");
        processBtn.disabled = false;
        processBtn.textContent = "Process";
        // if the phone re-shoots, this same card is refreshed in place with a
        // quick cross-fade to the newer photo — no second dialog
        if (!overlay.hidden && img.src) {
          img.style.transition = "opacity 0.25s ease";
          img.style.opacity = "0";
          setTimeout(function () { img.src = thumb; img.style.opacity = "1"; }, 200);
        } else {
          img.src = thumb;
        }
        overlay.hidden = false;
        processBtn.onclick = function () {
          // the new flow: the phone only parked its photo — THIS click is
          // what starts the one paid generation, from the confirmed shot
          if (payload && payload.photoUrl) {
            processBtn.disabled = true;
            processBtn.textContent = "starting…";
            fetch(payload.photoUrl)
              .then(function (r) { return r.ok ? r.blob() : null; })
              .then(function (blob) {
                if (!blob) throw new Error("photo fetch failed");
                var fd = new FormData();
                fd.append("image", blob, "capture.jpg");
                return fetch(phoneApi + "/generate", { method: "POST", body: fd });
              })
              .then(function (r) { return r.json(); })
              .then(function (d) {
                if (!d || !d.task_id) throw new Error("no task id");
                clearInterval(phonePollTimer);
                prepPhoneCapture(d.task_id, payload.thumb || payload.photoUrl);
                overlay.hidden = true;
                goTo("processing.html");
              })
              .catch(function () {
                processBtn.disabled = false;
                processBtn.textContent = "Process";
                var h = document.getElementById("phoneQrHint");
                if (h) h.textContent = "couldn't start the build — try again";
              });
            return;
          }
          clearInterval(phonePollTimer);
          overlay.hidden = true;
          goTo("processing.html");
        };
        // Cancel dismisses this photo without building anything — the relay
        // keeps listening, so simply taking another photo on the phone re-opens
        // the confirm with the new shot
        document.getElementById("phoneConfirmCancel").onclick = function () {
          overlay.hidden = true;
          // remember exactly which shot was dismissed so the poll won't
          // re-open it; a fresh shot (new id) still shows normally
          cancelledConfirmId = lastConfirmTaskId;
          lastConfirmTaskId = null;
          var h = document.getElementById("phoneQrHint");
          if (h) h.textContent = "cancelled — take another photo on your phone";
        };
      }

      var input = document.getElementById("fileInput");
      var selected = document.getElementById("upSelected");
      var thumb = document.getElementById("upThumb");
      var filename = document.getElementById("upFilename");

      function accept(files) {
        if (!files || !files.length) return;
        var f = files[0];
        window.__selectedFile = f;
        filename.textContent = f.name;
        try { sessionStorage.setItem("traces-upload-name", f.name); } catch (e) {}
        if (f.type && f.type.indexOf("image/") === 0) {
          // HEIC (the default iPhone photo format) can't be decoded by an
          // <img> tag on most browsers — normalizeImageToJpeg() already
          // exists for the Tripo upload itself, but that only covers the
          // network request. Storing the raw HEIC here meant the thumbnail
          // below and every later screen that reads this same stored blob
          // (describe-capture, processing) showed a broken-image icon
          // instead of the photo. Normalize once, up front, and use that
          // for display, storage, and the Tripo upload alike.
          var normalized = window.normalizeImageToJpeg ? window.normalizeImageToJpeg(f) : Promise.resolve(f);
          // startCapture() (the Proceed button) reads window.__selectedFile
          // and needs traces-upload-img already in sessionStorage the moment
          // it navigates to processing.html — a visitor who clicks Proceed
          // quickly after picking a photo can easily beat this chain to the
          // finish line otherwise, landing on processing.html with neither
          // set yet, which is why that screen would show the hardcoded
          // placeholder photo instead of the real one. Exposed so Proceed
          // can wait on it.
          window.__uploadImgReady = normalized.then(function (displayBlob) {
            window.__selectedFile = displayBlob;
            try { thumb.src = URL.createObjectURL(displayBlob); } catch (e) {}
            // a data: URL in sessionStorage silently fails once the photo is
            // more than a few MB (an ordinary phone photo routinely is) — the
            // write throws QuotaExceededError, gets swallowed by the empty
            // catch below, and every later screen falls back to its hardcoded
            // placeholder image instead of the real photo. Ride the real file
            // in IndexedDB instead, same as ready-made scans already do.
            return window.BlobStore.set("upload-source-img", displayBlob);
          }).then(function () {
            try { sessionStorage.setItem("traces-upload-img", "idb:upload-source-img"); } catch (e) {}
          }).catch(function () {
            try { sessionStorage.removeItem("traces-upload-img"); } catch (e) {}
          });
        } else {
          try { sessionStorage.removeItem("traces-upload-img"); } catch (e) {}
          window.__uploadImgReady = window.BlobStore.del("upload-source-img").catch(function () {});
        }
        drop.hidden = true;
        selected.hidden = false;
      }

      input.addEventListener("change", function () { accept(input.files); });
      drop.addEventListener("dragover", function (e) {
        e.preventDefault();
        drop.classList.add("up-drop--over");
      });
      drop.addEventListener("dragleave", function () {
        drop.classList.remove("up-drop--over");
      });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        drop.classList.remove("up-drop--over");
        accept(e.dataTransfer.files);
      });

      document.getElementById("upCancel").addEventListener("click", function () {
        selected.hidden = true;
        drop.hidden = false;
        input.value = "";
        window.__selectedFile = null;
      });

      // ready-made scans: already-finished GLBs from external software —
      // no reconstruction needed, just carry the file straight through
      var dropScan = document.getElementById("dropZoneScan");
      var inputScan = document.getElementById("fileInputScan");
      var selectedScan = document.getElementById("upSelectedScan");
      var filenameScan = document.getElementById("upFilenameScan");
      var thumbScan = document.getElementById("upThumbScan");

      customElements.whenDefined("model-viewer").then(function () {
        customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
      });

      function showSelectedScan(file, displayName) {
        window.__selectedScanFile = file;
        filenameScan.textContent = displayName;
        try { thumbScan.src = URL.createObjectURL(file); } catch (e) {}
        dropScan.hidden = true;
        selectedScan.hidden = false;
      }

      function acceptScan(files) {
        if (!files || !files.length) return;
        var arr = Array.prototype.slice.call(files);
        window.__dualScan = false; // set true only when a mesh + a .ply arrive together
        var plyFile = null, meshFile = null;
        arr.forEach(function (x) {
          if (/\.ply$/i.test(x.name)) plyFile = plyFile || x;
          else if (/\.(glb|gltf)$/i.test(x.name)) meshFile = meshFile || x;
        });

        // both a mesh AND a point cloud for the same object: keep both — the
        // mesh (.glb) becomes the model, the .ply becomes the raw point cloud,
        // and the object view can toggle between the two representations. We
        // parse the .ply only to populate the raw geometry; the mesh the user
        // supplied is what's shown as the model.
        if (plyFile && meshFile) {
          window.__dualScan = true; // a real mesh + point-cloud pair for one object
          // keep the drop zone visible with a status while the .ply is parsed
          // (it can take a few seconds) — hiding both it and the preview left a
          // blank panel that read as broken
          var dualLine = dropScan.querySelector(".up-drop-line");
          if (dualLine) dualLine.textContent = "reading your scan… one moment";
          dropScan.hidden = false;
          selectedScan.hidden = true;
          filenameScan.textContent = plyFile.name + " + " + meshFile.name + " — reading…";
          var dualReader = new FileReader();
          dualReader.onload = function () {
            var convert = window.__convertPlyToGlb;
            if (!convert) { setTimeout(function () { acceptScan(files); }, 150); return; }
            convert(dualReader.result).then(function () {
              // __convertPlyToGlb set lastRawGeometry as a side effect (the raw
              // points); show the user's mesh as the actual model
              showSelectedScan(meshFile, meshFile.name + "  +  " + plyFile.name);
            }).catch(function (err) {
              filenameScan.textContent = plyFile.name + " — conversion failed";
              selectedScan.hidden = false;
              console.error("PLY conversion failed:", err);
            });
          };
          dualReader.onerror = function () {
            filenameScan.textContent = plyFile.name + " — could not read file";
            selectedScan.hidden = false;
          };
          dualReader.readAsArrayBuffer(plyFile);
          return;
        }

        var f = plyFile || meshFile || arr[0];
        if (!/\.ply$/i.test(f.name)) {
          showSelectedScan(f, f.name);
          return;
        }
        // a .ply file needs converting to glb before anything else can use it
        // — density itself is tuned later, on the processing screen
        dropScan.hidden = true;
        selectedScan.hidden = true;
        filenameScan.textContent = f.name + " — converting…";
        var reader = new FileReader();
        reader.onload = function () {
          var convert = window.__convertPlyToGlb;
          if (!convert) { setTimeout(function () { acceptScan(files); }, 150); return; }
          convert(reader.result).then(function (glb) {
            var blob = new Blob([glb], { type: "model/gltf-binary" });
            var glbName = f.name.replace(/\.ply$/i, ".glb");
            showSelectedScan(new File([blob], glbName, { type: "model/gltf-binary" }), f.name);
          }).catch(function (err) {
            filenameScan.textContent = f.name + " — conversion failed";
            selectedScan.hidden = false;
            console.error("PLY conversion failed:", err);
          });
        };
        reader.onerror = function () {
          filenameScan.textContent = f.name + " — could not read file";
          selectedScan.hidden = false;
        };
        reader.readAsArrayBuffer(f);
      }

      inputScan.addEventListener("change", function () { acceptScan(inputScan.files); });
      dropScan.addEventListener("dragover", function (e) {
        e.preventDefault();
        dropScan.classList.add("up-drop--over");
      });
      dropScan.addEventListener("dragleave", function () {
        dropScan.classList.remove("up-drop--over");
      });
      dropScan.addEventListener("drop", function (e) {
        e.preventDefault();
        dropScan.classList.remove("up-drop--over");
        acceptScan(e.dataTransfer.files);
      });

      document.getElementById("upCancelScan").addEventListener("click", function () {
        selectedScan.hidden = true;
        dropScan.hidden = false;
        inputScan.value = "";
        window.__selectedScanFile = null;
      });
    })();

    // a ready-made scan is already reconstructed — skip the Tripo call and
    // hand the model straight to the processing screen for review. a real
    // scan is routinely tens of MB — sessionStorage as a data: URL silently
    // fails past its quota (leaving stale data from an earlier, smaller
    // test), so the file rides in IndexedDB instead, referenced by a
    // "idb:<key>" marker that easily fits in sessionStorage.
    function startScanCapture(btn) {
      var file = window.__selectedScanFile;
      if (!file) return;
      if (btn) { btn.disabled = true; btn.textContent = "Reading..."; }
      try {
        sessionStorage.removeItem("traces-task");
        sessionStorage.removeItem("traces-task-error");
        // a desktop-only capture must not relay to a phone session left over
        // from an earlier phone hand-off
        sessionStorage.removeItem("traces-phone-session");
        sessionStorage.removeItem("traces-upload-img");
        // a previous capture's thumbnail (only ever set when Tripo actually
        // returned one) otherwise survives here unset, and describe-capture.html
        // would mistake it for this capture's own — every capture after the
        // first would silently reuse whichever photo happened to be the last
        // one Tripo thumbnailed, instead of showing its own.
        sessionStorage.removeItem("traces-capture-thumb");
        sessionStorage.setItem("traces-mode", "prescan");
        sessionStorage.setItem("traces-upload-name", file.name);
        sessionStorage.setItem("traces-capture-model", "idb:capture-pending");
        // remember whether this was a real mesh+cloud dual, so the object view
        // opens it on the mesh; a plain .ply also has a (voxel) model but must
        // open on its crisp point cloud, not the blocky voxel
        sessionStorage.setItem("traces-capture-dual", window.__dualScan ? "1" : "0");
      } catch (e) {}
      // carry the raw point cloud along too (if this was a point cloud),
      // so the density slider keeps working on the processing screen
      var rawBlob = window.__getRawGeometryBlob && window.__getRawGeometryBlob();
      var rawStored = rawBlob
        ? window.BlobStore.set("capture-pending-raw", rawBlob)
        : window.BlobStore.del("capture-pending-raw");
      try { sessionStorage.setItem("traces-capture-is-cloud", rawBlob ? "1" : "0"); } catch (e) {}
      Promise.all([window.BlobStore.set("capture-pending", file), rawStored]).then(function () {
        goTo("processing.html");
      }, function () {
        goTo("processing.html");
      });
    }

    // Proceed: if a Tripo worker is configured, kick off real reconstruction
    // (upload the image, get a task id, then let the processing screen poll it);
    // otherwise fall through to the simulated processing flow.
    function startCapture(btn) {
      if (btn) { btn.disabled = true; btn.textContent = "Uploading..."; }
      // wait for the same-file normalize/store chain accept() kicked off
      // when the photo was picked — clicking Proceed quickly after picking
      // used to beat that chain here, so processing.html's real-photo
      // preview silently fell back to its placeholder image
      (window.__uploadImgReady || Promise.resolve()).then(function () {
        startCaptureReady(btn);
      });
    }

    function startCaptureReady(btn) {
      var api = (window.TRACES_API || "").replace(/\/$/, "");
      var file = window.__selectedFile;
      try {
        sessionStorage.removeItem("traces-task");
        sessionStorage.removeItem("traces-mode");
        // a desktop-only capture must not relay to a stale phone session
        sessionStorage.removeItem("traces-phone-session");
        // a previous capture's model/thumbnail otherwise survive here unset
        // (Tripo doesn't always return a thumb, and this is only ever set
        // conditionally) — describe-capture.html would then mistake the
        // leftover for this capture's own, so every capture after the first
        // one that got a real thumb would silently reuse that same photo.
        sessionStorage.removeItem("traces-capture-model");
        sessionStorage.removeItem("traces-capture-thumb");
        // this is the flat image flow, not a ready-made point-cloud scan —
        // clear any leftover density-slider state from a previous scan
        // upload in this tab so it doesn't wrongly show up here
        sessionStorage.setItem("traces-capture-is-cloud", "0");
      } catch (e) {}
      window.BlobStore.del("capture-pending-raw").catch(function () {});
      if (api && file && file.type && file.type.indexOf("image/") === 0) {
        if (btn) { btn.disabled = true; btn.textContent = "Uploading..."; }
        window.normalizeImageToJpeg(file).then(function (jpegBlob) {
          var fd = new FormData();
          fd.append("image", jpegBlob, "capture.jpg");
          return fetch(api + "/generate", { method: "POST", body: fd });
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            // set traces-mode even on failure — otherwise processing.html
            // can't tell this was a real (failed) Tripo attempt and instead
            // fakes a successful simulated run into a broken next screen
            try { sessionStorage.setItem("traces-mode", "tripo"); } catch (e) {}
            if (d && d.task_id) {
              try {
                sessionStorage.setItem("traces-task", d.task_id);
                // a heavier model now routinely takes minutes to finish —
                // long enough that closing the tab, reloading, or a stale
                // page cache can orphan an already-paid-for task before its
                // result is ever seen. localStorage survives all of that,
                // so processing.html can pick the task back up regardless.
                localStorage.setItem("traces-inflight-task", JSON.stringify({ task_id: d.task_id, ts: Date.now() }));
              } catch (e) {}
            } else {
              try { sessionStorage.setItem("traces-task-error", JSON.stringify(d)); } catch (e) {}
            }
            goTo("processing.html");
          })
          .catch(function (e) {
            try {
              sessionStorage.setItem("traces-mode", "tripo");
              sessionStorage.setItem("traces-task-error", window.describeError(e));
            } catch (er) {}
            goTo("processing.html");
          });
      } else {
        goTo("processing.html");
      }
    }
  </script>

</body>
</html>
