<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Capture your object</title>
<link rel="stylesheet" href="../css/base.css?v=20260717b">
<link rel="stylesheet" href="../css/chrome.css?v=20260717b">
<link rel="stylesheet" href="../css/upload.css?v=20260717b">
<script src="../js/config.js?v=20260717b"></script>
<script src="../js/cursor.js?v=20260717b" defer></script>
<script src="../js/grain.js?v=20260717b" defer></script>
<script src="../js/blobstore.js?v=20260717b"></script>
<script src="../js/flow.js?v=20260717b" defer></script>
<script type="module" src="../js/vendor/model-viewer.min.js?v=20260717b"></script>
<script type="module">
  customElements.whenDefined("model-viewer").then(function () {
    customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
  });
</script>
<!-- model-viewer only reads glTF/GLB — a .ply upload is converted to GLB
     client-side (three.js) before it ever reaches the rest of the flow -->
<script type="importmap">
  { "imports": { "three": "../js/vendor/three/three.module.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { PLYLoader } from "../js/vendor/three/PLYLoader.js";
  import { buildVoxelGlb, exportScene, serializeGeometry } from "../js/voxelize-shared.js";

  var VOXEL_TARGET = 70000;

  // the raw parsed point cloud, kept around so the density slider can
  // re-voxelize at a different level without re-parsing the file
  var lastRawGeometry = null;

  window.__convertPlyToGlb = function (arrayBuffer, targetCount) {
    return new Promise(function (resolve, reject) {
      try {
        var geometry = new PLYLoader().parse(arrayBuffer);
        var hasColor = !!geometry.getAttribute("color");

        // no face/index data — this is a raw point cloud (the common case
        // for a direct scan export): voxelize it into small solid cubes
        // instead of either rendering 1px dots or guessing triangles
        // between unrelated neighbours (that guess produces "shard" artifacts)
        if (!geometry.index) {
          lastRawGeometry = geometry;
          buildVoxelGlb(geometry, targetCount || VOXEL_TARGET).then(resolve, reject);
        } else {
          lastRawGeometry = null;
          geometry.computeVertexNormals();
          var material = new THREE.MeshStandardMaterial({
            vertexColors: hasColor,
            color: hasColor ? 0xffffff : 0xcfcfcf,
            roughness: 0.85,
            metalness: 0.05,
          });
          var scene = new THREE.Scene();
          scene.add(new THREE.Mesh(geometry, material));
          exportScene(scene).then(resolve, reject);
        }
      } catch (e) { reject(e); }
    });
  };

  // carries the raw point cloud across to processing.html so the density
  // slider (which lives there, not here) keeps working without re-reading
  // the source file
  window.__getRawGeometryBlob = function () {
    return lastRawGeometry ? serializeGeometry(lastRawGeometry) : null;
  };
</script>
</head>
<body>

  <div class="up-screen">

    <nav class="nav-top">
      <a class="logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</button>
    </nav>

    <main class="up-main">
      <h1 class="up-heading">How do you want to capture<br>your object / space ?</h1>

      <section class="up-option">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="phone">
          <span>Connect you phone</span>
          <span class="up-toggle" aria-hidden="true">+</span>
        </button>
        <div class="up-option-body" id="acc-phone" hidden>
          <svg class="up-qr" viewBox="0 0 21 21" aria-label="Scan with your phone to connect">
            <rect width="21" height="21" fill="#f0eeea"/>
            <path fill="#0a25b4" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1zM2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 1h1v2H8zM10 1h2v1h-2zM13 2h1v3h-1zM8 4h2v1H8zM11 3h1v2h-1zM7 7h2v2H7zM10 7h1v1h-1zM12 7h2v1h-2zM15 8h2v1h-2zM18 7h2v2h-2zM1 8h2v1H1zM4 8h2v2H4zM1 10h1v2H1zM3 11h2v1H3zM6 10h2v2H6zM9 9h2v2H9zM12 9h1v3h-1zM14 11h2v1h-2zM17 10h1v2h-1zM19 11h1v1h-1zM8 12h1v2H8zM10 12h1v1h-1zM7 15h2v1H7zM10 14h2v2h-2zM13 14h1v2h-1zM15 14h2v2h-2zM18 14h2v1h-2zM8 17h1v2H8zM10 17h2v1h-2zM13 17h3v1h-3zM17 17h1v2h-1zM19 17h1v3h-1zM10 19h1v1h-1zM13 19h2v1h-2z"/>
          </svg>
        </div>
      </section>

      <section class="up-option">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="upload">
          <span>Upload Video / Image</span>
          <span class="up-toggle" aria-hidden="true">+</span>
        </button>
        <div class="up-option-body" id="acc-upload" hidden>

          <label class="up-drop" id="dropZone">
            <input type="file" id="fileInput" accept="video/*,image/*" multiple>
            <span class="up-drop-line">click to browse &mdash; no file has been uploaded yet</span>
          </label>

          <div class="up-selected" id="upSelected" hidden>
            <div class="up-file">
              <img class="up-thumb" id="upThumb" src="../assets/images/photo-chandelier.png" alt="">
              <span class="up-filename" id="upFilename"></span>
            </div>
            <div class="up-actions">
              <button class="up-btn up-btn--solid" type="button" onclick="startCapture(this)">Proceed</button>
              <button class="up-btn up-btn--ghost" type="button" id="upCancel">Cancel</button>
            </div>
          </div>

        </div>
      </section>

      <section class="up-option">
        <button class="up-option-head" type="button" aria-expanded="false" data-acc="scan"
          title="3D scans you made with external software that you'd like to attach here">
          <span>Upload a ready-made scan</span>
          <span class="up-toggle" aria-hidden="true">+</span>
        </button>
        <div class="up-option-body" id="acc-scan" hidden>

          <label class="up-drop" id="dropZoneScan" title="3D scans you made with external software that you'd like to attach here">
            <input type="file" id="fileInputScan" accept=".glb,.gltf,.ply,model/gltf-binary,model/gltf+json">
            <span class="up-drop-line">click to browse &mdash; no file has been uploaded yet</span>
          </label>

          <div class="up-selected" id="upSelectedScan" hidden>
            <div class="up-file">
              <model-viewer class="up-thumb up-thumb-model" id="upThumbScan" camera-controls
                disable-pan bounds="tight" interaction-prompt="none" shadow-intensity="0" exposure="1"></model-viewer>
              <span class="up-filename" id="upFilenameScan"></span>
            </div>
            <div class="up-actions">
              <button class="up-btn up-btn--solid" type="button" onclick="startScanCapture(this)">Proceed</button>
              <button class="up-btn up-btn--ghost" type="button" id="upCancelScan">Cancel</button>
            </div>
          </div>

        </div>
      </section>

      <button class="up-back" type="button" onclick="goTo('onboarding.html')">Back</button>
    </main>

    <nav class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </nav>

  </div>

  <script>
    (function () {
      var drop = document.getElementById("dropZone");
      if (drop.__bound) return;
      drop.__bound = true;

      document.querySelectorAll(".up-option-head").forEach(function (head) {
        head.addEventListener("click", function () {
          var body = document.getElementById("acc-" + head.dataset.acc);
          var open = body.hidden;
          body.hidden = !open;
          head.setAttribute("aria-expanded", open);
          head.querySelector(".up-toggle").innerHTML = open ? "&minus;" : "+";
        });
      });

      var input = document.getElementById("fileInput");
      var selected = document.getElementById("upSelected");
      var thumb = document.getElementById("upThumb");
      var filename = document.getElementById("upFilename");

      function accept(files) {
        if (!files || !files.length) return;
        var f = files[0];
        window.__selectedFile = f;
        filename.textContent = f.name;
        try { sessionStorage.setItem("traces-upload-name", f.name); } catch (e) {}
        if (f.type && f.type.indexOf("image/") === 0) {
          try { thumb.src = URL.createObjectURL(f); } catch (e) {}
          // keep a persistable copy so the capture carries the real image
          // across to the describe / archive screens
          var reader = new FileReader();
          reader.onload = function () {
            try { sessionStorage.setItem("traces-upload-img", reader.result); } catch (e) {}
          };
          reader.readAsDataURL(f);
        } else {
          try { sessionStorage.removeItem("traces-upload-img"); } catch (e) {}
        }
        drop.hidden = true;
        selected.hidden = false;
      }

      input.addEventListener("change", function () { accept(input.files); });
      drop.addEventListener("dragover", function (e) {
        e.preventDefault();
        drop.classList.add("up-drop--over");
      });
      drop.addEventListener("dragleave", function () {
        drop.classList.remove("up-drop--over");
      });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        drop.classList.remove("up-drop--over");
        accept(e.dataTransfer.files);
      });

      document.getElementById("upCancel").addEventListener("click", function () {
        selected.hidden = true;
        drop.hidden = false;
        input.value = "";
        window.__selectedFile = null;
      });

      // ready-made scans: already-finished GLBs from external software —
      // no reconstruction needed, just carry the file straight through
      var dropScan = document.getElementById("dropZoneScan");
      var inputScan = document.getElementById("fileInputScan");
      var selectedScan = document.getElementById("upSelectedScan");
      var filenameScan = document.getElementById("upFilenameScan");
      var thumbScan = document.getElementById("upThumbScan");

      customElements.whenDefined("model-viewer").then(function () {
        customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
      });

      function showSelectedScan(file, displayName) {
        window.__selectedScanFile = file;
        filenameScan.textContent = displayName;
        try { thumbScan.src = URL.createObjectURL(file); } catch (e) {}
        dropScan.hidden = true;
        selectedScan.hidden = false;
      }

      function acceptScan(files) {
        if (!files || !files.length) return;
        var f = files[0];
        if (!/\.ply$/i.test(f.name)) {
          showSelectedScan(f, f.name);
          return;
        }
        // a .ply file needs converting to glb before anything else can use it
        // — density itself is tuned later, on the processing screen
        dropScan.hidden = true;
        selectedScan.hidden = true;
        filenameScan.textContent = f.name + " — converting…";
        var reader = new FileReader();
        reader.onload = function () {
          var convert = window.__convertPlyToGlb;
          if (!convert) { setTimeout(function () { acceptScan(files); }, 150); return; }
          convert(reader.result).then(function (glb) {
            var blob = new Blob([glb], { type: "model/gltf-binary" });
            var glbName = f.name.replace(/\.ply$/i, ".glb");
            showSelectedScan(new File([blob], glbName, { type: "model/gltf-binary" }), f.name);
          }).catch(function (err) {
            filenameScan.textContent = f.name + " — conversion failed";
            selectedScan.hidden = false;
            console.error("PLY conversion failed:", err);
          });
        };
        reader.onerror = function () {
          filenameScan.textContent = f.name + " — could not read file";
          selectedScan.hidden = false;
        };
        reader.readAsArrayBuffer(f);
      }

      inputScan.addEventListener("change", function () { acceptScan(inputScan.files); });
      dropScan.addEventListener("dragover", function (e) {
        e.preventDefault();
        dropScan.classList.add("up-drop--over");
      });
      dropScan.addEventListener("dragleave", function () {
        dropScan.classList.remove("up-drop--over");
      });
      dropScan.addEventListener("drop", function (e) {
        e.preventDefault();
        dropScan.classList.remove("up-drop--over");
        acceptScan(e.dataTransfer.files);
      });

      document.getElementById("upCancelScan").addEventListener("click", function () {
        selectedScan.hidden = true;
        dropScan.hidden = false;
        inputScan.value = "";
        window.__selectedScanFile = null;
      });
    })();

    // a ready-made scan is already reconstructed — skip the Tripo call and
    // hand the model straight to the processing screen for review. a real
    // scan is routinely tens of MB — sessionStorage as a data: URL silently
    // fails past its quota (leaving stale data from an earlier, smaller
    // test), so the file rides in IndexedDB instead, referenced by a
    // "idb:<key>" marker that easily fits in sessionStorage.
    function startScanCapture(btn) {
      var file = window.__selectedScanFile;
      if (!file) return;
      if (btn) { btn.disabled = true; btn.textContent = "Reading…"; }
      try {
        sessionStorage.removeItem("traces-task");
        sessionStorage.removeItem("traces-task-error");
        sessionStorage.removeItem("traces-upload-img");
        sessionStorage.setItem("traces-mode", "prescan");
        sessionStorage.setItem("traces-upload-name", file.name);
        sessionStorage.setItem("traces-capture-model", "idb:capture-pending");
      } catch (e) {}
      // carry the raw point cloud along too (if this was a point cloud),
      // so the density slider keeps working on the processing screen
      var rawBlob = window.__getRawGeometryBlob && window.__getRawGeometryBlob();
      var rawStored = rawBlob
        ? window.BlobStore.set("capture-pending-raw", rawBlob)
        : window.BlobStore.del("capture-pending-raw");
      try { sessionStorage.setItem("traces-capture-is-cloud", rawBlob ? "1" : "0"); } catch (e) {}
      Promise.all([window.BlobStore.set("capture-pending", file), rawStored]).then(function () {
        goTo("processing.html");
      }, function () {
        goTo("processing.html");
      });
    }

    // Proceed: if a Tripo worker is configured, kick off real reconstruction
    // (upload the image, get a task id, then let the processing screen poll it);
    // otherwise fall through to the simulated processing flow.
    function startCapture(btn) {
      var api = (window.TRACES_API || "").replace(/\/$/, "");
      var file = window.__selectedFile;
      try {
        sessionStorage.removeItem("traces-task");
        sessionStorage.removeItem("traces-mode");
        // this is the flat image/video flow, not a ready-made point-cloud
        // scan — clear any leftover density-slider state from a previous
        // scan upload in this tab so it doesn't wrongly show up here
        sessionStorage.setItem("traces-capture-is-cloud", "0");
      } catch (e) {}
      window.BlobStore.del("capture-pending-raw").catch(function () {});
      if (api && file && file.type && file.type.indexOf("image/") === 0) {
        if (btn) { btn.disabled = true; btn.textContent = "Uploading…"; }
        var fd = new FormData();
        fd.append("image", file, file.name || "capture.jpg");
        fetch(api + "/generate", { method: "POST", body: fd })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.task_id) {
              try {
                sessionStorage.setItem("traces-mode", "tripo");
                sessionStorage.setItem("traces-task", d.task_id);
              } catch (e) {}
            } else {
              try { sessionStorage.setItem("traces-task-error", JSON.stringify(d)); } catch (e) {}
            }
            goTo("processing.html");
          })
          .catch(function (e) {
            try { sessionStorage.setItem("traces-task-error", String(e)); } catch (er) {}
            goTo("processing.html");
          });
      } else {
        goTo("processing.html");
      }
    }
  </script>

</body>
</html>
