<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Community</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../css/base.css?v=20260725h">
<link rel="stylesheet" href="../css/chrome.css?v=20260725h">
<link rel="stylesheet" href="../css/gallery.css?v=20260725h">
<script src="../js/cursor.js?v=20260725h" defer></script>
<script src="../js/grain.js?v=20260725h" defer></script>
<script src="../js/owner.js?v=20260725h"></script>
<script src="../js/config.js?v=20260725h"></script>
<script src="../js/archive.js?v=20260725h"></script>
<script src="../js/blobstore.js?v=20260725h"></script>
<script src="../js/remote-captures.js?v=20260725h"></script>
<script src="../js/designer-archive.js?v=20260725h"></script>
<script src="../js/community-seed.js?v=20260725h"></script>
<script src="../js/gallery-title.js?v=20260725h" defer></script>
<script src="../js/flow.js?v=20260725h" defer></script>
</head>
<body>

  <div class="gal-screen gal--community">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</button>
    </header>

    <div class="gal-title-block">
      <p class="gal-updated">everything we share lives here</p>
      <h1 class="gal-title">our community</h1>
    </div>

    <div class="gal-filters" id="galFilters">
      <label class="gal-filter"><input type="checkbox" value="object"> object</label>
      <label class="gal-filter"><input type="checkbox" value="space"> space</label>
    </div>

    <main class="gal-grid" id="galGrid"></main>

    <footer class="nav-bottom">
      <span class="nav-link nav-current nav-corner nav-corner--bl">Community</span>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

    <!-- long-press management mode: dims everything behind the selected
         polaroid(s) and their hide/delete controls - same pattern as
         gallery.html's archive -->
    <div class="gal-manage-backdrop" id="galManageBackdrop" hidden></div>

  </div>

  <script>
    // opening any capture from here (including the fixed showcase cards,
    // which carry no visibility flag of their own) should show the
    // community's blue-purple backdrop on the object view too
    window.openCommunityObject = function (key) {
      // set the item + community flag directly and navigate — not via
      // openObject(), which deliberately clears the community flag
      try {
        sessionStorage.setItem("traces-item", key);
        sessionStorage.setItem("traces-from-community", "1");
      } catch (e) {}
      goTo("object.html");
    };

    (function () {
      var grid = document.getElementById("galGrid");
      if (!grid) return;
      var screenEl = document.querySelector(".gal-screen");
      var manageBackdrop = document.getElementById("galManageBackdrop");

      // same long-press + shift-click multi-select as gallery.html: only
      // one hide/delete row is ever on screen, living under whichever card
      // was marked most recently, acting on every currently marked card
      var activeActionsRow = null;
      function showActionsUnder(art) {
        if (activeActionsRow) activeActionsRow.hidden = true;
        activeActionsRow = art.querySelector(".gal-item-actions");
        activeActionsRow.hidden = false;
      }
      function hideActiveActionsRow() {
        if (activeActionsRow) activeActionsRow.hidden = true;
        activeActionsRow = null;
      }
      function exitManageMode() {
        grid.querySelectorAll(".gal-item--selected").forEach(function (a) { a.classList.remove("gal-item--selected"); });
        hideActiveActionsRow();
        screenEl.classList.remove("gal-screen--manage");
        manageBackdrop.hidden = true;
      }
      manageBackdrop.addEventListener("click", exitManageMode);
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".gal-item")) exitManageMode();
      });

      // hiding a community piece (whether the fixed showcase or a real
      // shared capture) is a personal declutter for a regular visitor -
      // purely local. For Mor (owner device), it's curation: it also goes
      // to the same shared "hidden showcase" list used by her own archive
      // showcase in gallery.html, so it disappears for every visitor.
      var HIDDEN_KEY = "traces-community-hidden";
      var globalHiddenKeys = [];
      function hiddenKeys() {
        var local;
        try { local = JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch (e) { local = []; }
        return local.concat(globalHiddenKeys.filter(function (k) { return local.indexOf(k) === -1; }));
      }
      function hideItem(key) {
        var local;
        try { local = JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch (e) { local = []; }
        if (local.indexOf(key) === -1) local.push(key);
        try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(local)); } catch (e) {}
        if (window.isOwnerDevice && window.isOwnerDevice() && window.RemoteCaptures) {
          if (globalHiddenKeys.indexOf(key) === -1) globalHiddenKeys.push(key);
          RemoteCaptures.hideShowcaseGlobally(key);
        }
      }

      function ago(ts) {
        var d = Math.floor((Date.now() - (ts || Date.now())) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }

      // one polaroid card shared by the fixed showcase, the visitor's own
      // shared captures, and other people's shared captures - they only
      // differ in their metadata line and in whether "remove" is offered
      // at all (see buildEntry below)
      function buildCard(entry) {
        var art = document.createElement("article");
        art.className = "gal-item";
        art.dataset.kind = entry.kind || "object";
        art.dataset.hideKey = entry.id;
        art.innerHTML =
          '<p class="gal-meta">' + entry.metaText + '<br><span class="gal-who"></span></p>' +
          '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
          (entry.syncStatus ? '<p class="gal-sync-status gal-sync-status--' + entry.syncStatus + '" data-cap-id="' + entry.id + '"></p>' : '') +
          '<div class="gal-item-actions" hidden>' +
            '<button class="gal-hide" type="button">hide</button>' +
            (entry.remove ? '<button class="gal-delete" type="button">delete</button>' : '') +
            // owner-only, real server captures only: swap the polaroid's photo
            // right here instead of on the separate admin page
            (entry.serverId ? '<label class="gal-changeimg">change image<input type="file" accept="image/*" hidden></label>' : '') +
          '</div>';
        art.querySelector(".gal-who").textContent = entry.who;
        var imgEl = art.querySelector("img");
        if (window.BlobStore) {
          window.BlobStore.url(entry.img).then(function (u) { imgEl.src = u || "../assets/images/photo-room.png"; });
        } else {
          imgEl.src = entry.img || "../assets/images/photo-room.png";
        }
        art.querySelector(".gal-caption").textContent = entry.title || "untitled capture";
        // a quiet confirmation that a capture shared to the community actually
        // reached the shared server (so visitors on other devices can see it
        // too) — same status pattern as "your archive"'s own sync line
        if (entry.syncStatus) {
          var statusEl = art.querySelector(".gal-sync-status");
          statusEl.textContent = entry.syncStatus === "synced"
            ? "☁ shared — visible to visitors"
            : entry.syncStatus === "uploading" ? "sharing…" : "not shared yet";
        }
        art.__hide = entry.hide;
        art.__remove = entry.remove;

        var card = art.querySelector(".gal-card");
        var timer = null, longPressed = false;

        function toggleMarked() {
          var nowSelected = art.classList.toggle("gal-item--selected");
          if (nowSelected) {
            showActionsUnder(art);
          } else if (activeActionsRow === art.querySelector(".gal-item-actions")) {
            var stillMarked = grid.querySelector(".gal-item--selected");
            if (stillMarked) showActionsUnder(stillMarked); else hideActiveActionsRow();
          }
        }

        function startPress() {
          longPressed = false;
          timer = setTimeout(function () {
            longPressed = true;
            art.classList.add("gal-item--selected");
            screenEl.classList.add("gal-screen--manage");
            manageBackdrop.hidden = false;
            showActionsUnder(art);
          }, 480);
        }
        function endPress() { clearTimeout(timer); }

        card.addEventListener("mousedown", startPress);
        card.addEventListener("touchstart", startPress, { passive: true });
        card.addEventListener("mouseup", endPress);
        card.addEventListener("mouseleave", endPress);
        card.addEventListener("touchend", endPress);
        card.addEventListener("click", function (e) {
          if (longPressed) { e.preventDefault(); return; }
          if (e.shiftKey) { toggleMarked(); return; }
          try {
            sessionStorage.setItem("traces-item", entry.id);
            sessionStorage.setItem("traces-from-community", "1");
          } catch (er) {}
          goTo("object.html");
        });
        art.querySelector(".gal-hide").addEventListener("click", function () {
          grid.querySelectorAll(".gal-item--selected").forEach(function (a) { if (a.__hide) { a.__hide(); a.remove(); } });
        });
        var delBtn = art.querySelector(".gal-delete");
        if (delBtn) {
          delBtn.addEventListener("click", function () {
            grid.querySelectorAll(".gal-item--selected").forEach(function (a) { if (a.__remove) { a.__remove(); a.remove(); } });
          });
        }
        var changeImg = art.querySelector(".gal-changeimg");
        if (changeImg && entry.serverId) {
          var input = changeImg.querySelector("input");
          input.addEventListener("change", function () {
            var file = input.files[0];
            if (!file) return;
            changeImg.textContent = "uploading…";
            replaceImage(entry.serverId, file, imgEl, function (ok) {
              changeImg.textContent = ok ? "changed" : "failed — retry";
            });
          });
        }
        return art;
      }

      // upload a new photo, then rewrite that capture's shared record in
      // place with the new image url (the same mechanism the admin page
      // uses) - keeps every other field of the record intact
      function replaceImage(serverId, file, imgEl, done) {
        var api = (window.TRACES_API || "").replace(/\/$/, "");
        if (!api) { done(false); return; }
        var form = new FormData();
        form.append("file", file, file.name || "file");
        var xhr = new XMLHttpRequest();
        xhr.open("POST", api + "/captures/upload");
        xhr.onload = function () {
          if (xhr.status < 200 || xhr.status >= 300) { done(false); return; }
          var url = null;
          try { url = JSON.parse(xhr.responseText).url; } catch (e) {}
          if (!url) { done(false); return; }
          fetch(api + "/captures")
            .then(function (r) { return r.ok ? r.json() : { captures: [] }; })
            .then(function (d) {
              var rec = (d.captures || []).filter(function (c) { return c.id === serverId; })[0];
              if (!rec) { done(false); return; }
              rec.img = url;
              return fetch(api + "/captures", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(rec),
              }).then(function (r2) {
                if (r2.ok) { imgEl.src = url; done(true); } else { done(false); }
              });
            })
            .catch(function () { done(false); });
        };
        xhr.onerror = function () { done(false); };
        xhr.send(form);
      }

      // local items render immediately (no need to wait on anything) using
      // just this browser's own local hidden list, then get reconciled
      // against Mor's global hides below once that resolves - a quick,
      // rare, invisible-in-practice DOM removal rather than a visible flash
      var hidden = hiddenKeys();

      // the visitor's own captures shared to the community appear first —
      // remote items this same browser already made locally would otherwise
      // double up (a remote community record's id is "<capture id>-community";
      // strip that back off to compare against this browser's own local ids)
      // only Mor's own devices get a delete control on a remote item (see
      // js/owner.js) — declared up here, before the early return below, so
      // it's still set even when this browser's own local Community is empty
      // (the common case: buildEntry()/isOwner are needed by the remote-merge
      // callback further down regardless of what's found locally)
      var isOwner = window.isOwnerDevice && window.isOwnerDevice();
      function buildEntry(c) {
        return {
          id: c.id, title: c.title, img: c.img, kind: c.kind,
          metaText: ago(c.created), who: (c.by ? c.by : "your") + "'s capture" + (c.country ? " from " + c.country : ""),
          syncStatus: c.syncStatus,
          // real shared captures live on the server under "<id>-community";
          // only the owner may re-photograph one from here
          serverId: isOwner ? c.id + "-community" : null,
          hide: function () { hideItem(c.id); },
          // a remote item (someone else's device, or Mor's own past share)
          // only gets a delete control for Mor herself — a random visitor
          // shouldn't be able to remove another person's shared capture
          remove: (!c.remote || isOwner) ? function () {
            if (c.remote) {
              // a remote item lives only in the shared worker store, under
              // its own "<id>-community" record id — never in this browser's
              // local Community list, so there's nothing local to remove
              var api = (window.TRACES_API || "").replace(/\/$/, "");
              if (api) fetch(api + "/captures/" + c.id + "-community", { method: "DELETE" }).catch(function () {});
            } else {
              Community.remove(c.id);
              // this browser's own share also lives on the shared server
              // under its own record - without deleting that too, it would
              // keep showing up for every other visitor even after "removed"
              var api = (window.TRACES_API || "").replace(/\/$/, "");
              if (api) fetch(api + "/captures/" + c.id + "-community", { method: "DELETE" }).catch(function () {});
            }
          } : null,
        };
      }

      // this browser's own shared captures render immediately, before the
      // server confirms anything - "not shared yet" is the honest starting
      // state, corrected to "shared" (or caught up entirely) once the
      // remote-merge below resolves, same as the archive's own sync line
      var items = (window.Community ? Community.all() : []).filter(function (c) { return hidden.indexOf(c.id) === -1; });
      items.forEach(function (c) { grid.insertBefore(buildCard(buildEntry(Object.assign({ syncStatus: "local-only" }, c))), grid.firstChild); });
      if (window.alignGalleryTitle) window.alignGalleryTitle();

      // Mor's global hides need to be known before the seed showcase and
      // the remote-merge below decide what to build at all - fetching this
      // first (in parallel with those two) and gating both on it avoids a
      // race where a globally-hidden item could still flash into the grid
      // before this resolves
      var hiddenReady = window.RemoteCaptures ? RemoteCaptures.listHiddenShowcase() : Promise.resolve([]);
      hiddenReady.then(function (list) {
        globalHiddenKeys = list || [];
        // an owner's local community hides are curation meant for everyone —
        // push any that never reached the shared list up now (same reconcile
        // the archive does), so a hide made while not in owner mode still
        // catches up to every visitor the next time Mor opens this as owner
        if (window.isOwnerDevice && window.isOwnerDevice() && window.RemoteCaptures) {
          var localHidden = [];
          try { localHidden = JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch (e) {}
          localHidden.forEach(function (key) {
            if (globalHiddenKeys.indexOf(key) === -1) {
              globalHiddenKeys.push(key);
              RemoteCaptures.hideShowcaseGlobally(key);
            }
          });
        }
        // reconcile the local items already built above, in case one of
        // them is now globally hidden too
        globalHiddenKeys.forEach(function (key) {
          var art = grid.querySelector('.gal-item[data-hide-key="' + key + '"]');
          if (art) art.remove();
        });
      });

      // the fixed community showcase (seeded from community/manifest.json)
      // renders first — then the visitor's own shared captures are
      // inserted before them, so those appear first in the grid
      if (window.communitySeedReady) {
        Promise.all([window.communitySeedReady, hiddenReady]).then(function (results) {
          var list = results[0];
          var fullHidden = hiddenKeys();
          (list || []).filter(function (d) { return fullHidden.indexOf(d.key) === -1; }).forEach(function (d) {
            grid.appendChild(buildCard({
              id: d.key, title: d.title, img: d.img, kind: d.kind,
              metaText: d.meta, who: d.by + "'s capture from " + d.country,
              hide: function () { hideItem(d.key); },
            }));
          });
          if (window.alignGalleryTitle) window.alignGalleryTitle();
        });
      }

      // the designer's own built-in showcase (chandelier, couch, etc.) stays
      // in "my archive"/"your archive" only — the community is meant to hold
      // real shared captures, not a copy of that catalog too.

      var localCommunityIds = {};
      (window.Community ? Community.all() : []).forEach(function (c) { localCommunityIds[c.id] = true; });
      var remoteReady = window.RemoteCaptures ? RemoteCaptures.list("community") : Promise.resolve([]);
      Promise.all([remoteReady, hiddenReady]).then(function (results) {
        var list = results[0];
        var fullHidden = hiddenKeys();
        (list || []).forEach(function (c) {
          var localId = c.id.replace(/-community$/, "");
          if (localCommunityIds[localId] || fullHidden.indexOf(localId) !== -1) return;
          grid.insertBefore(buildCard(buildEntry(Object.assign({}, c, { id: localId, remote: true }))), grid.firstChild);
        });
        // this browser's own cards rendered as "not shared yet" before this
        // resolved - flip any that the server already actually has to
        // "shared" now, rather than leaving a stale/wrong badge sitting there
        (list || []).forEach(function (c) {
          var localId = c.id.replace(/-community$/, "");
          if (!localCommunityIds[localId]) return;
          var el = grid.querySelector('.gal-sync-status[data-cap-id="' + localId + '"]');
          if (el) { el.textContent = "☁ shared — visible to visitors"; el.className = "gal-sync-status gal-sync-status--synced"; }
        });
        // anything shared to the community from this browser before the
        // shared store was reachable never made it there — send it now
        if (window.RemoteCaptures) {
          RemoteCaptures.syncMissing(window.Community ? Community.all() : [], list, "community", function (capId, pct, done, success) {
            var el = grid.querySelector('.gal-sync-status[data-cap-id="' + capId + '"]');
            if (!el) return;
            if (!done) {
              el.textContent = "sharing… " + Math.round(pct * 100) + "%";
              el.className = "gal-sync-status gal-sync-status--uploading";
            } else if (success) {
              el.textContent = "☁ shared — visible to visitors";
              el.className = "gal-sync-status gal-sync-status--synced";
            } else {
              el.textContent = "not shared yet";
              el.className = "gal-sync-status gal-sync-status--local-only";
            }
          });
        }
      });
    })();

    // square checkbox toggles above the grid — checking one or both narrows
    // the grid to that kind; leaving both unchecked shows everything
    (function () {
      var grid = document.querySelector(".gal-grid");
      var filters = document.getElementById("galFilters");
      if (!grid || !filters) return;
      function applyFilter() {
        var active = Array.from(filters.querySelectorAll("input:checked")).map(function (i) { return i.value; });
        grid.querySelectorAll(".gal-item").forEach(function (art) {
          art.hidden = active.length > 0 && active.indexOf(art.dataset.kind) === -1;
        });
      }
      filters.addEventListener("change", applyFilter);
    })();
  </script>

</body>
</html>
