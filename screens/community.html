<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Community</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../css/base.css?v=20260719s">
<link rel="stylesheet" href="../css/chrome.css?v=20260719s">
<link rel="stylesheet" href="../css/gallery.css?v=20260719s">
<script src="../js/cursor.js?v=20260719s" defer></script>
<script src="../js/grain.js?v=20260719s" defer></script>
<script src="../js/owner.js?v=20260719s"></script>
<script src="../js/config.js?v=20260719s"></script>
<script src="../js/archive.js?v=20260719s"></script>
<script src="../js/blobstore.js?v=20260719s"></script>
<script src="../js/remote-captures.js?v=20260719s"></script>
<script src="../js/designer-archive.js?v=20260719s"></script>
<script src="../js/community-seed.js?v=20260719s"></script>
<script src="../js/gallery-title.js?v=20260719s" defer></script>
<script src="../js/flow.js?v=20260719s" defer></script>
</head>
<body>

  <div class="gal-screen gal--community">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <button class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</button>
    </header>

    <div class="gal-title-block">
      <p class="gal-updated">everything we share lives here</p>
      <h1 class="gal-title">our community</h1>
    </div>

    <div class="gal-filters" id="galFilters">
      <label class="gal-filter"><input type="checkbox" value="object"> object</label>
      <label class="gal-filter"><input type="checkbox" value="space"> space</label>
    </div>

    <main class="gal-grid" id="galGrid"></main>

    <footer class="nav-bottom">
      <span class="nav-link nav-current nav-corner nav-corner--bl">Community</span>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

  </div>

  <script>
    // opening any capture from here (including the fixed showcase cards,
    // which carry no visibility flag of their own) should show the
    // community's blue-purple backdrop on the object view too
    window.openCommunityObject = function (key) {
      try { sessionStorage.setItem("traces-from-community", "1"); } catch (e) {}
      openObject(key);
    };

    (function () {
      var grid = document.getElementById("galGrid");
      if (!grid) return;

      // the fixed community showcase (seeded from community/manifest.json)
      // renders first — then the visitor's own shared captures are
      // inserted before them, so those appear first in the grid
      if (window.communitySeedReady) {
        window.communitySeedReady.then(function (list) {
          (list || []).forEach(function (d) {
            var art = document.createElement("article");
            art.className = "gal-item";
            art.dataset.kind = d.kind || "object";
            art.innerHTML =
              '<p class="gal-meta">' + d.meta + '<br>' + d.by + '\'s capture from ' + d.country + '</p>' +
              '<button class="gal-card" type="button" onclick="openCommunityObject(\'' + d.key + '\')">' +
                '<img src="' + d.img + '" alt="">' +
                '<span class="gal-caption">' + d.title + '</span>' +
              '</button>';
            grid.appendChild(art);
          });
        });
      }

      // the designer's own built-in showcase (chandelier, couch, etc.) stays
      // in "my archive"/"your archive" only — the community is meant to hold
      // real shared captures, not a copy of that catalog too.

      // the visitor's own captures shared to the community appear first —
      // remote items this same browser already made locally would otherwise
      // double up (a remote community record's id is "<capture id>-community";
      // strip that back off to compare against this browser's own local ids)
      // only Mor's own devices get a delete control on a remote item (see
      // js/owner.js) — declared up here, before the early return below, so
      // it's still set even when this browser's own local Community is empty
      // (the common case: build()/isOwner are needed by the remote-merge
      // callback further down regardless of what's found locally)
      var isOwner = window.isOwnerDevice && window.isOwnerDevice();
      var localCommunityIds = {};
      (window.Community ? Community.all() : []).forEach(function (c) { localCommunityIds[c.id] = true; });
      var remoteReady = window.RemoteCaptures ? RemoteCaptures.list("community") : Promise.resolve([]);
      remoteReady.then(function (list) {
        (list || []).forEach(function (c) {
          var localId = c.id.replace(/-community$/, "");
          if (localCommunityIds[localId]) return;
          grid.insertBefore(build(Object.assign({}, c, { id: localId, remote: true })), grid.firstChild);
        });
        // anything shared to the community from this browser before the
        // shared store was reachable never made it there — send it now
        if (window.RemoteCaptures) {
          RemoteCaptures.syncMissing(window.Community ? Community.all() : [], list, "community");
        }
      });

      var items = (window.Community ? Community.all() : []);
      if (!items.length) return;
      function ago(ts) {
        var d = Math.floor((Date.now() - (ts || Date.now())) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }
      function build(c) {
        var art = document.createElement("article");
        art.className = "gal-item";
        art.dataset.kind = c.kind || "object";
        var who = (c.by ? c.by : "your") + "'s capture" + (c.country ? " from " + c.country : "");
        // a remote item (someone else's device, or Mor's own past share)
        // only gets a delete control for Mor herself — a random visitor
        // shouldn't be able to remove another person's shared capture
        art.innerHTML =
          '<p class="gal-meta">' + ago(c.created) + '<br><span class="gal-who"></span></p>' +
          '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>' +
          (!c.remote || isOwner ? '<button class="gal-delete" type="button" hidden>delete capture</button>' : '');
        art.querySelector(".gal-who").textContent = who;
        var imgEl = art.querySelector("img");
        if (window.BlobStore) {
          window.BlobStore.url(c.img).then(function (u) { imgEl.src = u || "../assets/images/photo-room.png"; });
        } else {
          imgEl.src = c.img || "../assets/images/photo-room.png";
        }
        art.querySelector(".gal-caption").textContent = c.title || "untitled capture";
        var card = art.querySelector(".gal-card");
        var del = art.querySelector(".gal-delete");
        var timer = null, longPressed = false;
        function startPress() {
          if (!del) return;
          longPressed = false;
          timer = setTimeout(function () {
            longPressed = true;
            grid.querySelectorAll(".gal-delete").forEach(function (b) { if (b !== del) b.hidden = true; });
            del.hidden = false;
          }, 480);
        }
        function endPress() { clearTimeout(timer); }
        card.addEventListener("mousedown", startPress);
        card.addEventListener("touchstart", startPress, { passive: true });
        card.addEventListener("mouseup", endPress);
        card.addEventListener("mouseleave", endPress);
        card.addEventListener("touchend", endPress);
        card.addEventListener("click", function (e) {
          if (longPressed) { e.preventDefault(); return; }
          try {
            sessionStorage.setItem("traces-item", c.id);
            sessionStorage.setItem("traces-from-community", "1");
          } catch (er) {}
          goTo("object.html");
        });
        if (del) {
          del.addEventListener("click", function () {
            if (c.remote) {
              // a remote item lives only in the shared worker store, under
              // its own "<id>-community" record id — never in this browser's
              // local Community list, so there's nothing local to remove
              var api = (window.TRACES_API || "").replace(/\/$/, "");
              if (api) fetch(api + "/captures/" + c.id + "-community", { method: "DELETE" }).catch(function () {});
            } else {
              Community.remove(c.id);
            }
            art.remove();
          });
        }
        return art;
      }
      items.forEach(function (c) { grid.insertBefore(build(c), grid.firstChild); });
      if (window.alignGalleryTitle) window.alignGalleryTitle();
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".gal-item")) {
          grid.querySelectorAll(".gal-delete").forEach(function (b) { b.hidden = true; });
        }
      });
    })();

    // square checkbox toggles above the grid — checking one or both narrows
    // the grid to that kind; leaving both unchecked shows everything
    (function () {
      var grid = document.querySelector(".gal-grid");
      var filters = document.getElementById("galFilters");
      if (!grid || !filters) return;
      function applyFilter() {
        var active = Array.from(filters.querySelectorAll("input:checked")).map(function (i) { return i.value; });
        grid.querySelectorAll(".gal-item").forEach(function (art) {
          art.hidden = active.length > 0 && active.indexOf(art.dataset.kind) === -1;
        });
      }
      filters.addEventListener("change", applyFilter);
    })();
  </script>

</body>
</html>
