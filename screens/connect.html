  <script>
    // Connecting an object to a space also needs a point IN the space marking
    // where that object sits. Two ways to arrive here:
    //  - from an OBJECT: pick the space now, then place the point there next.
    //  - from a SPACE (a point was already placed there): pick which object
    //    that point represents, finalizing the marker straight away.
    function connectObject(pickedKey) {
      var pendingSpotRaw = null;
      try { pendingSpotRaw = sessionStorage.getItem("traces-pending-spot"); } catch (e) {}
      if (pendingSpotRaw) {
        try {
          var spot = JSON.parse(pendingSpotRaw);
          spot.target = pickedKey;
          sessionStorage.removeItem("traces-pending-spot");
          localStorage.setItem("traces-conn-" + pickedKey, spot.space);
          sessionStorage.setItem("traces-finalize-link", JSON.stringify(spot));
          sessionStorage.setItem("traces-item", spot.space);
        } catch (e) {}
        goTo("object.html");
        return;
      }
      try {
        var cur = sessionStorage.getItem("traces-item") || "chandelier";
        localStorage.setItem("traces-conn-" + cur, pickedKey);
        sessionStorage.setItem("traces-place-link", cur);
        sessionStorage.setItem("traces-item", pickedKey);
      } catch (e) {}
      goTo("object.html");
    }
  </script>
