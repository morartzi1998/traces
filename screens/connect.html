<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Connect a capture</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260727cp">
<link rel="stylesheet" href="../css/chrome.css?v=20260727cp">
<link rel="stylesheet" href="../css/gallery.css?v=20260727cp">
<script src="../js/cursor.js?v=20260727cp" defer></script>
<script src="../js/grain.js?v=20260727cp" defer></script>
<script src="../js/archive.js?v=20260727cp"></script>
<script src="../js/blobstore.js?v=20260727cp"></script>
<script src="../js/designer-archive.js?v=20260727cp"></script>
<script src="../js/flow.js?v=20260727cp" defer></script>
</head>
<body>

  <div class="gal-screen gal--archive gal--connect">

    <header class="gal-header">
      <a class="logo gal-logo nav-corner nav-corner--tl" href="../index.html">traces</a>
      <span class="nav-link nav-corner nav-corner--tr" type="button" onclick="goTo('gallery.html')">Archive</span>
    </header>

    <h1 class="gal-connect-title">Choose Captured Object That You Wish To Connect</h1>

    <main class="gal-grid" id="galGrid"></main>

    <footer class="nav-bottom">
      <button class="nav-link nav-corner nav-corner--bl" type="button" onclick="goTo('community.html')">Community</button>
      <button class="nav-link nav-corner nav-corner--br" type="button" onclick="goTo('about.html')">About</button>
    </footer>

  </div>

  <script>
    (function () {
      var grid = document.getElementById("galGrid");

      function ago(ts) {
        if (!ts) return "just now";
        var d = Math.floor((Date.now() - ts) / 86400000);
        if (d <= 0) return "today";
        if (d === 1) return "1 day ago";
        if (d < 30) return d + " days ago";
        var m = Math.floor(d / 30);
        return m === 1 ? "a month ago" : m + " months ago";
      }

      // every connectable capture: the designer's showcase items plus
      // whatever the visitor has captured themselves (archive + community),
      // deduped so a capture only shows once even if it's in more than one list
      function buildTargets() {
        var used = {};
        var targets = [];
        (window.DESIGNER_ARCHIVE || []).forEach(function (d) {
          used[d.key] = true;
          targets.push({ id: d.key, title: d.title, img: d.img, meta: d.meta });
        });
        [window.Archive, window.Community].forEach(function (store) {
          if (!store) return;
          store.all().forEach(function (c) {
            if (used[c.id]) return;
            used[c.id] = true;
            targets.push({ id: c.id, title: c.title || "untitled capture", img: c.img, meta: ago(c.created) });
          });
        });
        return targets;
      }

      function render() {
        var targets = buildTargets();
        grid.innerHTML = "";
        targets.forEach(function (t, i) {
          var idx = ("0" + (i + 1)).slice(-2);
          var art = document.createElement("article");
          art.className = "gal-item";
          art.innerHTML =
            '<p class="gal-meta">[' + idx + ']<br>' + t.meta + '</p>' +
            '<button class="gal-card" type="button"><img alt=""><span class="gal-caption"></span></button>';
          var imgEl = art.querySelector("img");
          if (window.BlobStore) {
            window.BlobStore.url(t.img).then(function (u) {
              imgEl.src = u || "../assets/images/photo-room.png";
            });
          } else {
            imgEl.src = t.img || "../assets/images/photo-room.png";
          }
          art.querySelector(".gal-caption").textContent = t.title;
          art.querySelector(".gal-card").addEventListener("click", function () {
            connectObject(t.id);
          });
          grid.appendChild(art);
        });
      }

      render();
    })();

    // Connecting an object to a space also needs a point IN the space marking
    // where that object sits. Two ways to arrive here:
    //  - from an OBJECT: pick the space now, then place the point there next.
    //  - from a SPACE (a point was already placed there): pick which object
    //    that point represents, finalizing the marker straight away.
    function connectObject(pickedKey) {
      var pendingSpotRaw = null;
      try { pendingSpotRaw = sessionStorage.getItem("traces-pending-spot"); } catch (e) {}
      if (pendingSpotRaw) {
        try {
          var spot = JSON.parse(pendingSpotRaw);
          spot.target = pickedKey;
          sessionStorage.removeItem("traces-pending-spot");
          localStorage.setItem("traces-conn-" + pickedKey, spot.space);
          sessionStorage.setItem("traces-finalize-link", JSON.stringify(spot));
          sessionStorage.setItem("traces-item", spot.space);
        } catch (e) {}
        goTo("object.html");
        return;
      }
      try {
        var cur = sessionStorage.getItem("traces-item") || "chandelier";
        localStorage.setItem("traces-conn-" + cur, pickedKey);
        sessionStorage.setItem("traces-place-link", cur);
        sessionStorage.setItem("traces-item", pickedKey);
      } catch (e) {}
      goTo("object.html");
    }
  </script>

</body>
</html>
