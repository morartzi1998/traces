<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Studio</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260727ds">

<script>
  // owner-only: a visitor who somehow lands on the studio URL is sent home
  if (!(window.isOwnerDevice && window.isOwnerDevice())) {
    window.location.replace("../index.html");
  }
</script>
<script src="../js/config.js?v=20260727ds"></script>
<script type="importmap">
  { "imports": { "three": "../js/vendor/three/three.module.js?v=20260727ds" } }
</script>
<script src="../js/grain.js?v=20260727ds" defer></script>
<script type="module" src="../js/vendor/model-viewer.min.js?v=20260727ds"></script>
<script type="module">
  customElements.whenDefined("model-viewer").then(function () {
    customElements.get("model-viewer").dracoDecoderLocation = "../js/vendor/draco/";
  });
</script>
<style>
  /* TEMPORARY page (video mode, at Mor's request — remove when she says):
     a chrome-free stage for screen-recording beautiful moments: captures
     building side by side, slow turns, polaroid rain. Reached only by URL. */
  html, body { height: 100%; margin: 0; background: var(--color-bg, #1c1a17); overflow: hidden; }
  .studio-stage {
    position: absolute; inset: 0;
    display: flex; align-items: stretch; justify-content: center;
  }
  .studio-slot { position: relative; flex: 1 1 0; min-width: 0; }
  .studio-bar {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 40; display: flex; gap: 10px; align-items: center;
    background: rgba(20, 18, 16, 0.85); padding: 10px 14px;
    border: 1px solid rgba(240, 238, 234, 0.25);
    font-family: var(--font-caption, sans-serif); font-size: 13px;
    color: #f0eeea;
    transition: opacity 0.25s ease;
  }
  .studio-bar.faded { opacity: 0; pointer-events: none; }
  .studio-bar select, .studio-bar button {
    font: inherit; color: #f0eeea; background: transparent;
    border: 1px solid rgba(240, 238, 234, 0.4); padding: 6px 10px; cursor: pointer;
  }
  .studio-bar select { max-width: 220px; }
  .studio-bar select option { color: #111; }
  .studio-bar button:hover { border-color: #f0eeea; }
  .studio-hint { opacity: 0.55; }
  /* polaroid rain overlay */
  .studio-rain { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  .studio-card {
    position: absolute; top: -30%;
    width: min(200px, 16vw); padding: 8px 8px 30px;
    background: #f0eeea url("../assets/images/polaroid-paper-1.png") center / cover;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
    animation: studio-fall var(--dur, 5s) linear var(--delay, 0s) 1 forwards;
  }
  .studio-card img {
    display: block; width: 100%; aspect-ratio: 1 / 1.06;
    object-fit: cover;
    /* auto-saved thumbnails carry a wide empty backdrop below the object —
       bias the square crop toward the top, where the object actually sits */
    object-position: 50% 22%;
    background: #3a3a44;
  }
  @keyframes studio-fall {
    0%   { transform: translateY(0) rotate(var(--tilt, 0deg)); }
    100% { transform: translateY(165vh) rotate(calc(var(--tilt, 0deg) * -1.4)); }
  }
  /* framed mode: every object sits INSIDE a polaroid card, caption included */
  .studio-stage.framed { align-items: center; gap: 3vw; }
  .studio-stage.framed .studio-slot {
    flex: 0 1 auto;
    width: min(26vw, 440px);
    background: #f0eeea url("../assets/images/polaroid-paper-1.png") center / cover;
    padding: 14px 14px 14px;
    box-shadow: 0 16px 38px rgba(0, 0, 0, 0.6);
    transform: rotate(var(--tilt, 0deg));
  }
  .studio-win { position: relative; width: 100%; }
  .studio-stage.framed .studio-win { aspect-ratio: 1 / 1.06; background: #3f3f4a; }
  .studio-stage:not(.framed) .studio-win { position: absolute; inset: 0; }
  .studio-cap {
    display: none;
    font-family: var(--font-caption, cursive);
    color: #0a25b4; font-size: clamp(0.8rem, 1.1vw, 1.1rem);
    padding: 10px 2px 4px; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .studio-stage.framed .studio-cap { display: block; }
  /* stage backgrounds cycle: night (default) / violet / paper */
  body.bg-violet { background: linear-gradient(180deg, #45456e 0%, #2e2e50 100%); }
  body.bg-paper { background: #e8e5df url("../assets/images/paper-texture.png") center / cover; }
  body.bg-white { background: #ffffff; }
  body.bg-black { background: #050505; }
  body.bg-studio { background: radial-gradient(120% 100% at 50% 0%, #34323e 0%, #17151a 72%); }
  /* stills framing: constrain the stage to a chosen aspect ratio, centred, so
     the rest of the screen letterboxes into the background — compose a landscape
     (or square / portrait) shot and screen-grab exactly that frame */
  .studio-stage.has-aspect {
    inset: auto;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(94vw, calc(88vh * var(--ar, 1.7778)));
    height: auto;
    aspect-ratio: var(--ar, 1.7778);
    outline: 1px solid rgba(240, 238, 234, 0.28);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 30px 80px rgba(0, 0, 0, 0.5);
  }
  /* rule-of-thirds composition guide laid over the frame; toggle off before
     the actual shot */
  .studio-guide {
    position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.35) 1px, transparent 1px);
    background-size: 33.333% 33.333%;
  }
  /* per-card controls, shown on hover (never in a screenshot) */
  .studio-slot-tools {
    position: absolute; top: 8px; right: 8px; z-index: 36;
    display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s ease;
  }
  .studio-slot:hover .studio-slot-tools { opacity: 1; }
  .studio-slot-tools button {
    font: 12px/1 system-ui, sans-serif; color: #f0eeea;
    background: rgba(20, 18, 16, 0.82); border: 1px solid rgba(240, 238, 234, 0.4);
    padding: 4px 7px; cursor: pointer; border-radius: 3px;
  }
  .studio-slot-tools button:hover { border-color: #f0eeea; }
  /* reserve a clean band at the top of a framed shot for a title added
     afterwards, so the polaroids sit lower and the title never overlaps them */
  .studio-stage.framed.title-space { align-items: flex-end; padding-top: 22%; box-sizing: border-box; }
</style>
</head>
<body>

  <div class="studio-stage" id="stage"><div class="studio-guide" id="guide" hidden></div></div>
  <div class="studio-rain" id="rain"></div>

  <div class="studio-bar" id="bar">
    <select id="pick"></select>
    <button type="button" id="addBtn">add</button>
    <button type="button" id="clearBtn">clear</button>
    <button type="button" id="rebuildBtn">rebuild all</button>
    <button type="button" id="rainBtn">polaroid rain</button>
    <button type="button" id="repBtn">show as mesh</button>
    <button type="button" id="frameBtn">frames</button>
    <button type="button" id="bgBtn">background</button>
    <button type="button" id="aspectBtn">shot: fill</button>
    <button type="button" id="pauseBtn">pause spin</button>
    <button type="button" id="gridBtn">thirds</button>
    <button type="button" id="titleBtn">title space</button>
    <span class="studio-hint">H hides this bar · hover a card for ◀ ⬇ ▶ ✕</span>
  </div>

  <script type="module">
    import { mountPointCloudViewer } from "../js/point-cloud-viewer.js?v=20260727ds";
    import { deserializeGeometry } from "../js/voxelize-shared.js?v=20260727ds";

    var api = (window.TRACES_API || "").replace(/\/$/, "");
    var stage = document.getElementById("stage");
    var bar = document.getElementById("bar");
    var pick = document.getElementById("pick");
    var rain = document.getElementById("rain");
    var captures = [];
    var mounted = []; // { slot, viewer, geometry }
    var bufCache = {};
    // stills: when true, every object holds its current pose instead of turning
    var paused = false;

    fetch(api + "/captures").then(function (r) { return r.json(); }).then(function (d) {
      // every dated scan is its own stage option — the OLD chandelier (or any
      // earlier version on a capture's timeline) can star in a video too,
      // not just whatever each capture looks like today
      captures = [];
      (d.captures || []).forEach(function (c) {
        if (c.scope !== "archive") return;
        var vs = Array.isArray(c.versions)
          ? c.versions.filter(function (v) { return v && v.points && typeof v.points === "string" && v.points.indexOf("http") === 0; })
          : [];
        if (vs.length > 1) {
          vs.forEach(function (v, vi) {
            // a year names the scan best; versions that never got one fall
            // back to their position on the line so four same-named scans
            // stay tellable-apart in the picker
            var tag = v.year != null ? String(v.year) : "scan " + (vi + 1) + "/" + vs.length;
            // each version keeps ITS OWN mesh too (when it's hosted), so the
            // mesh/particles toggle works per dated scan, not only the latest
            var vModel = (typeof v.model === "string" && v.model.indexOf("http") === 0) ? v.model : null;
            captures.push({ title: (v.title || c.title) + " — " + tag,
              points: v.points, model: vModel, img: v.img || c.img, pointSize: c.pointSize || null });
          });
        } else if (c.points) {
          captures.push({ title: c.title, points: c.points,
            model: (typeof c.model === "string" && c.model.indexOf("http") === 0) ? c.model : null,
            img: c.img, pointSize: c.pointSize || null });
        }
      });
      captures.forEach(function (c, i) {
        var o = document.createElement("option");
        o.value = i; o.textContent = c.title;
        pick.appendChild(o);
      });
    });

    function loadGeometry(c) {
      if (bufCache[c.points]) return Promise.resolve(bufCache[c.points]);
      return fetch(c.points).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
        var g = deserializeGeometry(buf);
        bufCache[c.points] = g;
        return g;
      });
    }

    function mountInto(win, geometry, view) {
      var o = { autoRotate: !paused };
      if (view) o.initialView = view;
      return mountPointCloudViewer(win, geometry, o);
    }

    document.getElementById("addBtn").addEventListener("click", function () {
      var c = captures[pick.value];
      if (!c || mounted.length >= 4) return;
      var slot = document.createElement("div");
      slot.className = "studio-slot";
      slot.style.setProperty("--tilt", (Math.random() * 5 - 2.5).toFixed(1) + "deg");
      var win = document.createElement("div");
      win.className = "studio-win";
      var cap = document.createElement("div");
      cap.className = "studio-cap";
      cap.textContent = c.title;
      // per-card controls (reorder · download this one polaroid · remove),
      // revealed on hover so they never show up in a screenshot
      var tools = document.createElement("div");
      tools.className = "studio-slot-tools";
      tools.innerHTML =
        '<button type="button" data-a="left" title="move left">◀</button>' +
        '<button type="button" data-a="dl" title="download this polaroid">⬇</button>' +
        '<button type="button" data-a="right" title="move right">▶</button>' +
        '<button type="button" data-a="rm" title="remove">✕</button>';
      slot.appendChild(tools);
      slot.appendChild(win);
      slot.appendChild(cap);
      stage.appendChild(slot);
      var m = { slot: slot, win: win, viewer: null, geometry: null, capture: c };
      mounted.push(m);
      tools.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-a]");
        if (!b) return;
        if (b.dataset.a === "left") moveSlot(m, -1);
        else if (b.dataset.a === "right") moveSlot(m, 1);
        else if (b.dataset.a === "rm") removeSlot(m);
        else if (b.dataset.a === "dl") downloadPolaroid(m);
      });
      loadGeometry(c).then(function (g) {
        m.geometry = g;
        m.viewer = mountInto(win, g);
      }).catch(function () {
        // the scan's cloud couldn't be fetched/parsed — never leave a blank
        // card; fall back to the capture's saved photo so it still reads
        win.style.background = "#3f3f4a";
        if (c.img) {
          var im = document.createElement("img");
          im.crossOrigin = "anonymous";
          im.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
          im.src = c.img;
          win.appendChild(im);
        }
      });
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      mounted.forEach(function (m) { try { m.viewer.dispose(); } catch (e) {} m.slot.remove(); });
      mounted = [];
    });

    // replay the blur-to-precision build on everything currently on stage
    function rebuildAll() {
      mounted.forEach(function (m, i) {
        if (!m.viewer) return; // on the mesh side there's no build to replay
        // keep the exact framing Mor arranged by hand — the build replays
        // AT that angle and zoom instead of resetting to the default fit
        try { m.view = m.viewer.getView() || m.view; } catch (e) {}
        try { m.viewer.dispose(); } catch (e) {}
        m.win.innerHTML = "";
        // staggered: each object starts its build a beat after the previous
        setTimeout(function () { m.viewer = mountInto(m.win, m.geometry, m.view); }, i * 700);
      });
    }
    document.getElementById("rebuildBtn").addEventListener("click", rebuildAll);

    // the same particles/mesh switch the object view has — flips EVERYTHING
    // on stage at once. Mesh side auto-rotates too; the build animation
    // belongs to the particle side only.
    var showMesh = false;
    var repBtn = document.getElementById("repBtn");
    repBtn.addEventListener("click", function () {
      showMesh = !showMesh;
      repBtn.textContent = showMesh ? "show as particles" : "show as mesh";
      mounted.forEach(function (m) {
        if (m.viewer) { try { m.view = m.viewer.getView() || m.view; } catch (e) {} }
        try { m.viewer && m.viewer.dispose(); } catch (e) {}
        m.viewer = null;
        m.win.innerHTML = "";
        if (showMesh && m.capture.model) {
          var mv = document.createElement("model-viewer");
          mv.setAttribute("camera-controls", "");
          mv.setAttribute("disable-pan", "");
          mv.setAttribute("bounds", "tight");
          mv.setAttribute("interaction-prompt", "none");
          mv.setAttribute("shadow-intensity", "0");
          mv.setAttribute("exposure", "1");
          if (!paused) mv.setAttribute("auto-rotate", "");
          mv.setAttribute("rotation-per-second", "10deg");
          mv.setAttribute("auto-rotate-delay", "0");
          mv.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
          mv.src = m.capture.model;
          m.win.appendChild(mv);
        } else if (m.geometry) {
          m.viewer = mountInto(m.win, m.geometry, m.view);
        }
      });
    });

    // frames: the objects sit INSIDE polaroid cards, captions included —
    // remounting on toggle both fits the new size and replays the build
    document.getElementById("frameBtn").addEventListener("click", function () {
      stage.classList.toggle("framed");
      rebuildAll();
    });

    // stage background: night / violet (community) / paper
    var bgs = ["", "bg-violet", "bg-paper", "bg-white", "bg-black", "bg-studio"];
    var bgIdx = 0;
    document.getElementById("bgBtn").addEventListener("click", function () {
      bgIdx = (bgIdx + 1) % bgs.length;
      document.body.className = bgs[bgIdx];
    });

    // looping rain: a new card drops every beat until toggled off; each
    // card removes itself when it lands so the overlay never piles up.
    // Cards only ever use photos that have finished loading — a heavy image
    // used to fall as an empty frame before its pixels arrived
    var rainTimer = null;
    var rainBtn = document.getElementById("rainBtn");
    var rainPool = [];
    var rainWarmed = false;
    // many auto-saved thumbnails are mostly empty backdrop with a small
    // object somewhere inside — find the object by colour (anything that
    // differs from the corner backdrop) and crop the card to IT
    function objectCrop(im) {
      var w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) return im.src;
      var aw = 96, ah = Math.max(8, Math.round(aw * h / w));
      var a = document.createElement("canvas");
      a.width = aw; a.height = ah;
      var actx = a.getContext("2d");
      actx.drawImage(im, 0, 0, aw, ah);
      var d = actx.getImageData(0, 0, aw, ah).data;
      var bg = [d[0], d[1], d[2]];
      var minX = aw, minY = ah, maxX = -1, maxY = -1;
      for (var y = 0; y < ah; y++) {
        for (var x = 0; x < aw; x++) {
          var o = (y * aw + x) * 4;
          if (Math.abs(d[o] - bg[0]) + Math.abs(d[o + 1] - bg[1]) + Math.abs(d[o + 2] - bg[2]) > 48) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0 || maxX - minX < 5 || maxY - minY < 5) return null;
      // a card that is mostly backdrop (a sparse, empty-reading space scan)
      // drags the rain down — leave it out of the pool entirely
      var covered = 0;
      for (var yy = minY; yy <= maxY; yy++) {
        for (var xx = minX; xx <= maxX; xx++) {
          var oo = (yy * aw + xx) * 4;
          if (Math.abs(d[oo] - bg[0]) + Math.abs(d[oo + 1] - bg[1]) + Math.abs(d[oo + 2] - bg[2]) > 48) covered++;
        }
      }
      if (covered / (aw * ah) < 0.07) return null;
      var padX = (maxX - minX) * 0.16, padY = (maxY - minY) * 0.16;
      var sx = Math.max(0, (minX - padX) / aw * w);
      var sy = Math.max(0, (minY - padY) / ah * h);
      var sw = Math.min(w - sx, (maxX - minX + 2 * padX) / aw * w);
      var sh = Math.min(h - sy, (maxY - minY + 2 * padY) / ah * h);
      var out = document.createElement("canvas");
      out.width = 480; out.height = Math.round(480 * 1.06);
      var octx = out.getContext("2d");
      octx.fillStyle = "#3f3f4a";
      octx.fillRect(0, 0, out.width, out.height);
      // COVER, not contain: a wide room crop must fill the whole card
      // (trimming its sides a little) instead of leaving slate bars
      var sc = Math.max(out.width / sw, out.height / sh);
      var dw = sw * sc, dh = sh * sc;
      octx.drawImage(im, sx, sy, sw, sh, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
      return out.toDataURL("image/jpeg", 0.86);
    }
    function warmRainPool() {
      if (rainWarmed) return;
      rainWarmed = true;
      captures.map(function (c) { return c.img; }).filter(Boolean).forEach(function (src) {
        var im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = function () {
          var cropped = null;
          try { cropped = objectCrop(im); } catch (e) { cropped = src; }
          if (cropped) rainPool.push(cropped);
        };
        im.src = src;
      });
    }
    // deal from a shuffled deck, reshuffling only when it runs out — every
    // photo appears exactly once per round, so no card repeats while others
    // never show ("statistically there's always variety")
    var rainBag = [];
    var rainBagSize = 0;
    function nextRainSrc() {
      if (!rainBag.length || rainBagSize !== rainPool.length) {
        rainBag = rainPool.slice();
        rainBagSize = rainPool.length;
        for (var i = rainBag.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = rainBag[i]; rainBag[i] = rainBag[j]; rainBag[j] = t;
        }
      }
      return rainBag.pop();
    }
    function dropCard() {
      if (!rainPool.length) return;
      var card = document.createElement("figure");
      card.className = "studio-card";
      card.style.left = (4 + Math.random() * 88) + "%";
      card.style.setProperty("--tilt", (Math.random() * 14 - 7).toFixed(1) + "deg");
      var dur = 4.5 + Math.random() * 3;
      card.style.setProperty("--dur", dur.toFixed(2) + "s");
      card.style.margin = "0";
      var img = document.createElement("img");
      img.src = nextRainSrc();
      card.appendChild(img);
      rain.appendChild(card);
      setTimeout(function () { card.remove(); }, dur * 1000 + 300);
    }
    rainBtn.addEventListener("click", function () {
      if (rainTimer) {
        clearInterval(rainTimer);
        rainTimer = null;
        rainBtn.textContent = "polaroid rain";
        return;
      }
      warmRainPool();
      dropCard();
      rainTimer = setInterval(dropCard, 650);
      rainBtn.textContent = "stop rain";
    });

    // ----- stills: aspect-ratio shot frame -------------------------------
    // "fill" is the original full-screen stage; the rest letterbox a centred
    // frame you compose a landscape / square / portrait still inside, then
    // screen-grab exactly that frame.
    var ASPECTS = [
      { name: "fill", ar: null },
      { name: "16:9 landscape", ar: 16 / 9 },
      { name: "3:2 photo", ar: 3 / 2 },
      { name: "1:1 square", ar: 1 },
      { name: "4:5 portrait", ar: 4 / 5 },
      { name: "9:16 story", ar: 9 / 16 },
    ];
    var aspectIdx = 0;
    var aspectBtn = document.getElementById("aspectBtn");
    aspectBtn.addEventListener("click", function () {
      aspectIdx = (aspectIdx + 1) % ASPECTS.length;
      var a = ASPECTS[aspectIdx];
      aspectBtn.textContent = "shot: " + a.name;
      if (a.ar) {
        stage.style.setProperty("--ar", a.ar);
        stage.classList.add("has-aspect");
      } else {
        stage.classList.remove("has-aspect");
        stage.style.removeProperty("--ar");
      }
    });

    // ----- stills: freeze the spin so a pose holds still for the shot ----
    // (orbit any object by hand first to pose it, then pause). New objects
    // added while paused come in already still.
    var pauseBtn = document.getElementById("pauseBtn");
    function applyRotation(m) {
      if (m.viewer && m.viewer.setAutoRotate) m.viewer.setAutoRotate(!paused);
      var mv = m.win.querySelector("model-viewer");
      if (mv) { if (paused) mv.removeAttribute("auto-rotate"); else mv.setAttribute("auto-rotate", ""); }
    }
    pauseBtn.addEventListener("click", function () {
      paused = !paused;
      pauseBtn.textContent = paused ? "resume spin" : "pause spin";
      mounted.forEach(applyRotation);
    });

    // ----- stills: rule-of-thirds composition guide ----------------------
    var guide = document.getElementById("guide");
    var gridBtn = document.getElementById("gridBtn");
    gridBtn.addEventListener("click", function () {
      guide.hidden = !guide.hidden;
      gridBtn.textContent = guide.hidden ? "thirds" : "hide thirds";
    });

    // ----- reorder / remove one card -------------------------------------
    function moveSlot(m, dir) {
      var i = mounted.indexOf(m), j = i + dir;
      if (i < 0 || j < 0 || j >= mounted.length) return;
      var t = mounted[i]; mounted[i] = mounted[j]; mounted[j] = t;
      // re-append in the new order (the thirds guide stays first, on top)
      mounted.forEach(function (mm) { stage.appendChild(mm.slot); });
    }
    function removeSlot(m) {
      var i = mounted.indexOf(m);
      if (i < 0) return;
      try { m.viewer && m.viewer.dispose(); } catch (e) {}
      m.slot.remove();
      mounted.splice(i, 1);
    }

    // ----- download ONE polaroid as a PNG --------------------------------
    // composites the current 3D render (point cloud via screenshot(), mesh via
    // model-viewer.toDataURL()) onto a real polaroid: paper, photo window, and
    // the blue caption — so a single object can be saved on its own.
    function downloadPolaroid(m) {
      var shot = null;
      try { if (m.viewer && m.viewer.screenshot) shot = m.viewer.screenshot(); } catch (e) {}
      if (!shot) {
        var mv = m.win.querySelector("model-viewer");
        try { if (mv && mv.toDataURL) shot = mv.toDataURL("image/png"); } catch (e) {}
      }
      var photoSrc = shot || m.capture.img || null;
      var W = 900, PAD = 42, PHOTO = W - PAD * 2, CAP = 150, H = PAD + PHOTO + CAP;
      var canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext("2d");
      function finish() {
        var url;
        try { url = canvas.toDataURL("image/png"); }
        catch (e) { alert("couldn't export this card (cross-origin image)"); return; }
        var a = document.createElement("a");
        a.href = url;
        a.download = (m.capture.title || "polaroid").replace(/[^\w\- ]+/g, "").trim() + ".png";
        document.body.appendChild(a); a.click(); a.remove();
      }
      function caption() {
        ctx.fillStyle = "#0a25b4";
        ctx.textBaseline = "middle";
        ctx.font = "500 34px 'urw-din', system-ui, sans-serif";
        var t = m.capture.title || "";
        while (ctx.measureText(t).width > PHOTO && t.length > 1) t = t.slice(0, -1);
        ctx.fillText(t, PAD + 4, PAD + PHOTO + CAP / 2);
        finish();
      }
      function drawPhotoThen(src, done) {
        if (!src) { done(); return; }
        var p = new Image();
        p.crossOrigin = "anonymous";
        p.onload = function () {
          var sc = Math.max(PHOTO / p.width, PHOTO / p.height);
          var dw = p.width * sc, dh = p.height * sc;
          ctx.save();
          ctx.beginPath(); ctx.rect(PAD, PAD, PHOTO, PHOTO); ctx.clip();
          ctx.drawImage(p, PAD + (PHOTO - dw) / 2, PAD + (PHOTO - dh) / 2, dw, dh);
          ctx.restore();
          done();
        };
        p.onerror = done;
        p.src = src;
      }
      var paper = new Image();
      paper.onload = function () {
        ctx.drawImage(paper, 0, 0, W, H);
        ctx.fillStyle = "#3f3f4a"; ctx.fillRect(PAD, PAD, PHOTO, PHOTO);
        drawPhotoThen(photoSrc, caption);
      };
      paper.onerror = function () {
        ctx.fillStyle = "#f0eeea"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#3f3f4a"; ctx.fillRect(PAD, PAD, PHOTO, PHOTO);
        drawPhotoThen(photoSrc, caption);
      };
      paper.src = "../assets/images/polaroid-paper-1.png";
    }

    // ----- reserve a clean band at the top for a title added afterwards ---
    var titleBtn = document.getElementById("titleBtn");
    titleBtn.addEventListener("click", function () {
      var on = stage.classList.toggle("title-space");
      titleBtn.textContent = on ? "no title space" : "title space";
    });

    window.addEventListener("keydown", function (e) {
      if (e.key === "h" || e.key === "H" || e.key === "י") bar.classList.toggle("faded");
    });
  </script>

</body>
