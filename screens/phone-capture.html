<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Scan with your phone</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260727fv">
<link rel="stylesheet" href="../css/phone-capture.css?v=20260727fv">
<script src="../js/cursor.js?v=20260727fv" defer></script>
<script src="../js/vendor/heic2any.js?v=20260727fv" defer></script>
<script src="../js/normalize-image.js?v=20260727fv" defer></script>
<style>
  /* companion-screen bits: a quiet spinner while the model builds on the
     computer, and a framed preview of the finished result to save from here */
  .pc-spinner {
    width: 42px; height: 42px; margin: 0 auto 22px;
    border: 3px solid rgba(255, 255, 255, 0.22);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: pc-spin 0.9s linear infinite;
  }
  @keyframes pc-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .pc-spinner { animation-duration: 2.4s; } }
  /* the live build loader: the visitor's own photo, dimmed, with the same
     percentage the computer is showing counting up over it */
  .pc-build {
    position: relative; width: 100%; max-width: 300px; margin: 0 auto 22px;
    aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
  }
  .pc-build-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5) saturate(0.85); }
  .pc-build-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .pc-build-pct { font-family: var(--font-display, serif); font-size: 2.6rem; line-height: 1; color: #fff; }
  .pc-result-img {
    display: block; width: 100%; max-width: 320px; margin: 0 auto 20px;
    aspect-ratio: 1 / 1; object-fit: cover; border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
  }
  .pc-result-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .pc-btn--ghost { opacity: 0.75; }
</style>
</head>
<body>

  <div class="pc-screen">
    <a class="pc-logo" href="../index.html">traces</a>

    <div class="pc-card" id="pcStart">
      <h1 class="pc-title">Scan this object</h1>
      <p class="pc-sub">Take one clear photo — the model builds on your computer.</p>
      <label class="pc-btn pc-btn--solid" for="pcInput">Take a photo</label>
      <input type="file" id="pcInput" accept="image/*" capture="environment" hidden>
      <!-- no `capture` attribute: opens the phone's photo library instead of
           forcing the camera, so a picture already taken can be used -->
      <label class="pc-btn" for="pcGallery">Choose from gallery</label>
      <input type="file" id="pcGallery" accept="image/*" hidden>
    </div>

    <div class="pc-card" id="pcSending" hidden>
      <p class="pc-status">Sending your photo…</p>
    </div>

    <div class="pc-card" id="pcWaiting" hidden>
      <div class="pc-build">
        <img class="pc-build-img" id="pcWaitImg" alt="" hidden>
        <div class="pc-build-overlay">
          <div class="pc-spinner" aria-hidden="true"></div>
          <span class="pc-build-pct" id="pcWaitPct" hidden></span>
        </div>
      </div>
      <h1 class="pc-title" id="pcWaitTitle">Sent</h1>
      <p class="pc-sub" id="pcWaitSub">Confirm it on your computer — you'll watch it build here, live.</p>
      <label class="pc-btn" for="pcInput">Take another photo</label>
    </div>

    <div class="pc-card" id="pcResult" hidden>
      <h1 class="pc-title">Your model is ready</h1>
      <img class="pc-result-img" id="pcResultImg" alt="your 3D model" hidden>
      <p class="pc-sub">Continue on the computer — and you can save it here too:</p>
      <div class="pc-result-actions">
        <button class="pc-btn pc-btn--solid" type="button" id="pcDlImg">Download image</button>
        <button class="pc-btn" type="button" id="pcDlModel">Download 3D file</button>
      </div>
      <label class="pc-btn pc-btn--ghost" for="pcInput">Scan another object</label>
    </div>

    <div class="pc-card" id="pcError" hidden>
      <h1 class="pc-title">Something went wrong</h1>
      <p class="pc-sub" id="pcErrorText">Please try again.</p>
      <button class="pc-btn" type="button" id="pcRetry">Try again</button>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get("session");
      var api = (params.get("api") || "").replace(/\/$/, "");

      var start = document.getElementById("pcStart");
      var sending = document.getElementById("pcSending");
      var waiting = document.getElementById("pcWaiting");
      var result = document.getElementById("pcResult");
      var errorEl = document.getElementById("pcError");
      var errorText = document.getElementById("pcErrorText");
      var waitTitle = document.getElementById("pcWaitTitle");
      var waitSub = document.getElementById("pcWaitSub");
      var waitImg = document.getElementById("pcWaitImg");
      var waitPct = document.getElementById("pcWaitPct");
      // the small preview of the shot, shown dimmed under the live percentage so
      // the phone mirrors the computer's loader instead of a static word
      var photoPreview = null;

      function showOnly(el) {
        [start, sending, waiting, result, errorEl].forEach(function (s) { s.hidden = s !== el; });
      }

      // the desktop relays this capture's live build state back into the same
      // session pigeonhole (as a small JSON blob in the task_id field, the same
      // transport the phone used to send the photo up). Unpack whichever shape
      // is currently parked there.
      function parseRelay(d) {
        var t = d && d.task_id;
        if (typeof t !== "string" || t.charAt(0) !== "{") return {};
        try { return JSON.parse(t) || {}; } catch (e) { return {}; }
      }

      var pollTimer = null;
      function startWaiting() {
        showOnly(waiting);
        if (photoPreview) { waitImg.src = photoPreview; waitImg.hidden = false; }
        waitPct.hidden = true;
        waitTitle.hidden = false;
        waitTitle.textContent = "Sent";
        waitSub.textContent = "Confirm it on your computer — you'll watch it build here, live.";
        clearInterval(pollTimer);
        pollTimer = setInterval(function () {
          fetch(api + "/session/" + sessionId)
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var p = parseRelay(d);
              if (p.done) {
                clearInterval(pollTimer);
                showResult(p);
              } else if (p.failed) {
                clearInterval(pollTimer);
                fail("The scan didn't complete. Take another photo to try again.");
              } else if (p.building) {
                waitTitle.hidden = true;
                waitSub.textContent = "Building your model — live from the computer.";
                if (typeof p.pct === "number") {
                  waitPct.hidden = false;
                  waitPct.textContent = p.pct + "%";
                }
              }
              // otherwise the photo is still parked awaiting a confirm on the
              // computer — leave the "Sent" wording as is
            })
            .catch(function () { /* transient — keep polling */ });
        }, 2500);
      }

      // fetch the finished asset (already a worker /proxy URL, so it's
      // CORS-fetchable) and hand it to the phone as a real download; fall back
      // to just opening it if the fetch is blocked
      function download(url, filename) {
        if (!url) return;
        fetch(url)
          .then(function (r) { return r.ok ? r.blob() : null; })
          .then(function (b) {
            if (!b) { window.open(url, "_blank"); return; }
            var a = document.createElement("a");
            var u = URL.createObjectURL(b);
            a.href = u; a.download = filename;
            document.body.appendChild(a); a.click();
            setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
          })
          .catch(function () { window.open(url, "_blank"); });
      }

      function showResult(p) {
        showOnly(result);
        var img = document.getElementById("pcResultImg");
        if (p.thumb) { img.src = p.thumb; img.hidden = false; } else { img.hidden = true; }
        var dlImg = document.getElementById("pcDlImg");
        var dlModel = document.getElementById("pcDlModel");
        dlImg.style.display = p.thumb ? "" : "none";
        dlModel.style.display = p.model ? "" : "none";
        dlImg.onclick = function () { download(p.thumb, "traces-capture.jpg"); };
        dlModel.onclick = function () { download(p.model, "traces-capture.glb"); };
      }

      function fail(msg) {
        errorText.textContent = msg || "Please try again.";
        showOnly(errorEl);
      }

      if (!sessionId || !api) {
        fail("This link is missing its session — scan the QR code again from your computer.");
      }

      // a small JPEG preview of the shot, relayed to the desktop so it can
      // show the photo back for a final look before building the model
      function makeThumb(blob, maxSize) {
        return new Promise(function (resolve) {
          var img = new Image();
          var url = URL.createObjectURL(blob);
          img.onload = function () {
            var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            var c = document.createElement("canvas");
            c.width = w; c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            try { resolve(c.toDataURL("image/jpeg", 0.72)); } catch (e) { resolve(null); }
          };
          img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
          img.src = url;
        });
      }

      function onPhoto(e) {
        var file = e.target.files && e.target.files[0];
        if (!file || !sessionId || !api) return;
        showOnly(sending);

        var previewThumb = null;
        // the photo is only UPLOADED here — the paid 3D generation starts on
        // the desktop, after the person actually confirms this shot. Every
        // re-shoot used to fire its own full generation (a real scan's cost,
        // multiplied by however many tries it took to like the photo).
        window.normalizeImageToJpeg(file).then(function (jpegBlob) {
          return makeThumb(jpegBlob, 640).then(function (thumb) {
            previewThumb = thumb;
            photoPreview = thumb; // shown under the live percentage while building
            var fd = new FormData();
            fd.append("file", jpegBlob, "capture.jpg");
            return fetch(api + "/captures/upload", { method: "POST", body: fd });
          });
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || !d.url) { fail("The photo couldn't be processed."); return; }
            // the deployed relay only stores whatever's in `task_id`, so the
            // payload rides along inside it as a small JSON blob — here
            // { u: hosted photo URL, thumb } (the desktop generates from u
            // after confirm; older { t: task id } payloads still unpack too).
            var relay = JSON.stringify({ u: d.url, thumb: previewThumb || null });
            return fetch(api + "/session/" + sessionId, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ task_id: relay }),
            }).then(function () { startWaiting(); });
          })
          .catch(function () { fail("Couldn't reach the server — check your connection."); });
      }
      // both the camera and the gallery picker feed the same upload
      document.getElementById("pcInput").addEventListener("change", onPhoto);
      document.getElementById("pcGallery").addEventListener("change", onPhoto);

      document.getElementById("pcRetry").addEventListener("click", function () {
        showOnly(start);
      });
    })();
  </script>

</body>
</html>
