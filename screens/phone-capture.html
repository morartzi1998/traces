<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traces — Scan with your phone</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="stylesheet" href="https://use.typekit.net/azd1ais.css">
<link rel="stylesheet" href="../css/base.css?v=20260727h9">
<link rel="stylesheet" href="../css/phone-capture.css?v=20260727h9">
<script src="../js/cursor.js?v=20260727h9" defer></script>
<script src="../js/vendor/heic2any.js?v=20260727h9" defer></script>
<script src="../js/normalize-image.js?v=20260727h9" defer></script>
<script type="module" src="../js/vendor/model-viewer.min.js?v=20260727h9"></script>
<style>
  /* companion-screen bits: a quiet spinner while the model builds on the
     computer, and a framed preview of the finished result to save from here */
  .pc-spinner {
    width: 42px; height: 42px; margin: 0 auto 22px;
    border: 3px solid rgba(255, 255, 255, 0.22);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: pc-spin 0.9s linear infinite;
  }
  @keyframes pc-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .pc-spinner { animation-duration: 2.4s; } }
  /* the live build loader: the visitor's own photo, dimmed, with the same
     percentage the computer is showing counting up over it */
  .pc-build {
    position: relative; width: 100%; max-width: 300px; margin: 0 auto 22px;
    aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
  }
  .pc-build-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5) saturate(0.85); }
  .pc-build-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .pc-build-pct { font-family: var(--font-display, serif); font-size: 2.6rem; line-height: 1; color: #fff; }
  .pc-result-img,
  .pc-result-model {
    display: block; width: 100%; max-width: 320px; margin: 0 auto 20px;
    aspect-ratio: 1 / 1; object-fit: cover; border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    --poster-color: transparent;
  }
  .pc-result-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .pc-btn--ghost { opacity: 0.75; }
  .pc-spin-btn { display: block; margin: -8px auto 16px; padding: 8px 18px; font-size: 0.85rem; }
</style>
</head>
<body>

  <div class="pc-screen">
    <a class="pc-logo" href="../index.html">traces</a>

    <div class="pc-card" id="pcStart">
      <h1 class="pc-title">Scan this object</h1>
      <p class="pc-sub">Take one clear photo — the model builds on your computer.</p>
      <label class="pc-btn pc-btn--solid" for="pcInput">Take a photo</label>
      <input type="file" id="pcInput" accept="image/*" capture="environment" hidden>
      <!-- no `capture` attribute: opens the phone's photo library instead of
           forcing the camera, so a picture already taken can be used -->
      <label class="pc-btn" for="pcGallery">Choose from gallery</label>
      <input type="file" id="pcGallery" accept="image/*" hidden>
    </div>

    <div class="pc-card" id="pcSending" hidden>
      <p class="pc-status" id="pcSendingStatus">Sending your photo…</p>
      <!-- a slow connection with nothing counting up read as frozen — the
           text alone gave no sign of whether it was still working -->
      <div class="pc-progress" id="pcProgress" hidden>
        <div class="pc-progress-bar" id="pcProgressBar"></div>
      </div>
    </div>

    <div class="pc-card" id="pcWaiting" hidden>
      <div class="pc-build">
        <img class="pc-build-img" id="pcWaitImg" alt="" hidden>
        <div class="pc-build-overlay">
          <div class="pc-spinner" aria-hidden="true"></div>
          <span class="pc-build-pct" id="pcWaitPct" hidden></span>
        </div>
      </div>
      <h1 class="pc-title" id="pcWaitTitle">Sent</h1>
      <p class="pc-sub" id="pcWaitSub">Confirm it on your computer — you'll watch it build here, live.</p>
      <label class="pc-btn" for="pcInput">Take another photo</label>
    </div>

    <div class="pc-card" id="pcResult" hidden>
      <h1 class="pc-title">Your model is ready</h1>
      <img class="pc-result-img" id="pcResultImg" alt="your 3D model" hidden>
      <!-- reveal="manual": the poster (the same photo already sent up) stays
           up until the GLB has actually finished loading, so the phone shows
           SOMETHING the instant the build is done — same as the flat photo
           never sat on a blank frame — rather than a blank box while the
           model streams in on a slow connection -->
      <model-viewer class="pc-result-model" id="pcResultModel" tone-mapping="neutral"
        auto-rotate auto-rotate-delay="0" rotation-per-second="25deg" camera-controls
        interaction-prompt="none" shadow-intensity="0" disable-pan reveal="manual"
        loading="eager" hidden></model-viewer>
      <!-- the model spins on its own so it reads well the instant it appears,
           but there was no way to hold it still to actually look at a detail —
           dragging with camera-controls orbits the view, it doesn't stop the
           spin underneath it -->
      <button type="button" class="pc-btn pc-btn--ghost pc-spin-btn" id="pcSpinToggle" hidden>Stop spinning</button>
      <p class="pc-sub">Continue on the computer — and you can save it here too:</p>
      <!-- the 3D file is tens of MB — on a slow connection a silent fetch()
           read as the download having stalled, with no way to tell it apart
           from an actual failure -->
      <p class="pc-sub" id="pcDlStatus" hidden></p>
      <div class="pc-result-actions">
        <button class="pc-btn pc-btn--solid" type="button" id="pcDlImg">Download image</button>
        <button class="pc-btn" type="button" id="pcDlModel">Download 3D file</button>
      </div>
      <label class="pc-btn pc-btn--ghost" for="pcInput">Scan another object</label>
    </div>

    <div class="pc-card" id="pcError" hidden>
      <h1 class="pc-title">Something went wrong</h1>
      <p class="pc-sub" id="pcErrorText">Please try again.</p>
      <button class="pc-btn" type="button" id="pcRetry">Try again</button>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get("session");
      var api = (params.get("api") || "").replace(/\/$/, "");

      var start = document.getElementById("pcStart");
      var sending = document.getElementById("pcSending");
      var waiting = document.getElementById("pcWaiting");
      var result = document.getElementById("pcResult");
      var errorEl = document.getElementById("pcError");
      var errorText = document.getElementById("pcErrorText");
      var waitTitle = document.getElementById("pcWaitTitle");
      var waitSub = document.getElementById("pcWaitSub");
      var waitImg = document.getElementById("pcWaitImg");
      var waitPct = document.getElementById("pcWaitPct");
      // the small preview of the shot, shown dimmed under the live percentage so
      // the phone mirrors the computer's loader instead of a static word
      var photoPreview = null;
      var sendingStatus = document.getElementById("pcSendingStatus");
      var progressWrap = document.getElementById("pcProgress");
      var progressBar = document.getElementById("pcProgressBar");

      // fetch() has no upload-progress event at all — the request either
      // hasn't started or has already finished, nothing in between. A big
      // phone photo on a slow connection spent real minutes in that gap with
      // "Sending your photo…" the only thing on screen, indistinguishable
      // from the page having frozen. XHR's upload.onprogress is the one way
      // to report what a plain multipart POST is actually doing.
      function uploadWithProgress(url, formData, onProgress) {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", url);
          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) onProgress(e.loaded / e.total);
          };
          xhr.onload = function () {
            if (xhr.status < 200 || xhr.status >= 300) { reject(new Error("upload failed")); return; }
            try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
          };
          xhr.onerror = function () { reject(new Error("network error")); };
          xhr.send(formData);
        });
      }

      function setSendProgress(frac) {
        var pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
        progressWrap.hidden = false;
        progressBar.style.width = pct + "%";
        sendingStatus.textContent = pct >= 100 ? "Almost there…" : "Sending your photo… " + pct + "%";
      }

      function showOnly(el) {
        [start, sending, waiting, result, errorEl].forEach(function (s) { s.hidden = s !== el; });
      }

      // the desktop relays this capture's live build state back into the same
      // session pigeonhole (as a small JSON blob in the task_id field, the same
      // transport the phone used to send the photo up). Unpack whichever shape
      // is currently parked there.
      function parseRelay(d) {
        var t = d && d.task_id;
        if (typeof t !== "string" || t.charAt(0) !== "{") return {};
        try { return JSON.parse(t) || {}; } catch (e) { return {}; }
      }

      var pollTimer = null;
      function startWaiting() {
        showOnly(waiting);
        if (photoPreview) { waitImg.src = photoPreview; waitImg.hidden = false; }
        waitPct.hidden = true;
        waitTitle.hidden = false;
        waitTitle.textContent = "Sent";
        waitSub.textContent = "Confirm it on your computer — you'll watch it build here, live.";
        clearInterval(pollTimer);
        // was 2500ms — the live percentage lagging the desktop's own by up to
        // 2.5s read as the two devices being out of sync. Lightweight KV
        // read, only active during this brief handoff, so tightening it
        // costs nothing.
        pollTimer = setInterval(function () {
          fetch(api + "/session/" + sessionId)
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var p = parseRelay(d);
              if (p.done) {
                clearInterval(pollTimer);
                showResult(p);
              } else if (p.failed) {
                clearInterval(pollTimer);
                fail("The scan didn't complete. Take another photo to try again.");
              } else if (p.building) {
                waitTitle.hidden = true;
                waitSub.textContent = "Building your model — live from the computer.";
                if (typeof p.pct === "number") {
                  waitPct.hidden = false;
                  waitPct.textContent = p.pct + "%";
                }
              }
              // otherwise the photo is still parked awaiting a confirm on the
              // computer — leave the "Sent" wording as is
            })
            .catch(function () { /* transient — keep polling */ });
        }, 1000);
      }

      var dlStatus = document.getElementById("pcDlStatus");

      // fetch the finished asset (already a worker /proxy URL, so it's
      // CORS-fetchable) and hand it to the phone as a real download; fall back
      // to just opening it if the fetch is blocked. The GLB alone runs tens of
      // MB — a plain fetch().blob() gives no sign of progress until the whole
      // thing lands, which on a slow connection read as the download having
      // silently stalled. Reading the stream by hand (the same pattern the
      // desktop's own loaders use) reports real percentages instead.
      function download(url, filename) {
        if (!url) return;
        dlStatus.hidden = false;
        dlStatus.textContent = "Downloading…";
        fetch(url).then(function (r) {
          if (!r.ok) throw new Error("fetch failed");
          // the worker's /proxy route (everything here goes through it) sends
          // no Content-Length — a percentage needs a known total, which this
          // response never has. A running byte count still proves the
          // download is actually moving instead of just sitting there, which
          // is the whole point: "is this stuck or not" needs SOME number
          // ticking up, not a specific one.
          var total = +(r.headers.get("Content-Length") || 0);
          if (!r.body || !r.body.getReader) return r.blob();
          var reader = r.body.getReader();
          var chunks = [], got = 0;
          return (function pump() {
            return reader.read().then(function (res) {
              if (res.done) return new Blob(chunks);
              chunks.push(res.value);
              got += res.value.length;
              dlStatus.textContent = total
                ? "Downloading… " + Math.round((got / total) * 100) + "%"
                : "Downloading… " + (got / (1024 * 1024)).toFixed(1) + " MB";
              return pump();
            });
          })();
        })
          .then(function (b) {
            if (!b) { window.open(url, "_blank"); dlStatus.hidden = true; return; }
            saveBlob(b, filename);
            dlStatus.hidden = true;
          })
          .catch(function () { dlStatus.hidden = true; window.open(url, "_blank"); });
      }

      // <a download> quietly does nothing for a file type the phone's
      // browser has no built-in handler for — the .glb model, specifically.
      // Desktop and Android Chrome save it fine; iOS Safari (this is an
      // iPhone) can accept the click without ever writing anything to Files,
      // with no error and no visible sign that it didn't work — indistin-
      // guishable from a slow download that simply finished silently, which
      // is exactly the "doesn't download the file" report. The Web Share
      // API hands the same bytes to the OS's own native share sheet instead
      // ("Save to Files", AirDrop, etc.), which iOS actually honours for any
      // file type. Used whenever the browser supports sharing files at all;
      // the anchor-download path remains for everything else.
      function anchorDownload(blob, filename) {
        var a = document.createElement("a");
        var u = URL.createObjectURL(blob);
        a.href = u; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
      }
      function saveBlob(blob, filename) {
        var file;
        try { file = new File([blob], filename, { type: blob.type || "application/octet-stream" }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          // navigator.share() requires a live "user activation" — but this
          // only ever runs after download()'s fetch has finished, well past
          // the tap that started it. Safari can (and does) silently reject
          // the call once that activation has expired, and the old catch
          // here did nothing further — the whole download just silently went
          // nowhere, exactly the "doesn't work" report. Fall back to the
          // anchor method instead of giving up: worse UX (no native share
          // sheet) but the file actually saves.
          navigator.share({ files: [file] }).catch(function (e) {
            // AbortError = the person backed out of the share sheet on
            // purpose — leave it alone. Anything else (NotAllowedError from
            // expired activation, etc.) means the share never actually
            // happened, so still save the file the other way.
            if (e && e.name === "AbortError") return;
            anchorDownload(blob, filename);
          });
          return;
        }
        anchorDownload(blob, filename);
      }

      var resultModel = document.getElementById("pcResultModel");
      var spinBtn = document.getElementById("pcSpinToggle");
      spinBtn.addEventListener("click", function () {
        if (resultModel.hasAttribute("auto-rotate")) {
          resultModel.removeAttribute("auto-rotate");
          spinBtn.textContent = "Resume spinning";
        } else {
          resultModel.setAttribute("auto-rotate", "");
          spinBtn.textContent = "Stop spinning";
        }
      });
      function showResult(p) {
        showOnly(result);
        var img = document.getElementById("pcResultImg");
        // the poster IS the same photo already sent up (or the finished
        // thumb, once relayed) — showing it the instant the build is done,
        // before the GLB has moved a single byte, is what makes this feel as
        // immediate as the computer's own reveal. The rotating model then
        // replaces it in place once it has actually finished loading.
        var poster = p.thumb || photoPreview || null;
        if (p.model) {
          img.hidden = true;
          resultModel.hidden = false;
          resultModel.removeAttribute("poster");
          if (poster) resultModel.setAttribute("poster", poster);
          try { resultModel.showPoster(); } catch (e) {}
          resultModel.addEventListener("load", function onLoad() {
            resultModel.removeEventListener("load", onLoad);
            try { resultModel.dismissPoster(); } catch (e) {}
          });
          resultModel.src = p.model;
          spinBtn.hidden = false;
          resultModel.setAttribute("auto-rotate", "");
          spinBtn.textContent = "Stop spinning";
        } else if (poster) {
          resultModel.hidden = true;
          img.src = poster;
          img.hidden = false;
          spinBtn.hidden = true;
        } else {
          resultModel.hidden = true;
          img.hidden = true;
          spinBtn.hidden = true;
        }
        var dlImg = document.getElementById("pcDlImg");
        var dlModel = document.getElementById("pcDlModel");
        dlImg.style.display = p.thumb ? "" : "none";
        dlModel.style.display = p.model ? "" : "none";
        dlImg.onclick = function () { download(p.thumb, "traces-capture.jpg"); };
        dlModel.onclick = function () { download(p.model, "traces-capture.glb"); };
      }

      function fail(msg) {
        errorText.textContent = msg || "Please try again.";
        showOnly(errorEl);
      }

      if (!sessionId || !api) {
        fail("This link is missing its session — scan the QR code again from your computer.");
      }

      // a small JPEG preview of the shot, relayed to the desktop so it can
      // show the photo back for a final look before building the model
      function makeThumb(blob, maxSize) {
        return new Promise(function (resolve) {
          var img = new Image();
          var url = URL.createObjectURL(blob);
          img.onload = function () {
            var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            var c = document.createElement("canvas");
            c.width = w; c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            try { resolve(c.toDataURL("image/jpeg", 0.72)); } catch (e) { resolve(null); }
          };
          img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
          img.src = url;
        });
      }

      function onPhoto(e) {
        var file = e.target.files && e.target.files[0];
        if (!file || !sessionId || !api) return;
        showOnly(sending);
        progressWrap.hidden = true;
        progressBar.style.width = "0%";
        sendingStatus.textContent = "Preparing your photo…";

        var previewThumb = null;
        // the photo is only UPLOADED here — the paid 3D generation starts on
        // the desktop, after the person actually confirms this shot. Every
        // re-shoot used to fire its own full generation (a real scan's cost,
        // multiplied by however many tries it took to like the photo).
        window.normalizeImageToJpeg(file).then(function (jpegBlob) {
          return makeThumb(jpegBlob, 640).then(function (thumb) {
            previewThumb = thumb;
            photoPreview = thumb; // shown under the live percentage while building
            sendingStatus.textContent = "Sending your photo… 0%";
            var fd = new FormData();
            fd.append("file", jpegBlob, "capture.jpg");
            return uploadWithProgress(api + "/captures/upload", fd, setSendProgress);
          });
        })
          .then(function (d) {
            if (!d || !d.url) { fail("The photo couldn't be processed."); return; }
            // the deployed relay only stores whatever's in `task_id`, so the
            // payload rides along inside it as a small JSON blob — here
            // { u: hosted photo URL, thumb } (the desktop generates from u
            // after confirm; older { t: task id } payloads still unpack too).
            var relay = JSON.stringify({ u: d.url, thumb: previewThumb || null });
            return fetch(api + "/session/" + sessionId, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ task_id: relay }),
            }).then(function () { startWaiting(); });
          })
          .catch(function () { fail("Couldn't reach the server — check your connection."); });
      }
      // both the camera and the gallery picker feed the same upload
      document.getElementById("pcInput").addEventListener("change", onPhoto);
      document.getElementById("pcGallery").addEventListener("change", onPhoto);

      document.getElementById("pcRetry").addEventListener("click", function () {
        showOnly(start);
      });
    })();
  </script>

</body>
</html>
